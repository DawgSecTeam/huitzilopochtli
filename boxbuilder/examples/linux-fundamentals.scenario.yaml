# Example huitzilopochtli scenario for a practice box.
#
# These checks are the *scoring* side: each awards points for correctly
# HARDENING the thing the matching nakon vuln plants as INSECURE. The agent
# authors BOTH this file and the nakon config (which vulns to plant); boxbuilder
# pairs them. See boxbuilder/README.md.
#
# Pairing in this example (vuln -> check that verifies the hardening):
#   nginx (service)              -> nginx_up      (SLA: service stays up)
#   ssh-root-login (misconfig)   -> ssh_no_root   (PermitRootLogin must be "no")
#   suid-find (misconfig)        -> no_suid_find  (no world-writable suid files)
#
# Run `nakon catalog show nginx ssh-root-login suid-find --json` to inspect the
# planting scripts these checks correspond to.

scenario:
  name: "Linux Fundamentals"
  version: 1
  mode: honor               # change to "ranked" + add engine_url for ranked mode
  hosts: ["localhost"]

checks:
  # --- service uptime (pairs with the `nginx` service vuln) ---
  - id: nginx_up
    type: service_state
    category: vuln
    display: "nginx is running"
    max_points: 10
    collect:
      service: nginx
      expect_state: active
    expect:
      equals: "active"
      points: 10
      # SLA (continuous uptime scoring) applies ONLY in ranked mode, where the
      # engine supplies a trusted clock. In honor mode (offline) it is ignored.
      # For ranked, add a sla block with the real SlaParams fields:
      #   sla: {interval_s: 60, points_per_interval: 1, hysteresis_fail_n: 2,
      #         hysteresis_ok_n: 2, max_intervals_per_checkin: 3}

  # --- misconfig hardening (pairs with `ssh-root-login`) ---
  - id: ssh_no_root
    type: file_regex
    category: vuln
    display: "Disabled SSH root login"
    max_points: 5
    collect:
      path: /etc/ssh/sshd_config
      extract: '^\s*PermitRootLogin\s+(\S+)'
    expect:
      equals: "no"
      points: 5

  # --- misconfig hardening (pairs with `suid-find`) ---
  - id: no_suid_find
    type: permission
    category: vuln
    display: "No world-writable SUID binaries"
    max_points: 5
    collect:
      # Collects SUID binaries; the evaluator checks none are world-writable.
      path: /usr/bin
      mode_mask: "u+s"
    expect:
      contains: ""        # no world-writable SUID files expected
      points: 5
