# Example huitzilopochtli scenario for a practice box.
#
# These checks are the *scoring* side: each awards points for correctly
# HARDENING the thing the matching nakon vuln plants as INSECURE. The agent
# authors BOTH this file and the nakon config (which vulns to plant); boxbuilder
# pairs them. See boxbuilder/README.md.
#
# Pairing in this example (vuln -> check that verifies the hardening):
#   nginx (service)              -> nginx_up      (SLA: service stays up)
#   ssh-root-login (misconfig)   -> ssh_no_root   (PermitRootLogin must be "no")
#   suid-find (misconfig)        -> no_suid_find  (SUID bit removed from `find`)
#
# Run `nakon catalog show nginx ssh-root-login suid-find --json` to inspect the
# planting scripts these checks correspond to.
#
# IMPORTANT for authors copying this file: `expect`'s equals/not_equals/
# contains/regex predicates default `field` to "matched" (the raw evidence key
# `file_regex` happens to use). Every OTHER check type uses its own field
# names (see each collector's docstring in agent/checks/) and MUST set
# `field:` explicitly in `expect`, or the check silently fails with
# "raw evidence missing field 'matched'" regardless of box state. This bit
# both `nginx_up` and `no_suid_find` below until `field:` was added.

scenario:
  name: "Linux Fundamentals"
  version: 1
  mode: honor               # change to "ranked" + add engine_url for ranked mode
  hosts: ["localhost"]

checks:
  # --- service uptime (pairs with the `nginx` service vuln) ---
  - id: nginx_up
    type: service_state
    category: vuln
    display: "nginx is running"
    max_points: 10
    collect:
      service: nginx
    expect:
      # service_state's raw evidence is {"active": bool, "enabled": bool}
      # (agent/checks/service_state.py) -- no "matched" key, so `field` must
      # be set explicitly, and the expected value must be a real bool, not
      # the string "active".
      equals: true
      field: active
      points: 10
      # SLA (continuous uptime scoring) applies ONLY in ranked mode, where the
      # engine supplies a trusted clock. In honor mode (offline) it is ignored.
      # For ranked, add a sla block with the real SlaParams fields:
      #   sla: {interval_s: 60, points_per_interval: 1, hysteresis_fail_n: 2,
      #         hysteresis_ok_n: 2, max_intervals_per_checkin: 3}

  # --- misconfig hardening (pairs with `ssh-root-login`) ---
  - id: ssh_no_root
    type: file_regex
    category: vuln
    display: "Disabled SSH root login"
    max_points: 5
    collect:
      path: /etc/ssh/sshd_config
      extract: '^\s*PermitRootLogin\s+(\S+)'
    expect:
      equals: "no"
      points: 5

  # --- misconfig hardening (pairs with `suid-find`) ---
  - id: no_suid_find
    type: permission
    category: vuln
    display: "SUID bit removed from find"
    max_points: 5
    collect:
      # suid-find plants the setuid bit on the `find` binary itself (chmod +s
      # $(which find)) -- stat the binary directly, not its containing dir.
      path: /usr/bin/find
    expect:
      # permission's raw evidence is {"mode": "0NNNN", "uid", "gid", "exists"}
      # -- again no "matched" key, so `field` must be explicit. mode_at_most
      # passes when actual has no bits set beyond max_mode; 0755 excludes the
      # setuid bit (04000), so this fails while planted and passes once the
      # author removes it (chmod -s /usr/bin/find).
      mode_at_most: true
      field: mode
      max_mode: "0755"
      points: 5
