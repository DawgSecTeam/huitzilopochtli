# Xubuntu XFCE VM connection details: observatory-01, a full clone of the
# "solar-observatory-template" (Proxmox vmid 149 as of 2026-09-08; a full
# clone straight from the "xubuntu-vnc" template, vmid 119 -- same pattern
# as chocolate-factory's vmid 108 round, see boxbuilder/REDEPLOY.md's
# "Gotchas hit on the 108 round"). This box ships neither `ubuntu` nor
# `sysadmin`: template prep created a sudo-capable `obsadmin` account (the
# LightDM/desktop autologin, and the account boxbuilder's ssh provider
# connects as) and removed the stock `sysadmin` account with `deluser
# --remove-home sysadmin`. The xubuntu-vnc display fix
# (boxbuilder/examples/assets/fix-xubuntu-vnc-display.sh) was run with
# `obsadmin` as the login-user argument before sealing.
#
# provider.host below is whatever IP this specific clone happens to get from
# DHCP at build time -- it WILL go stale once that clone is destroyed. Point
# it at your own clone's current IP before running boxbuilder, and connect as
# `obsadmin` (the only authorized account). Don't assume a box's IP is stable
# for its whole lifetime either -- it can change on a lease renewal.
scenario: solar-observatory.scenario.yaml
nakon_config: solar-observatory.nakon.json
provider:
  name: ssh
  host: 10.0.0.11
  port: 22
  user: obsadmin
  password: obsadmin
# authoring_key: ./solar-observatory.authoring.key
