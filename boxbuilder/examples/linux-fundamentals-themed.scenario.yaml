# Themed variant of linux-fundamentals.scenario.yaml -- identical checks (see that file
# for the vuln/check pairing notes), plus a `theme:` block demonstrating box theming
# (see boxbuilder/README.md "Theming" and nakon/README.md "Theming"). A sibling file
# rather than a change to the canonical example, so the plain (untheme'd) worked
# example stays exactly as authors have always seen it.

scenario:
  name: "Linux Fundamentals"
  version: 1
  mode: honor
  hosts: ["localhost"]

checks:
  - id: nginx_up
    type: service_state
    category: vuln
    display: "nginx is running"
    max_points: 10
    collect:
      service: nginx
    expect:
      equals: true
      field: active
      points: 10

  - id: ssh_no_root
    type: file_regex
    category: vuln
    display: "Disabled SSH root login"
    max_points: 5
    collect:
      path: /etc/ssh/sshd_config
      extract: '^\s*PermitRootLogin\s+(\S+)'
    expect:
      equals: "no"
      points: 5

  - id: no_suid_find
    type: permission
    category: vuln
    display: "SUID bit removed from find"
    max_points: 5
    collect:
      path: /usr/bin/find
    expect:
      mode_at_most: true
      field: mode
      max_mode: "0755"
      points: 5

theme:
  title: "Operation Featherstorm"
  organization: "DawgSec"
  accent: "#c8102e"
  logo: assets/logo.png
  wallpaper: assets/wallpaper.png
  readme: assets/README.md
  motd: |
    Authorized use only. All activity is monitored and logged.
  forensics_questions:
    - "What port is the mail server listening on?"
    - "Which user account was created without authorization?"
  # No desktop_shortcuts here -- the "Scoring Report" launcher (pointing at
  # $INSTALL_DIR/report.html) is added automatically for any themed scenario; see
  # boxbuilder/theme.py::resolve_theme_for_nakon. Set include_report_shortcut: false
  # to opt out, or add more entries under desktop_shortcuts: [{name, exec}, ...].
