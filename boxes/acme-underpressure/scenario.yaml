    exec: sh -c 'xdg-open $HOME/Documents/huitzilopochtli/README.html'
forensics:
- id: fq-root-key-comment
  points: 10
  question: An attacker key sits in root's authorized_keys and is re-dropped every 15 minutes. What is the comment
    string on that key entry?
  answer: updater@acme.anvil
  solution: '`cat /root/.ssh/authorized_keys` (before removing it) - the planted entry''s comment is `updater@acme.anvil`.
    Read it before the self-heal timer re-adds it.'
- id: fq-beacon-destination
  points: 10
  question: A systemd unit disguised as a health check beacons out with SYN-only packets. What is the destination
    host:port in its ExecStart line?
  answer: 203.0.113.66:443
  answers:
  - 203.0.113.66 443
  - 203.0.113.66:443
  solution: '`systemctl cat acme-health-check` - ExecStart=/opt/tide-sync/tide-syncd -t 203.0.113.66 -p 443 ...
    The destination is 203.0.113.66:443.'
- id: fq-suid-path
  points: 10
  question: A SUID-root copy of bash is hidden outside /bin. What is its full path?
  answer: /usr/lib/.acme-health
  solution: '`find / -xdev -perm -4000 -type f` and compare each against a known-good SUID baseline; the bash-sized
    outlier is /usr/lib/.acme-health.'
- id: fq-hidden-unit
  points: 10
  question: One enabled unit file is backdated to 2022 on a 2026 image and no package owns its binary. What is the
    unit name (without the .service suffix)?
  answer: dbus-resolver
  answers:
  - dbus-resolver.service
  solution: '`ls -l --time-style=full-iso /etc/systemd/system/*.service` - dbus-resolver.service carries mtime 2022-03-23;
    `dpkg -S /usr/sbin/dbus-resolver` owns nothing.'
- id: fq-uid0-account
  points: 10
  question: Besides root, name one account in /etc/passwd with UID 0.
  answer: svc-health
  answers:
  - daemon
  - daemon:x:0
  solution: '`awk -F: ''$3==0'' /etc/passwd` shows root, svc-health and a uid-0 daemon. Either svc-health or daemon
    scores.'
- id: fq-pam-harvester
  points: 10
  question: A pam_exec line with expose_authtok is baked into the PAM password stack. What is the full module path
    it invokes?
  answer: /usr/share/locale/en/unicode.so
  solution: '`grep -r expose_authtok /etc/pam.d/` - the line reads `password optional pam_exec.so quiet expose_authtok
    /usr/share/locale/en/unicode.so` in common-password.'
- id: fq-selfheal-timer
  points: 10
  question: A systemd timer re-creates a NOPASSWD sudo account every 15 minutes. What is the timer's basename (no
    .timer suffix)?
  answer: acme-health
  answers:
  - acme-health.timer
  solution: '`systemctl list-timers` shows acme-health.timer with a 15min interval; `systemctl cat acme-health.service`
    shows it re-creating svc-update and the sudoers drop-in.'
- id: fq-des-hash
  points: 10
  question: The webmail account has a legacy 13-character DES crypt hash inline in /etc/passwd field 2. What is
    that hash string?
  answer: wGqpOl2Em1uv6
  solution: '`awk -F: ''length($2)==13'' /etc/passwd` - the webmail account carries the inline DES hash wGqpOl2Em1uv6.'
- id: fq-apt-hook
  points: 10
  question: An apt hook re-plants persistence on every apt run. What is the basename of the hook file in /etc/apt/apt.conf.d?
  answer: 99-acme-health
  answers:
  - /etc/apt/apt.conf.d/99-acme-health
  solution: '`grep -rl Post-Invoke /etc/apt/apt.conf.d/` - 99-acme-health wires APT::Update::Post-Invoke-Success
    to the re-plant helper.'
- id: fq-masked-count
  points: 10
  question: How many units are masked by the attacker via symlinks in /etc/systemd/system (exclude the stock distro
    masks under /usr/lib)?
  answer: '14'
  solution: 'Count /etc/systemd/system symlinks pointing at /dev/null: `for f in /etc/systemd/system/*; do [ -L
    "$f" ] && [ "$(readlink $f)" = /dev/null ] && echo $f; done | wc -l` = 14 (13 dormant services + auditd).'
- id: fq-dc-admins
  points: 10
  question: The seized DC evidence in the stale response kit shows two ordinary users added to Domain Admins minutes
    into the attack. Name one of them. (Answer before you delete the kit.)
  answer: Speedy Gonzales
  answers:
  - Marvin Martian
  - Speedy Gonzales and Marvin Martian
  - Speedy Gonzales, Marvin Martian
  solution: 'Read /var/tmp/bluekit/dc-evidence/dc-addendum-excerpt.md first: 4729/4737 added ''Speedy Gonzales''
    and ''Marvin Martian'' to Domain Admins.'
- id: fq-dsinternals-disguise
  points: 10
  question: In the same seized DC evidence, DSInternals was imported disguised as a module. What module name was
    used? (Answer before you delete the kit.)
  answer: DNSCache
  answers:
  - DNSCache module
  - dnscache
  solution: 'The excerpt''s 4104 entry: DSInternals imported twice disguised as a module named DNSCache.'
ranked:
  engine_url: http://127.0.0.1:8080
  services:
  - id: ssh
    display: SSH daemon (port 22)
    type: tcp_port
    collect:
      host: 127.0.0.1
      port: 22
    expect:
      equals: true
      field: open
    interval_s: 60
    points_per_interval: 1
    max_intervals_per_checkin: 3
  - id: web
    display: Acme web storefront (HTTP, port 80)
    type: http_uptime
    collect:
      url: http://127.0.0.1/
    expect:
      equals: 200
      field: status
    interval_s: 60
    points_per_interval: 1
    max_intervals_per_checkin: 3
  - id: db
    display: MariaDB (port 3306)
    type: tcp_port
    collect:
      host: 127.0.0.1
      port: 3306
    expect:
      equals: true
      field: open
    interval_s: 60
    points_per_interval: 1
    max_intervals_per_checkin: 3
  - id: mongo
    display: MongoDB (port 27017)
    type: tcp_port
    collect:
      host: 127.0.0.1
      port: 27017
    expect:
      equals: true
      field: open
    interval_s: 60
    points_per_interval: 1
    max_intervals_per_checkin: 3
  - id: vault
    display: Vault secrets service (port 8200, loopback)
    type: http_uptime
    collect:
      url: http://127.0.0.1:8200/v1/sys/health
    expect:
      equals: 200
      field: status
    interval_s: 60
    points_per_interval: 1
    max_intervals_per_checkin: 3
  adversary:
    events:
    - id: acme-flush-fw
      action: flush_firewall
      window_s:
      - 900
      - 1200
      affects_check: web
    - id: acme-kill-db
      action: kill_service
      params:
        service: mariadb
      window_s:
      - 1800
      - 2400
      affects_check: db
    - id: acme-drop-marker
      action: drop_inert_artifact
      params:
        path: acme-marker.txt
      window_s:
      - 2700
      - 3300
  pool:
    template_vm_id: ${HUITZILOPOCHTLI_POOL_TEMPLATE_VM_ID}
    template_vm_access_method: ssh
    template_vm_username: ${HUITZILOPOCHTLI_POOL_TEMPLATE_USER}
    template_vm_password: ${HUITZILOPOCHTLI_POOL_TEMPLATE_PASSWORD}
    vm_count: 4
    guac_link_ttl_seconds: 14400
