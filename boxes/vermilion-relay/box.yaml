# Vermilion Deep-Space Relay: the pre-CDE capstone LINUX hardening box. GUI
# Xubuntu XFCE, honor mode, 80 scored hardening checks + 3 penalty guards + 8
# forensics questions. It is the "final boss" of the Linux track -- it pulls
# together the whole vulnerability universe from chocolate-factory,
# coral-reef-station, solar-observatory, static-pine-radio and opochtli-landing,
# and adds new categories (sudoers GTFObin escalation, SUID-root backdoors, file
# capabilities, sysctl hardening, /etc/hosts poisoning, telnet/FTP/rsh/TFTP, NFS
# no_root_squash, Samba guest shares, Apache banner/indexing, exposed webroot
# files, anonymous MySQL user, weak login.defs). Teams are NOT expected to clear
# it in one sitting; an answer key is handed out afterward.
#
# LINEAGE: full clone of "workshop-template-xubuntu-vnc" (Proxmox vmid 119),
# the same GUI base chocolate-factory/coral-reef/solar-observatory clone from
# (119 descends from the original "xubuntu" 904). 119 is UNPATCHED, so on a
# fresh clone you MUST run
# boxes/shared/fix-xubuntu-vnc-display.sh BEFORE `boxbuilder build` (screen0/
# Virtual-1 wallpaper mismatch + machine-id fix). The authorized operator /
# greeter login is `relayadmin` (the only legitimate account on the roster).
# Following the coral/solar prep pattern, `relayadmin` ALSO serves as
# boxbuilder's ssh-provider login (create it sudo-capable during prep), and the
# stock `sysadmin` account is removed once `relayadmin` exists -- so the sealed
# template has exactly one sudo member and one greeter tile.
#
# A legitimate apache2 + php + mariadb relay-telemetry web stack is baked in
# during PREP (not by nakon) so the Apache/web/db hardening checks have a real
# service to harden. Snapshot ONLY after all prep is done (the 121/135 lesson).
#
# provider.host below is whatever IP this specific clone gets from DHCP at build
# time -- it WILL go stale once that clone is destroyed/reprovisioned; point it
# at your own clone's current IP before running `boxbuilder build` (DHCP is
# fine, and a lease can change mid-lifetime too).
scenario: scenario.yaml
nakon_config: nakon.json
provider:
  name: ssh
  host: 10.0.0.60
  port: 22
  user: relayadmin
  password: relayadmin
# authoring_key: ./authoring.key
