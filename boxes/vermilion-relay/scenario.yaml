# Scored forensics questions (CyberPatriot-style): teams type answers into
# Forensics-Questions.txt on the Desktop; the agent re-grades each pass. Each
# question is a breadcrumb -- the investigation that answers it also surfaces a
# scored hardening finding, so note the answer BEFORE you clean.
forensics:
  - id: fq-hidden-root
    question: "One non-root account was given UID 0 (full root power). Type that account's username."
    answer: "nightwatch"
    points: 8
    solution: |
      List every UID-0 account; the hidden root is whichever name is not
      `root`:

      ```
      awk -F: '$3 == 0 {print $1}' /etc/passwd
      root
      nightwatch
      ```

      Answer: `nightwatch`. Finding this is also how you clear the "no second
      UID-0 account" check -- note the name before you delete the account.

  - id: fq-beacon-destination
    question: "The telemetry-uplink beacon calls home to an address off the relay. Type the destination as IP:port."
    answer: "203.0.113.66:8443"
    answers: ["203.0.113.66"]
    points: 8
    solution: |
      The beacon holds no port, so find it by process and unit review, then
      read the destination out of the binary:

      ```
      systemctl status telemetry-uplink.service
      strings /opt/telemetry-uplink/uplink-relayd | grep 8443
      203.0.113.66:8443
      ```

      Answer: `203.0.113.66:8443`. The same look tells you which process and
      service to stop for the beacon findings.

  - id: fq-sudo-account
    question: "One unauthorized account was added to the sudo group. Type that account's username."
    answer: "vega"
    points: 8
    solution: |
      Group membership is one command:

      ```
      getent group sudo
      sudo:x:27:relayadmin,vega
      ```

      The roster names `relayadmin` as the only administrator, so the answer
      is `vega`. Note it before you remove the account or clean the group.

  - id: fq-bind-shell-port
    question: "A backdoor bind shell listens for incoming connections. On which TCP port?"
    answer: "4444"
    points: 8
    solution: |
      A bind shell advertises itself as a listener:

      ```
      ss -tlnp | grep ncat
      LISTEN 0 1 0.0.0.0:4444 users:(("ncat",...))
      ```

      Answer: `4444`. Owning that listener (via `systemctl status <pid>`) is
      how you find the `system-update.service` launcher to disable.

  - id: fq-suid-backdoor
    question: "An unauthorized setuid-root binary was planted outside the system directories. Type its full path."
    answer: "/usr/local/bin/relay-diag"
    points: 8
    solution: |
      Hunt setuid-root files in the places a backdoor hides:

      ```
      find /usr/local /opt /home /srv /tmp -xdev -type f -perm -4000 2>/dev/null
      /usr/local/bin/relay-diag
      ```

      Answer: `/usr/local/bin/relay-diag` (a setuid copy of a shell). Removing
      it clears the matching hardening check.

  - id: fq-persistence-timer
    question: "A systemd timer re-launches the implant on a schedule. Type the timer's unit filename."
    answer: "relay-resync.timer"
    answers: ["relay-resync"]
    points: 8
    solution: |
      List the timers and read the suspicious one:

      ```
      systemctl list-timers --all | grep resync
      relay-resync.timer -> relay-resync.service
      ```

      Answer: `relay-resync.timer`. Disabling and deleting it (with its
      service and payload) is the paired hardening finding.

  - id: fq-ldpreload-lib
    question: "A shared object is injected into every program via /etc/ld.so.preload. Type the full path of that .so file."
    answer: "/opt/void/libvoidhook.so"
    points: 8
    solution: |
      Read the global preload file:

      ```
      cat /etc/ld.so.preload
      /opt/void/libvoidhook.so
      ```

      Answer: `/opt/void/libvoidhook.so`. Removing the entry and the file
      clears the ld.so.preload finding.

  - id: fq-hosts-redirect
    question: "An update/relay hostname was redirected in /etc/hosts. Type the IP address it was pointed at."
    answer: "10.66.6.6"
    points: 8
    solution: |
      Read /etc/hosts for a mapping that does not belong:

      ```
      cat /etc/hosts
      10.66.6.6   security.ubuntu.com updates.vermilion.example
      ```

      Answer: `10.66.6.6`. Deleting that line clears the /etc/hosts finding.
