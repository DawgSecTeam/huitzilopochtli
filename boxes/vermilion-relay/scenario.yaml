      ```

      **3. Confirm** the file is gone.

  - id: persistence_timer_gone
    type: command_json
    category: vuln
    display: "HARD: The relay-resync systemd timer and its payload are disabled and removed"
    max_points: 8
    collect:
      script: |
        if systemctl is-enabled relay-resync.timer >/dev/null 2>&1; then echo false; exit 0; fi
        if systemctl is-active relay-resync.timer >/dev/null 2>&1; then echo false; exit 0; fi
        if [ -e /etc/systemd/system/relay-resync.timer ] || [ -e /etc/systemd/system/relay-resync.service ] || [ -e /opt/void/relay-resync ]; then echo false; exit 0; fi
        echo true
    expect:
      equals: true
      field: data
      points: 8
    solution: |
      **1. List all timers.** A timer is the systemd version of cron
      persistence:

      ```
      systemctl list-timers --all | grep resync
      systemctl cat relay-resync.timer relay-resync.service
      ```

      The `.timer` fires `relay-resync.service`, which re-plants the payload.
      `relay-resync.timer` is forensics Q6.

      **2. Disable and delete the timer, its service, and its payload:**

      ```
      sudo systemctl disable --now relay-resync.timer
      sudo rm -f /etc/systemd/system/relay-resync.timer /etc/systemd/system/relay-resync.service /opt/void/relay-resync
      sudo systemctl daemon-reload
      ```

      **3. Confirm** the timer is not active or enabled and none of the three
      files remain.

  - id: at_job_removed
    type: command_json
    category: vuln
    display: "MODERATE: The queued at(1) job is removed (no future appointment)"
    max_points: 4
    collect:
      script: |
        n=$(atq 2>/dev/null | grep -c .)
        echo "$n"
    expect:
      equals: 0
      field: data
      points: 4
    solution: |
      **1. Read the at queue.** A one-shot `at` job can re-plant everything
      long after you think the box is clean:

      ```
      atq
      1  Wed ... a root
      at -c 1        # show what job 1 will run
      ```

      **2. Remove the queued job(s):**

      ```
      atrm 1        # or: for j in $(atq | awk '{print $1}'); do atrm "$j"; done
      ```

      Leave the `atd` daemon running (a penalty applies if you stop it).

      **3. Confirm** `atq` prints nothing.

  - id: initd_persistence_gone
    type: command_json
    category: vuln
    display: "MODERATE: The legacy SysV init script and its boot links are gone"
    max_points: 4
    collect:
      script: |
        if [ -e /etc/init.d/voidlink ] || ls /etc/rc*.d/*voidlink >/dev/null 2>&1; then echo false; else echo true; fi
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Check the SysV init path.** systemd still honors `/etc/init.d`
      scripts and their `rc?.d` symlinks:

      ```
      ls -l /etc/init.d/voidlink
      ls -l /etc/rc*.d/ | grep voidlink
      ```

      **2. Remove the script and its boot links:**

      ```
      sudo update-rc.d -f voidlink remove
      sudo rm -f /etc/init.d/voidlink
      ```

      **3. Confirm** the script is gone and no `rc?.d` symlink names it.

  - id: rc_local_clean
    type: command_json
    category: vuln
    display: "MODERATE: /etc/rc.local no longer launches the payload at boot"
    max_points: 4
    collect:
      script: |
        if [ -e /etc/rc.local ] && grep -qE '/opt/void|void-sync' /etc/rc.local; then echo false; else echo true; fi
    expect:
      equals: true
      field: data
      points: 4
    solution: |
