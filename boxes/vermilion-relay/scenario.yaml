      runs for every interactive login shell:

      ```
      ls -l /etc/profile.d/
      cat /etc/profile.d/zz-void.sh
      ```

      **2. Delete it:**

      ```
      sudo rm -f /etc/profile.d/zz-void.sh
      ```

      **3. Confirm** the file is gone.

  - id: bashrc_beacon_gone
    type: command_json
