      ```

      **3. Confirm** `grep void /etc/rc.local` finds nothing.

  - id: ld_preload_gone
    type: command_json
    category: vuln
    display: "MODERATE: The ld.so.preload implant is gone from the loader config and from disk"
    max_points: 4
    collect:
      script: |
        if { [ -e /etc/ld.so.preload ] && grep -q 'libvoidhook' /etc/ld.so.preload; } || [ -e /opt/void/libvoidhook.so ]; then echo false; else echo true; fi
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Read the global preload file.** Every library listed in
      `/etc/ld.so.preload` is injected into every dynamically linked program:

      ```
