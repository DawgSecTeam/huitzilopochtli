      script: |
        if [ -e /home/relaydash/.config/systemd/user/void-user.service ]; then echo false; exit 0; fi
        if [ -e /var/lib/systemd/linger/relaydash ]; then echo false; exit 0; fi
        echo true
    expect:
      equals: true
      field: data
      points: 8
    solution: |
      **1. systemd runs for users too.** Each account has a private user
      manager, and `loginctl enable-linger` makes it start at boot with no
      login, so a service there is boot-persistent and almost invisible:

      ```
      ls -l /home/relaydash/.config/systemd/user/
      ls -l /var/lib/systemd/linger/
      ```

      **2. Delete the user unit and turn off linger:**

      ```
      sudo rm -f /home/relaydash/.config/systemd/user/void-user.service
      sudo loginctl disable-linger relaydash
      ```

      **3. Confirm** the unit file is gone and
      `/var/lib/systemd/linger/relaydash` no longer exists.

  - id: relaydash_keys_clean
    type: command_json
    category: vuln
    display: "MODERATE: No attacker key remains in the relaydash account's authorized_keys"
    max_points: 4
    collect:
      script: |
        f=/home/relaydash/.ssh/authorized_keys
        if [ ! -e "$f" ] || ! grep -q 'voidkey@relay' "$f" 2>/dev/null; then echo true; else echo false; fi
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Sweep every account's authorized_keys, not just the admin's.** A
      decoy account is a quiet place to keep a spare key:

      ```
      for h in /home/*; do echo "== $h =="; cat "$h/.ssh/authorized_keys" 2>/dev/null; done
      ```

      `relaydash` carries the same `voidkey@relay` key as the others.

      **2. Remove the key** (or the whole file for this decoy account):

      ```
      sudo rm -f /home/relaydash/.ssh/authorized_keys
      ```

      **3. Confirm** the file is gone or no longer names `voidkey@relay`.

  # ====================================================================
  # K. Baseline hygiene
  # ====================================================================
  - id: relay_log_not_world_writable
    type: permission
    category: vuln
    display: "EASY: The relay log file is not world-writable"
    max_points: 2
    collect:
      path: /var/log/relay/relay.log
    expect:
      mode_at_most: true
      field: mode
      max_mode: "0640"
      points: 2
    solution: |
      **1. Check the mode.** A world-writable log lets any user forge or erase
      the record of what happened on the box:

      ```
      stat -c '%a %n' /var/log/relay/relay.log      # 666
      ```

      **2. Tighten it:**

      ```
      sudo chmod 640 /var/log/relay/relay.log
      ```

      **3. Confirm** `stat -c %a` reads `640` or stricter.

  - id: no_world_writable_path_dir
    type: command_json
    category: vuln
    display: "MODERATE: No directory on the system PATH is world-writable (PATH hijack)"
    max_points: 4
    collect:
      script: |
        n=0
        for d in /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin; do
          [ -d "$d" ] || continue
          perm=$(stat -L -c '%a' "$d")
          case "$perm" in *[2367]) n=$((n+1));; esac
        done
        echo "$n"
    expect:
      equals: 0
      field: data
      points: 4
    solution: |
      **1. Check the permissions of the binary directories.** If a directory
      on root's PATH is world-writable, any user can drop a trojan named after
      a common command and wait for root to run it:

      ```
      for d in /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin; do stat -c '%a %n' "$d"; done
      777 /usr/local/bin
      ```

      **2. Restore the standard mode:**

      ```
      sudo chmod 755 /usr/local/bin
      ```

      **3. Confirm** none of those directories are group- or world-writable
      (mode should be 755).

  - id: no_rhosts_trust
    type: command_json
    category: vuln
    display: "EASY: No .rhosts or hosts.equiv trust files grant passwordless remote access"
    max_points: 2
    collect:
      script: |
        if [ -e /etc/hosts.equiv ] || ls /root/.rhosts /home/*/.rhosts 2>/dev/null | grep -q .; then echo false; else echo true; fi
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Look for legacy trust files.** An `.rhosts` or `/etc/hosts.equiv`
      file (especially one containing `+ +`) tells the r-services to trust
      remote users with no password:

      ```
      ls -la /root/.rhosts /home/*/.rhosts /etc/hosts.equiv 2>/dev/null
      cat /home/relaydash/.rhosts
      + +
      ```

      **2. Delete them:**

      ```
      sudo rm -f /etc/hosts.equiv /root/.rhosts /home/*/.rhosts
      ```

      **3. Confirm** none of those files remain.

  # ====================================================================
  # Penalty guards (downside only -- surgical removal, not scorched earth)
  # ====================================================================
  - id: penalty_cron_healthy
    type: service_state
    category: penalty
    display: "PENALTY: The cron daemon is not running (you broke the schedule instead of evicting the payload)"
    max_points: 10
    collect:
      service: cron
    expect:
      equals: true
      field: active
      points: -10
    solution: |
      This only ever subtracts: if `cron` is not active, 10 points come off.
      Stopping the cron daemon does stop the attacker's cron jobs, and also
      every legitimate job, log rotation, and the relay's own automation.
      Evict the attacker's JOBS, keep the DAEMON: `systemctl status cron`
      should read `active (running)`. If you stopped it,
      `systemctl unmask cron 2>/dev/null; systemctl start cron`.

  - id: penalty_atd_healthy
    type: service_state
    category: penalty
    display: "PENALTY: The atd daemon is not running (emptying the queue is the fix, not killing the daemon)"
    max_points: 10
    collect:
      service: atd
    expect:
      equals: true
      field: active
      points: -10
    solution: |
      This only ever subtracts. The at(1) finding is fixed by removing the
      queued job with `atrm`, not by stopping `atd`. Keep the daemon running:
      `systemctl status atd` should read `active (running)`.

  - id: penalty_ssh_reachable
    type: db_query
    category: penalty
    display: "PENALTY: The SSH management path is unreachable (locked yourself out with the firewall?)"
    max_points: 10
    collect:
      host: 127.0.0.1
      port: 22
    expect:
      equals: true
      field: ok
      points: -10
    solution: |
      This only ever subtracts: the moment 127.0.0.1:22 stops answering, 10
      points come off. On this box that happens when the firewall task is done
      backwards -- enabling `ufw` with a deny-incoming default before allowing
      port 22. Do the firewall exceptions FIRST, the default LAST:
      `ufw allow 22/tcp` before `ufw enable`. Check yourself with
      `timeout 3 bash -c '</dev/tcp/127.0.0.1/22' && echo ssh-alive`.

