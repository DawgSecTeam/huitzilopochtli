      sudo rm -f /opt/void/libvoidhook.so
      # if ld.so.preload is now empty, removing it is fine:
      sudo rm -f /etc/ld.so.preload   # only if empty
      ```

      **3. Confirm** the loader config no longer names the library and the
      `.so` is gone.

