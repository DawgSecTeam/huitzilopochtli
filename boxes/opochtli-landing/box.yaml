# Xubuntu XFCE VM connection details: opochtli-landing-01, a full clone of the
# "opochtli-landing-template" (Proxmox vmid 135 as of 2026-09-13, sealed from a
# full clone of the "xubuntu-vnc" template, vmid 119). Template history: the
# first seal (vmid 121) shipped two prep-order defects -- the stock `sysadmin`
# account still present (it stole the forensics answers file from harbormaster)
# and no LightDM autologin session -- caught by a post-seal spot-check clone,
# so 121 was destroyed and the corrected image was re-sealed as 135 from that
# spot-check clone. Lesson: a pre-deploy-clean snapshot only covers the
# DEPLOY cycle; any prep steps done after it (account surgery, display fix)
# are NOT in the rollback, so spot-check a fresh clone of the sealed template
# before calling a round done. The candidate rounds hit the node-wide
# qemu-guest-agent breakage (agents dead on every VM for ~a day; a first-boot
# unattended-upgrade pull installs a matching qga and the agent comes back
# after a reboot) and heavy-node IO stalls that made agent runs hang in
# D-state for minutes -- if a report looks stale, check the agent service's
# MainPID state before suspecting the manifest. The sealed image carries the
# UPDATED qemu-guest-agent (the upgrade survives the seal).
#
# This box ships neither `ubuntu` nor `sysadmin`: template prep created a
# sudo-capable `harbormaster` account (the LightDM/desktop autologin, and the
# account boxbuilder's ssh provider connects as) and removed the stock
# `sysadmin` account. The xubuntu-vnc display fix
# (boxes/shared/fix-xubuntu-vnc-display.sh) was run with `harbormaster` as the
# login-user argument before sealing (twice: once to lay down the autologin
# config, again after the autologin session was live so the xfconf writes hit
# the real session bus), and /etc/machine-id was wiped empty immediately
# before `qm template`.
#
# Firewall-box notes: the plant PURGES ufw (boxbuilder/vulndb_vuln_configs/
# ufw-removed.json) so installing it is the first scored finding, and it
# plants an attacker backdoor iptables rule (TEST-NET-2 source, live +
# /etc/iptables/rules.v4) plus a raw-socket C2 beacon (cache-prune.service,
# TEST-NET-3 destination baked into the binary, listens on NO port) and a
# docking-agent TCP listener on 31337. iptables-persistent is deliberately
# NOT preinstalled. The template's net0 is untrustedbr,firewall=1 (guests
# DHCP 192.168.100.0/24 behind untrusted-gateway); for a build round,
# stop the clone and rebridge it to vmbr0 (PUT net0=model=virtio,bridge=vmbr0,
# firewall=0) so the dev host can reach it, then rebridge before re-sealing.
#
# provider.host below is whatever IP this specific example clone happens to
# get from DHCP at build time -- it WILL go stale once that clone is
# destroyed. Point it at your own clone's current IP before running
# boxbuilder, and connect as `harbormaster` (the only authorized account).
# Don't assume a box's IP is stable for its whole lifetime either -- it can
# change on a lease renewal.
scenario: scenario.yaml
nakon_config: nakon.json
provider:
  name: ssh
  host: 10.0.0.126
  port: 22
  user: harbormaster
  password: harbormaster
# authoring_key: ./authoring.key
