# Debian 13 CLI box (huitz terminal console -- NO desktop, NO VNC): players
# connect over SSH (Guacamole ssh link from the portal) and use `huitz score`,
# `huitz readme`, `huitz watch`, `huitz forensics`. This is the v2 rebuild of
# the v1 xubuntu-VNC box (template 135 / pool code N2ZH7, retired) -- same
# harbor theme, same difficulty-weighted ledger, but the firewall material is
# now RAW IPTABLES and the box runs a real service stack worth protecting:
# apache2 + PHP "Cargo Manifest Lookup" on port 80 backed by local MariaDB on
# 127.0.0.1:3306 (all installed during TEMPLATE PREP, not planted).
#
# Template lineage: opochtli-landing-cli-template, sealed 2026-09-15 from a
# full clone of the "debian13-lite" template (Proxmox vmid 920/951 lineage).
# TEMPLATE PREP (before any nakon plant): create harbormaster (sudo, bash,
# ~/Desktop -- the huitz CLI's snapshot + forensics files land there),
# apt-install iptables ncat nmap (Debian 13 splits ncat out of nmap; the
# bind-shell unit hardcodes /usr/bin/ncat) apache2 libapache2-mod-php
# php-mysql -- NO local database -- and deploy /var/www/html/index.php, which
# reads manifests from the SHARED port-authority MariaDB.
#
# SHARED DB DEPENDENCY: the web app and two scored checks need
# workshop-shared-mariadb (Proxmox vmid 147, untrustedbr, DHCP-reserved
# 192.168.100.10) reachable at 192.168.100.10:3306 -- db portauthority, user
# portauthority@192.168.100.% (SELECT only, password manifest-db, bound to
# 0.0.0.0). It is always-on (onboot=1). If the DB VM is down, the web app
# shows no data and default_deny_all's DB probe fails through no fault of the
# student; the template's Proxmox VM description states the same.
# Snapshot AFTER all prep, then plant/install/
# verify/rollback -- a pre-deploy snapshot does NOT cover prep steps (the v1
# round shipped a template missing its autologin for exactly this reason).
#
# Attacker material planted by this config: cockpit (unneeded web console,
# 0.0.0.0:9090), system-update.service (ncat root bind shell on 0.0.0.0:4444;
# the catalog row enables but does NOT start it -- start it manually in the
# build loop, clones start it at boot), and tide-sync.service
# (realm-beacon / DISASTEROUS_PHARMACY: raw-socket SYN forger toward
# 10.233.0.66:8443 every 30s, listens on NO port, journal silenced).
#
# Firewall-box notes: this challenge scores RAW IPTABLES only (checks read
# iptables-save signatures; ufw's chain layout does not satisfy them).
# iptables-persistent is deliberately NOT preinstalled -- rules that don't
# survive a reboot come back failing, which is the lesson. The template's
# net0 is untrustedbr,firewall=1 (guests DHCP 192.168.100.0/24 behind
# untrusted-gateway); for a build round, stop the clone and rebridge it to
# vmbr0 (PUT net0=model=virtio,bridge=vmbr0,firewall=0) so the dev host can
# reach it, then rebridge before re-sealing.
#
# provider.host below is whatever IP this specific example clone happens to
# get from DHCP at build time -- it WILL go stale once that clone is
# destroyed. Point it at your own clone's current IP before running
# boxbuilder, and connect as `harbormaster` (sudo password: harbormaster).
scenario: scenario.yaml
nakon_config: nakon.json
provider:
  name: ssh
  host: 192.168.100.CHANGE-ME
  port: 22
  user: harbormaster
  password: harbormaster
# authoring_key: ./authoring.key
