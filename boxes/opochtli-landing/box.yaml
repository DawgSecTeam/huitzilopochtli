# Xubuntu XFCE VM connection details: opochtli-landing-01, a full clone of the
# "opochtli-landing-template" (Proxmox vmid TBD as of 2026-09, sealed from a
# full clone of the "xubuntu-vnc" template, vmid 119 -- the same base the
# solar-observatory template lineage uses). This box ships neither `ubuntu` nor
# `sysadmin`: template prep created a sudo-capable `harbormaster` account (the
# LightDM/desktop autologin, and the account boxbuilder's ssh provider connects
# as) and removed the stock `sysadmin` account. The xubuntu-vnc display fix
# (boxes/shared/fix-xubuntu-vnc-display.sh) was run with `harbormaster` as the
# login-user argument before sealing (twice: once to lay down the autologin
# config, again after the autologin session was live so the xfconf writes hit
# the real session bus), and /etc/machine-id was wiped empty immediately
# before `qm template`.
#
# Firewall-box notes: ufw is expected to be present on the base image but
# INACTIVE (stock Ubuntu behavior) -- the insecure baseline is "no host
# firewall", so nothing plants it. iptables-persistent is deliberately NOT
# preinstalled (installing it is part of the rules_persist_reboot exercise for
# raw-iptables teams). The planted raw-socket beacon requires CAP_NET_RAW and
# runs as root from its unit; its C2 destination is an RFC 5737 TEST-NET
# address that dies at the default gateway.
#
# provider.host below is whatever IP this specific example clone happens to
# get from DHCP at build time -- it WILL go stale once that clone is
# destroyed. Point it at your own clone's current IP before running
# boxbuilder, and connect as `harbormaster` (the only authorized account).
# Don't assume a box's IP is stable for its whole lifetime either -- it can
# change on a lease renewal.
scenario: scenario.yaml
nakon_config: nakon.json
provider:
  name: ssh
  host: 10.0.0.11
  port: 22
  user: harbormaster
  password: harbormaster
# authoring_key: ./authoring.key
