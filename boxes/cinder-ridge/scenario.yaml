      **1. Read the per-user policy Run key:**

      ```
      reg query "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run"
          StatementSync    REG_SZ    powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "C:\ProgramData\VendorTelemetry\stmtsync.ps1"
      ```

      **2. Delete the value:**

      ```
      reg delete "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run" /v StatementSync /f
