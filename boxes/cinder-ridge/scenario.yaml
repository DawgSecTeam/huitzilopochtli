# Cinder Ridge Credit Union: a registry-persistence WINDOWS challenge box.
#
# Theme: a teller workstation compromised by a fake "StatementSync" updater.
# The intruder left persistence in the registry and weakened the baseline
# controls. Twenty scored checks (6 EASY x8 + 8 MODERATE x12 + 6 HARD x16 =
# 240) plus six scored forensics questions (6 x 10 = 60) = 300 points.
#
# Structure: every planted artifact pairs with a check that awards the
# hardened state. The Run/RunOnce family uses HKLM, HKCU and policy keys; the
# service family uses ImagePath, an unquoted path, ServiceDll and
# FailureCommand; the logon/loader family uses Winlogon Userinit, IFEO,
# AppInit/AppCert and Active Setup; the misconfiguration family uses UAC,
# Defender, WDigest, LSA PPL, SMB1 and AlwaysInstallElevated.
#
# Name discipline: every SERVICE_NAME / VALUE_NAME / PAYLOAD_PATH / GUID in
# nakon.json MUST match its paired check's collect params byte-identically --
# nothing cross-validates. The HKCU checks resolve the local account SID at
# collect time and mount C:\Users\<user>\NTUSER.DAT when the hive is not
# already loaded (the agent runs as SYSTEM, so plain HKCU is SYSTEM's hive).
#
# Forensics-answer hygiene: no check display string names a planted value,
# service, account or path. The six answers are deliberately absent from the
# handbook; teams must investigate before they clean.
#
# Difficulty: EASY 6 (HKLM Run, HKLM RunOnce, UAC, WDigest, SMB1,
# AlwaysInstallElevated); MODERATE 8 (HKCU Run, both policy Run keys, unquoted
# service path, FailureCommand, Userinit, IFEO, LSA PPL); HARD 6 (HKCU RunOnce
# in a standard user's hive, service ImagePath, ServiceDll, AppInit/AppCert,
# Active Setup, Defender).

scenario:
  name: "Cinder Ridge Credit Union"
  version: 1
  mode: honor
  hosts: ["localhost"]

checks:
  # --- A. RUN / RUNONCE -----------------------------------------------------
  - id: hklm_run_autorun_removed
    type: registry_value
    category: vuln
    display: "EASY: The machine-wide logon autorun is removed"
    max_points: 8
    timeout_s: 20
    collect:
      hive: HKLM
      key: SOFTWARE\Microsoft\Windows\CurrentVersion\Run
      value: WinUpdaterSvc
    expect:
      equals: false
      field: present
      points: 8
    solution: |
      **1. Read the machine Run key.** Everything under it launches at every
      interactive logon:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run"
          WinUpdaterSvc    REG_SZ    powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "C:\ProgramData\VendorTelemetry\winupd.ps1"
      ```

      A "vendor updater" that starts a hidden PowerShell script from a
      ProgramData staging directory is not an updater. Record the value NAME
      before deleting it -- it is a forensics answer.

      **2. Delete the value** (not the whole key -- legitimate values may live
      beside it):

      ```
      reg delete "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" /v WinUpdaterSvc /f
      ```

      **3. Confirm.** The query above no longer lists the value. The payload
      script has its own cleanup task.

  - id: hklm_runonce_autorun_removed
    type: registry_value
    category: vuln
    display: "EASY: The machine-wide one-shot logon autorun is removed"
    max_points: 8
    timeout_s: 20
    collect:
      hive: HKLM
      key: SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce
      value: DriverBoost
    expect:
      equals: false
      field: present
      points: 8
    solution: |
      **1. Read the machine RunOnce key.** RunOnce executes once at the next
      logon (for an administrator) and is then removed by Windows:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce"
          DriverBoost    REG_SZ    cmd.exe /c "C:\ProgramData\VendorTelemetry\drvboost.cmd"
      ```

      **2. Note the command, then delete the value:**

      ```
      reg delete "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce" /v DriverBoost /f
      ```

      **3. Confirm.** The RunOnce query returns no DriverBoost value. The
      dropper path is a forensics answer; record it before cleanup.

  - id: hkcu_run_autorun_removed
    type: powershell_json
    category: vuln
    display: "MODERATE: The administrator's per-user logon autorun is removed"
    max_points: 12
    timeout_s: 90
    collect:
      script: |
        $mutex = New-Object -TypeName System.Threading.Mutex -ArgumentList $false, 'Global\HuitzHiveAccess'
        $acquired = $false
        try {
            try { $acquired = $mutex.WaitOne(30000) } catch [System.Threading.AbandonedMutexException] { $acquired = $true }
            if (-not $acquired) { throw 'timed out waiting for hive access' }
            $user = 'sysadmin'
            $rel = 'Software\Microsoft\Windows\CurrentVersion\Run'
            $value = 'EdgeSyncHelper'
            $filter = 'LocalAccount=True AND Name=' + [char]39 + $user + [char]39
            $u = Get-CimInstance Win32_UserAccount -Filter $filter -ErrorAction Stop
            if ($null -eq $u) { throw ('user not found: ' + $user) }
            $loaded = Test-Path -LiteralPath ('Registry::HKEY_USERS\' + $u.SID)
            $tmpDir = $null
            if ($loaded) {
                $regPath = 'HKU\' + $u.SID + '\' + $rel
            } else {
                $hive = 'C:\Users\' + $user + '\NTUSER.DAT'
                if (-not (Test-Path -LiteralPath $hive)) { throw ('hive not found: ' + $hive) }
                $tmpDir = 'C:\Windows\Temp\huitz-' + [guid]::NewGuid().ToString('N')
                New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
                Copy-Item -Path ($hive + '*') -Destination $tmpDir -Force -ErrorAction Stop
                $tmpHive = Join-Path $tmpDir 'NTUSER.DAT'
                & reg.exe load 'HKU\HuitzCheckRun' $tmpHive | Out-Null
                if ($LASTEXITCODE -ne 0) { throw ('reg load failed: ' + $tmpHive) }
                $regPath = 'HKU\HuitzCheckRun\' + $rel
            }
            try {
                & reg.exe query $regPath /v $value 2>&1 | Out-Null
                $present = ($LASTEXITCODE -eq 0)
            } finally {
                if (-not $loaded) {
                    & reg.exe unload 'HKU\HuitzCheckRun' | Out-Null
                    if ($tmpDir) { Remove-Item -LiteralPath $tmpDir -Recurse -Force -ErrorAction Ignore }
                }
            }
            (-not $present) | ConvertTo-Json -Compress
        } finally {
            if ($acquired) { $mutex.ReleaseMutex() }
            $mutex.Dispose()
        }
    expect:
      equals: true
      field: data
      points: 12
    solution: |
      **1. Read the current user's Run key.** The student session is the
      administrator account, so `HKCU` is the right hive while logged in:

      ```
      reg query "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run"
          EdgeSyncHelper    REG_SZ    powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "C:\Users\sysadmin\AppData\Roaming\EdgeSync\edgesync.ps1"
      ```

      **2. Delete the value:**

      ```
      reg delete "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" /v EdgeSyncHelper /f
      ```

      **3. Confirm.** The query no longer lists it. The check mounts the
      account's `NTUSER.DAT` when the hive is not loaded, so it also sees the
      value after a logoff.

  - id: hkcu_runonce_autorun_removed
    type: powershell_json
    category: vuln
    display: "HARD: The standard user's one-shot logon autorun is removed"
    max_points: 16
    timeout_s: 90
    collect:
      script: |
        $mutex = New-Object -TypeName System.Threading.Mutex -ArgumentList $false, 'Global\HuitzHiveAccess'
        $acquired = $false
        try {
            try { $acquired = $mutex.WaitOne(30000) } catch [System.Threading.AbandonedMutexException] { $acquired = $true }
            if (-not $acquired) { throw 'timed out waiting for hive access' }
            $user = 'teller1'
            $rel = 'Software\Microsoft\Windows\CurrentVersion\RunOnce'
            $value = 'TeamsUpdate'
            $filter = 'LocalAccount=True AND Name=' + [char]39 + $user + [char]39
            $u = Get-CimInstance Win32_UserAccount -Filter $filter -ErrorAction Stop
            if ($null -eq $u) { throw ('user not found: ' + $user) }
            $loaded = Test-Path -LiteralPath ('Registry::HKEY_USERS\' + $u.SID)
            $tmpDir = $null
            if ($loaded) {
                $regPath = 'HKU\' + $u.SID + '\' + $rel
            } else {
                $hive = 'C:\Users\' + $user + '\NTUSER.DAT'
                if (-not (Test-Path -LiteralPath $hive)) { throw ('hive not found: ' + $hive) }
                $tmpDir = 'C:\Windows\Temp\huitz-' + [guid]::NewGuid().ToString('N')
                New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
                Copy-Item -Path ($hive + '*') -Destination $tmpDir -Force -ErrorAction Stop
                $tmpHive = Join-Path $tmpDir 'NTUSER.DAT'
                & reg.exe load 'HKU\HuitzCheckRunOnce' $tmpHive | Out-Null
                if ($LASTEXITCODE -ne 0) { throw ('reg load failed: ' + $tmpHive) }
                $regPath = 'HKU\HuitzCheckRunOnce\' + $rel
            }
            try {
                & reg.exe query $regPath /v $value 2>&1 | Out-Null
                $present = ($LASTEXITCODE -eq 0)
            } finally {
                if (-not $loaded) {
                    & reg.exe unload 'HKU\HuitzCheckRunOnce' | Out-Null
                    if ($tmpDir) { Remove-Item -LiteralPath $tmpDir -Recurse -Force -ErrorAction Ignore }
                }
            }
            (-not $present) | ConvertTo-Json -Compress
        } finally {
            if ($acquired) { $mutex.ReleaseMutex() }
            $mutex.Dispose()
        }
    expect:
      equals: true
      field: data
      points: 16
    solution: |
      **1. Find the account.** `sysadmin` is the only administrator; a second,
      standard local account exists for the teller. `Get-LocalUser` or
      `lusrmgr.msc` shows it.

      **2. Load that account's hive** (it is not the logged-in account, so
      `HKCU` will not show it). Either use `regedit` > `HKEY_USERS` > File >
      Load Hive on `C:\Users\teller1\NTUSER.DAT`, or from an elevated prompt:

      ```
      reg load HKU\teller1 "C:\Users\teller1\NTUSER.DAT"
      reg query "HKU\teller1\Software\Microsoft\Windows\CurrentVersion\RunOnce"
          TeamsUpdate    REG_SZ    powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "C:\Users\teller1\AppData\Local\Temp\teamsupd.ps1"
      ```

      **3. Delete the value and unload the hive:**

      ```
      reg delete "HKU\teller1\Software\Microsoft\Windows\CurrentVersion\RunOnce" /v TeamsUpdate /f
      reg unload HKU\teller1
      ```

      **4. Confirm.** Re-load and re-query: the value is gone. The account
      name is a forensics answer; record it before cleanup.

  - id: hklm_policy_run_removed
    type: registry_value
    category: vuln
    display: "MODERATE: The machine policy autorun is removed"
    max_points: 12
    timeout_s: 20
    collect:
      hive: HKLM
      key: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
      value: VendorPulse
    expect:
      equals: false
      field: present
      points: 12
    solution: |
      **1. Check the policy Run key.** Explorer also honors a Run list under
      `Policies\Explorer`, separate from the classic Run key:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run"
          VendorPulse    REG_SZ    powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "C:\ProgramData\VendorTelemetry\pulse.ps1"
      ```

      **2. Delete the value:**

      ```
      reg delete "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run" /v VendorPulse /f
      ```

      **3. Confirm.** The query no longer lists VendorPulse.

