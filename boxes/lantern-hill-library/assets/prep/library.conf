# Lantern Hill Community Library -- catalog site (apache reverse proxy
# in front of library-app.service on 127.0.0.1:8080).
<VirtualHost *:80>
    ServerName catalog.lanternhill-library.org
    ServerAdmin it@lanternhill-library.org
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/library-error.log
    CustomLog ${APACHE_LOG_DIR}/library-access.log combined
</VirtualHost>
