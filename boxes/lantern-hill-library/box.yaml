# Lantern Hill Community Library: incident-response workshop box (huitz
# terminal console -- NO desktop, NO VNC): players connect over SSH
# (Guacamole ssh link from the portal) and use `huitz score`, `huitz
# readme`, `huitz watch`, `huitz forensics`. Built for the incident-
# response workshop (heavy focus on logging and reading logs): ONE
# intrusion, four correlated evidence sources. The intruder ("inkmoth",
# documentation IP 203.0.113.7) brute-forced SSH, drove the catalog app's
# unauthenticated admin hook to tamper with holds and export patrons,
# then planted OS-level persistence (cron + systemd timer + service +
# uid-0 account + sudoers + authorized key + loader implant + a second
# sshd + a portless beacon) and an anti-forensics log wiper -- while the
# box's four flight recorders (login journal, auditd with rules loaded
# BEFORE the plants, the app's service journal, and MariaDB's general
# query log) wrote it all down. TWENTY-FIVE planted/baked findings, one
# scored check each, difficulty-weighted (10 EASY x5 + 10 MODERATE x10 +
# 5 HARD x20 = 250), two penalties (-10 each: the catalog app and the
# database must stay up -- no kill-the-service-to-fix-it; service_state +
# db_query, chosen because an http probe returns ERROR evidence on a
# stopped service, and ERROR evidence never applies a penalty), and a
# 13-question forensics block (13 x 10 = 130; 380 grand total, -20
# penalty floor).
#
# Template lineage: challenge-lantern-hill-library-template (Proxmox vmid
# 135), sealed 2026-10-05 as a FULL clone of base-debian13-lite-fix (vmid
# 951; the static-pine lineage's base). Validated end-to-end on the build
# clone: planted baseline Total 20 (0 vuln fixed; the only passing checks
# are the two KEEP-THE-RECORDERS protective findings, auditd + db query
# log, which are won at boot and lost only if broken), penalties 0,
# forensics 0 of 13 blank; then the scripted harden to Total 380 / 25 of
# 25 / forensics 13 of 13 (on the identical vuln rubric; the penalty entry
# was re-verified separately: stopping library-app -> PENALTIES -10 ->
# restored), a Q2 forensics probe (+10 answered, 0 blanked), and a
# fresh-clone seal-check: boots planted at Total 20 / 2 of 25 / forensics
# 0 of 13 with the hosts redirect INTACT after first boot (prep patches
# /etc/cloud/templates/hosts.debian.tmpl -- the Proxmox cloudinit seed's
# user-data sets manage_etc_hosts: true and outranks cloud.cfg.d, so
# cloud-init re-renders /etc/hosts per instance; a cloud.cfg.d override
# loses the merge -- verified the hard way). Machine-id wiped at seal;
# /root/lantern-prep and all build logs removed (they carry the answer
# key in the replay script). Forensics answers file pinned to
# /home/librarian/Desktop/Forensics-Questions.txt.
#
# TEMPLATE PREP (before ANY nakon plant -- see assets/prep/prep-notes.md
# for the full recipe; stage the prep dir at /root/lantern-prep):
#   01-packages.sh   apt stack (apache2, mariadb, flask/pymysql/paramiko,
#                    auditd, rsyslog) + rsyslog enabled
#   02-accounts.sh   librarian (sudo, player) + catalogsvc (service, KEEP),
#                    hostname lanternhill-catalog, tz America/New_York,
#                    PRE-BAKED weak sshd drop-in 99-catalog-remote.conf
#                    (root cause; the 3 sshd checks grade the hardened
#                    effective state via sshd -T), root password set for
#                    the replay, stray sysadmin/ubuntu users deleted
#   03-database.sh   library DB + seed rows + library_app account +
#                    general query log ON -> /var/log/mysql/general.log
#   04-app.sh        /opt/library app + library-app.service (stdout ->
#                    journald) + apache :80 reverse proxy
#   05-auditd-journal.sh  auditd + 75-library-ir.rules loaded
#                    (augenrules --load) + persistent journald
#   90-attacker-replay.py  THE BREAK-IN: loopback alias 203.0.113.7,
#                    ssh guessing run (4 fails -> accepted) + web session
#                    (spoofed X-Forwarded-For, patrons export, 3 hold
#                    cancellations) -- the four logs now all tell one story
#   SNAPSHOT AFTER ALL PREP (a pre-deploy snapshot does not cover prep),
#   then compile --rebuild-bundle / plant / install per boxbuilder.
#
# Build loop notes: rebridge the build clone to vmbr0 (net0=model=virtio,
# bridge=vmbr0,firewall=0) for the build; rebridge to untrustedbr
# (firewall=1) before sealing. The timer plant fires OnBootSec=5min after
# first boot -- the recurring UPDATE lines in the query log are the
# plant working, not a build failure. The loopback alias 203.0.113.7 is
# NOT persistent across reboot (by design -- the LOGS carry the story).
# provider.host below is whatever IP this specific build clone happens
# to get from DHCP -- it WILL go stale.
scenario: scenario.yaml
nakon_config: nakon.json
provider:
  name: ssh
  host: 192.168.100.CHANGE-ME
  port: 22
  user: librarian
  password: librarian
