# Harborline Transit Authority: the pre-CDE capstone WINDOWS hardening box --
# the Windows twin of vermilion-relay. Single domain controller "har-dc01"
# for harborline.local; the theme is flavor only, every task is solvable from
# ordinary Windows/AD evidence (dsa.msc, gpmc.msc, secpol.msc, services.msc,
# registry, Task Scheduler, Get-NetFirewall*, Get-MpComputerStatus,
# Get-ADUser/Get-ADGroupMember/Get-Acl, auditpol, icacls).
#
# It is the "final boss" of the Windows track: it consolidates the whole
# Windows vulnerability universe from pinecrest-hospital (unauthorized local/
# domain accounts, password policy, registry hardening, SMB/shares/file ACLs,
# hosts redirect, services, run-key/task/service persistence) and
# meridian-hq (AD users/groups, delegation, AS-REP/DES, DCSync ACL, GPP
# cpassword, GPO persistence, LDAP signing, firewall) and ADDS new categories
# (Defender neutered + exclusions, PowerShell logging off, WDigest cleartext,
# LSA PPL off, NTLM/LM downgrade, anonymous enumeration, IFEO debugger
# hijacks, Winlogon Userinit extension, WMI event-subscription persistence,
# startup-folder items, AlwaysInstallElevated, a PasswordNotRequired domain
# account). Teams are NOT expected to clear it in one sitting; an answer key
# is handed out afterward.
#
# Ledger (pinned by tests/unit/test_boxbuilder_harborline_transit.py): 80
# scored hardening checks (EASY 2 x33, MODERATE 4 x35, HARD 8 x12 = 302) +
# 3 penalty guards (-10 each) + 8 forensics questions (8 x 8 = 64) = 366.
#
# Structurally parallel to the meridian-hq round: generic var-driven catalog
# seeds (the ad-*/gpp-*/gpo-*/ldap-*/firewall-allow family, the pinecrest
# -win locals, and the NEW harborline-generation seeds: defender-off,
# ps-logging-off, wdigest-cleartext, lsa-ppl-off, ntlm-downgrade,
# anonymous-enumeration, ifeo-backdoor, winlogon-shell,
# wmi-subscription-persistence, startup-folder-item, ad-blank-password,
# always-install-elevated -- all -win suffixed, in
# boxbuilder/vulndb_vuln_configs/), every planted vulnerability paired with
# a check. The Spooler pair, LLMNR, and the Process-Creation/User-Account
# audit checks plant nothing -- the insecure state is the Windows default;
# the finding is scoring that it must be fixed.
#
# Name discipline: every USERNAME / GROUP / ACCOUNT / SPN / RUN_VALUE_NAME /
# TASK_NAME / SERVICE_NAME / PAYLOAD_PATH / RULE_NAME / GPO_NAME /
# SHARE_NAME / FILE_PATH / IP / PASSWORD in nakon.json MUST match its paired
# check's collect params byte-for-byte -- nothing cross-validates them.
#
# Forensics-answer hygiene: the eight forensics answers (the hidden $-suffix
# account, the PasswordNotRequired account, the AS-REP account, the GPP
# cleartext password, the attacker GPO name, the rogue task name, the Run-key
# value name, the IFEO-hijacked accessibility executable) are deliberately
# NOT named in any check's display string -- a team must investigate, not
# read the report. Check ids are neutral for the same reason.
#
# Difficulty weighting: EASY 2 / MODERATE 4 / HARD 8 (the vermilion-relay
# tiers), called out in the in-box README too.

scenario:
  name: "Harborline Transit Authority"
  version: 1
  mode: honor
  hosts: ["localhost"]

checks:
  # --- A. DOMAIN ACCOUNTS & GROUPS --------------------------------------------
  # Scored as DISABLED / SCRUBBED, not deleted, wherever deletion would
  # destroy the evidence the forensics questions need: the disable-don't-
  # destroy incident-response habit. Rotation, re-enabling preauth, and
  # lifting DES restrictions are the fixes that keep the account.
  - id: domain_admins_subset
    type: powershell_json
    category: vuln
    display: "MODERATE: Only the authorized administrator sits in Domain Admins"
    max_points: 4
    timeout_s: 30
    collect:
      script: |
        Import-Module ActiveDirectory -ErrorAction Ignore
        $allowed = @('Administrator', 'sysadmin')
        $members = @(Get-ADGroupMember -Identity 'Domain Admins' -ErrorAction Ignore |
            ForEach-Object { $_.SamAccountName })
        $stray = @($members | Where-Object { $allowed -notcontains $_ })
        (($stray.Count -eq 0) -and ($members -contains 'sysadmin')) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Audit the group.** Domain Admins is the most powerful group in
      the forest -- every seat in it is a kingdom key:

      ```
      Get-ADGroupMember 'Domain Admins' | Select-Object SamAccountName, Name
      Administrator      (built-in)
      sysadmin           Harborline IT
      <one extra member>  Field contractor
      ```

      The roster calls for exactly one human administrator: `sysadmin`
      (the built-in Administrator is tolerated). Anyone else is a plant
      or a mistake.

      **2. Trim to the roster** -- this strips their power without
      touching the accounts themselves (they are handled by their own
      tasks):

      ```
      Remove-ADGroupMember 'Domain Admins' -Members <the stray member>
      ```

      GUI route: Active Directory Users and Computers > Builtin (or
      Users) > Domain Admins > Members tab > select > Remove.

      **3. Confirm.** The Get-ADGroupMember list shows only
      Administrator and sysadmin.

  - id: bprieto_disabled
    type: powershell_json
    category: vuln
    display: "EASY: The contractor account with a Domain Admin seat is disabled"
    max_points: 2
    timeout_s: 30
    collect:
      script: |
        Import-Module ActiveDirectory -ErrorAction Ignore
        $u = Get-ADUser -Filter "SamAccountName -eq 'bprieto'" -ErrorAction Ignore
        ($null -ne $u -and $u.Enabled -eq $false) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Find the account.** `Get-ADUser bprieto -Properties Enabled,
      Description` -- "Field contractor - signaling upgrade" -- yet it
      sat in Domain Admins. Temporary staffing with permanent power.

      **2. Disable it -- do NOT delete it.** The scored state is the
      account existing AND disabled: deleting it earns zero here and
      destroys the evidence other tasks and questions still need.

      ```
      Disable-ADAccount -Identity bprieto
      ```

      GUI route: ADUC > Users > bprieto > Properties > Account tab >
      tick "Account is disabled".

      **3. Confirm.** `Get-ADUser bprieto` reports `Enabled : False`.
      Its Domain Admins seat is a separate task.

  - id: lhaight_disabled
    type: powershell_json
    category: vuln
    display: "EASY: The offboarded auditor's account is disabled"
    max_points: 2
    timeout_s: 30
    collect:
      script: |
        Import-Module ActiveDirectory -ErrorAction Ignore
        $u = Get-ADUser -Filter "SamAccountName -eq 'lhaight'" -ErrorAction Ignore
        ($null -ne $u -and $u.Enabled -eq $false) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Find the account.** The description says the person is gone
      ("Night ops auditor (offboarded)") -- but the account was left
      enabled, and it still holds seats in privileged groups (its own
      tasks).

      **2. Disable it -- do NOT delete it** (the group memberships and
      the account itself are the evidence the incident needs):

      ```
      Disable-ADAccount -Identity lhaight
      ```

      **3. Confirm.** `Get-ADUser lhaight` reports `Enabled : False`,
      then scrub its group seats (the operator-groups and RDP-group
      tasks).

  - id: operators_groups_clean
    type: powershell_json
    category: vuln
    display: "MODERATE: The built-in operator groups have no unauthorized members"
    max_points: 4
    timeout_s: 30
    collect:
      script: |
        Import-Module ActiveDirectory -ErrorAction Ignore
        $bad = 0
        foreach ($g in @('Account Operators', 'Server Operators',
                         'Backup Operators', 'Print Operators')) {
            $bad += @(Get-ADGroupMember -Identity $g -ErrorAction Ignore).Count
        }
        ($bad -eq 0) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Audit the operator groups.** The built-in operator groups are
      one rung below Domain Admins -- Account Operators can create and
      manage users, Server Operators own services, Backup Operators can
      read anything on disk (and get DCSync-adjacent rights):

      ```
      'Account Operators', 'Server Operators', 'Backup Operators',
        'Print Operators' | ForEach-Object {
          Get-ADGroupMember $_ | Select-Object @{n='Group';e={$args[0]}}, SamAccountName }
      ```

      (or check each in ADUC's Builtin container). One account sits in
      one of them that the roster does not explain.

      **2. Remove every member** of all four groups -- on a
      single-DC shop like this nobody needs standing operator rights:

      ```
      Remove-ADGroupMember 'Account Operators' -Members <the member>
      ```

      **3. Confirm.** The sweep across the four groups prints nothing.

  - id: rdp_group_no_unauthorized
    type: powershell_json
    category: vuln
    display: "EASY: The Remote Desktop Users group has no unauthorized members"
    max_points: 2
    timeout_s: 30
    collect:
      script: |
        Import-Module ActiveDirectory -ErrorAction Ignore
        $members = @(Get-ADGroupMember -Identity 'Remote Desktop Users' -ErrorAction Ignore)
        ($members.Count -eq 0) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. List the group.** On a domain controller "Remote Desktop
      Users" is a domain (Builtin) group -- check it from AD, not the
      local SAM:

      ```
      Get-ADGroupMember 'Remote Desktop Users'
      ```

      The scored state is an EMPTY group -- RDP access is a doorway,
      not a perk. One offboarded account is still holding a seat.
      (Remote Desktop itself stays ON -- who can log on is the finding,
      not whether the door exists.)

      **2. Remove every member:**

      ```
      Remove-ADGroupMember 'Remote Desktop Users' -Members <the member>
      ```

      GUI route: ADUC > Builtin > Remote Desktop Users > Members tab >
      Remove.

      **3. Confirm.** `Get-ADGroupMember 'Remote Desktop Users'`
      returns nothing.

  - id: guest_disabled
    type: powershell_json
    category: vuln
    display: "EASY: The domain Guest account is disabled"
    max_points: 2
    timeout_s: 30
    collect:
      script: |
        Import-Module ActiveDirectory -ErrorAction Ignore
        $g = Get-ADUser -Filter "SamAccountName -eq 'Guest'" -ErrorAction Ignore
        ($null -ne $g -and $g.Enabled -eq $false) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Check it.** In a domain, the Guest account lives in AD (not
      the local SAM) and a fresh domain ships it disabled -- so if it is
      on, someone turned it on:

      ```
      Get-ADUser Guest -Properties Enabled     # Enabled : True
      ```

      **2. Disable it:**

      ```
      Disable-ADAccount -Identity Guest
      ```

      GUI route: ADUC > Users > Guest > Properties > tick "Account is
      disabled".

      **3. Confirm.** `Get-ADUser Guest -Properties Enabled` reports
      `Enabled : False`.

  - id: no_password_not_required
    type: powershell_json
    category: vuln
    display: "MODERATE: No enabled account accepts a blank password"
    max_points: 4
    timeout_s: 30
    collect:
      script: |
        # "Password not required" is the domain-side blank-password flag:
        # an ENABLED account carrying it logs on with an empty password.
        # Disabled accounts are exempt (they cannot log on).
        Import-Module ActiveDirectory -ErrorAction Ignore
        $bad = @(Get-ADUser -Filter 'Enabled -eq $true' -Properties PasswordNotRequired -ErrorAction Ignore |
            Where-Object { $_.PasswordNotRequired })
        ($bad.Count -eq 0) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Sweep for the flag** (the same sweep the check runs -- do it
      BEFORE you fix the account; a fixed or disabled account stops
      matching, and what you find is also a forensics answer):

      ```
      Get-ADUser -Filter 'Enabled -eq $true' -Properties PasswordNotRequired |
        Where-Object { $_.PasswordNotRequired } |
        Select-Object SamAccountName, Description
      <one account>   <a kiosk-flavored description>
      ```

      An enabled account with "Password not required" accepts an EMPTY
      password -- anyone at any logon prompt is in.

      **2. Fix it** -- set a password and clear the flag; keep the
      account (the kiosk integration points at it):

      ```
      Set-ADAccountPassword -Identity <the account> -Reset `
        -NewPassword (ConvertTo-SecureString -AsPlainText '<long random>' -Force)
      Set-ADAccountControl -Identity <the account> -PasswordNotRequired $false
      ```

      Disabling the account also satisfies the check -- but the better
      fix keeps the service working with a real password.

      **3. Confirm.** The sweep prints nothing.

  - id: no_hidden_dollar_account
    type: powershell_json
    category: vuln
    display: "MODERATE: No account is hiding behind a dollar-suffix name"
    max_points: 4
    timeout_s: 30
    collect:
      script: |
        # A trailing '$' in the NAME makes a rogue account fade into the
        # computer-object noise of every account listing -- the classic
        # hidden-account costume (real computer objects end in $, but
        # these are USER objects). Sweep ENABLED user objects only.
        Import-Module ActiveDirectory -ErrorAction Ignore
        $bad = @(Get-ADUser -Filter 'Enabled -eq $true' -ErrorAction Ignore |
            Where-Object { $_.SamAccountName -like '*$' })
        ($bad.Count -eq 0) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Sweep for the costume** (do it before you disable anything --
      the name you find is a forensics answer):

      ```
      Get-ADUser -Filter 'Enabled -eq $true' |
        Where-Object { $_.SamAccountName -like '*$' } |
        Select-Object SamAccountName, Description
      ```

      Every COMPUTER account ends in `$` -- so does one thing in the
      USER listing that has no machine behind it. Attackers add the
      suffix so a rogue account hides in the computer noise of
      `net user /domain` output.

      **2. Disable it -- do NOT delete it** (the account is the
      evidence):

      ```
      Disable-ADAccount -Identity <the account>
      ```

      **3. Confirm.** The sweep prints nothing.

  - id: svc_sched_password_rotated
    type: powershell_json
    category: vuln
    display: "HARD: The scheduling integration account's password has been rotated off its original"
    max_points: 8
    timeout_s: 45
    collect:
      script: |
        # The roasting fix is the ROTATION: the account must still exist
        # and be enabled, but its ORIGINAL planted password must stop
        # authenticating. ValidateCredentials does one real credential
        # check: True = the weak original still works (no points), False
        # = rotated (points), throw = DC unreachable (fail closed).
        # FRESH-CLONE GOTCHA (observed live on the meridian round): for
        # the first minutes after boot the DC's auth path rejects even
        # VALID credentials, which would fake a rotation -- so nothing
        # is scored until the box has been up 8+ minutes; the next
        # 5-minute pass re-scores once the DC is up, so early-boot noise
        # never sticks.
        Import-Module ActiveDirectory -ErrorAction Ignore
        $rotated = $false
        $u = Get-ADUser -Filter "SamAccountName -eq 'svc_sched'" -Properties LockedOut -ErrorAction Ignore
        if ($null -ne $u -and $u.Enabled) {
            $uptimeMin = ((Get-Date) - (Get-CimInstance Win32_OperatingSystem).LastBootUpTime).TotalMinutes
            if ($uptimeMin -ge 8) {
                try {
                    # A LOCKED-OUT account rejects even the CORRECT password,
                    # which would read as rotated -- fail closed while locked.
                    if ($u.LockedOut) {
                        $rotated = $false
                    } else {
                        Add-Type -AssemblyName System.DirectoryServices.AccountManagement -ErrorAction Ignore
                        $pc = New-Object System.DirectoryServices.AccountManagement.PrincipalContext(
                            [System.DirectoryServices.AccountManagement.ContextType]::Domain,
                            'harborline.local')
                        $rotated = -not $pc.ValidateCredentials('svc_sched', 'SchedSpring2026!')
                    }
                } catch {
                    # DC auth path unavailable: fail closed -- a throw must
                    # never read as "rotated"
                    $rotated = $false
                }
            }
        }
        $rotated | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 8
    solution: |
      **1. See the target.** The account carries a service principal
      name -- any domain user can ask the DC for its service ticket and
      take the password hash home to crack offline (Kerberoasting).
      Its password is short, seasonal, and dictionary-shaped:

      ```
      setspn -L svc_sched
      HTTP/har-dc01.harborline.local
      ```

      **2. Rotate it** -- long, random, and recorded wherever the
      integration's config lives. Rotation beats every other mitigation
      because a cracked hash buys the attacker nothing:

      ```
      Set-ADAccountPassword -Identity svc_sched -Reset `
        -NewPassword (ConvertTo-SecureString -AsPlainText 'J7#vQz2!mLpXw4tR' -Force)
      ```

      Disabling or deleting the account is scorched earth: the check
      only scores while the account exists AND is enabled -- the
      scheduling integration needs it.

      **3. Confirm** the old password is dead: a bind attempt with it
      is now refused. (Bonus, unscored here: if this were AES-protected
      the ticket would be harder to crack -- see the DES task for the
      inverse.)

  - id: never_expires_clean
    type: powershell_json
    category: vuln
    display: "MODERATE: No ordinary enabled account is set to never expire its password"
    max_points: 4
    timeout_s: 30
    collect:
      script: |
        # "Password never expires" quietly exempts an account from the
        # domain policy forever. The krbtgt account carries it by
        # design (the KRBTGT key must not roll casually) -- that is the
        # one allowed exception. Sweep ENABLED user objects only.
        Import-Module ActiveDirectory -ErrorAction Ignore
        $bad = @(Get-ADUser -Filter 'Enabled -eq $true' -Properties PasswordNeverExpires -ErrorAction Ignore |
            Where-Object { $_.PasswordNeverExpires -and $_.SamAccountName -ne 'krbtgt' })
        ($bad.Count -eq 0) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Sweep every enabled account** (the same query the check
      runs, krbtgt excluded):

      ```
      Get-ADUser -Filter 'Enabled -eq $true' -Properties PasswordNeverExpires |
        Where-Object { $_.PasswordNeverExpires -and $_.SamAccountName -ne 'krbtgt' } |
        Select-Object SamAccountName
      ```

      More than one account comes back. "Never expires" turns any weak
      password those accounts hold into a permanent weak password.

      **2. Clear the flag** on every name the sweep prints:

      ```
      Set-ADUser -Identity <the account> -PasswordNeverExpires $false
      ```

      GUI route: ADUC > user > Properties > Account tab > untick
      "Password never expires".

      **3. Confirm.** The sweep now prints nothing (krbtgt stays as the
      designed exception -- leave it alone).

  - id: stale_svc_disabled
    type: powershell_json
    category: vuln
    display: "EASY: The decommissioned fax-relay service account is disabled"
    max_points: 2
    timeout_s: 30
    collect:
      script: |
        Import-Module ActiveDirectory -ErrorAction Ignore
        $u = Get-ADUser -Filter "SamAccountName -eq 'svc_faxrelay'" -ErrorAction Ignore
        ($null -ne $u -and $u.Enabled -eq $false) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Find the orphan.** The description says the fax relay was
      decommissioned years ago, yet its account is still enabled -- an
      enabled service account nobody remembers is a free identity for
      anything that learns its (old, weak) password:

      ```
      Get-ADUser -Filter "SamAccountName -eq 'svc_faxrelay'" -Properties Description, Enabled
      ```

      **2. Disable it -- do NOT delete it** (a disabled account keeps
      the audit trail; deletion breaks whatever still half-references
      it):

      ```
      Disable-ADAccount -Identity svc_faxrelay
      ```

      **3. Confirm.** `Enabled : False`.

  # --- B. PASSWORD POLICY & AUDITING -------------------------------------------
  # On a DC, `net accounts` reads and writes the DOMAIN policy -- the same
  # one every member server inherits. The weak state is planted; the
  # hardened state is set via the Default Domain Policy (or the quick
  # `net accounts` route, with the policy-refresh caveat below).
  - id: password_minlen
    type: powershell_json
    category: vuln
    display: "MODERATE: Minimum password length is at least 8 characters"
    max_points: 4
    timeout_s: 20
    collect:
      script: |
        # This Server image prints "Minimum password length:" WITHOUT the
        # "(chars)" suffix other Windows builds use -- tolerate both. On a
        # DC `net accounts` reads the DOMAIN policy, not a local one.
        $out = net accounts 2>$null | Out-String
        $m = [regex]::Match($out, 'Minimum password length\s*(?:\(chars\))?\s*:\s*(\d+)')
        ([int]$m.Groups[1].Value -ge 8) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Read the policy.** On a domain controller this IS the domain
      policy -- the same one every member server inherits:

      ```
      net accounts
      Minimum password length:     4
      ```

      Four characters with complexity switched off is a guessing game.

      **2. Raise it** -- the workshop way is the Default Domain Policy,
      so the fix survives a policy refresh:

      ```
      gpmc.msc > Forest: harborline.local > Domains > harborline.local >
        Default Domain Policy > Edit >
        Computer Configuration > Policies > Windows Settings >
        Security Settings > Account Policies > Password Policy >
        Minimum password length = 12
      ```

      The quick route also scores: `net accounts /minpwlen:12`.

      **3. Confirm.** `net accounts` (run on the DC) shows the new
      minimum. `gpupdate /force` applies the GPO route immediately.
      One trap: the quick `net accounts` route can be silently
      reverted when a Default Domain Policy refresh re-asserts the
      GPO's values (your score would drop again later) -- if that
      happens, set it in the Default Domain Policy GPO, where it
      sticks.

  - id: password_max_age
    type: powershell_json
    category: vuln
    display: "MODERATE: Passwords are forced to expire within 90 days"
    max_points: 4
    timeout_s: 20
    collect:
      script: |
        # "Maximum password age: Unlimited" means a password set today is
        # valid forever -- the planted policy ships it unlimited. Scored
        # state: a numeric age of 90 days or less.
        $out = net accounts 2>$null | Out-String
        $m = [regex]::Match($out, 'Maximum password age\s*(?:\(days\))?\s*:\s*(\d+|Unlimited|Never)')
        if (-not $m.Success) { $false | ConvertTo-Json -Compress; exit }
        $raw = $m.Groups[1].Value
        if ($raw -match '^\d+$') { ([int]$raw -le 90) | ConvertTo-Json -Compress }
        else { $false | ConvertTo-Json -Compress }
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Read the policy.**

      ```
      net accounts
      Maximum password age:        Unlimited
      ```

      "Unlimited" means a password set today is good forever -- the
      whole point of expiry is retiring credentials nobody remembers
      choosing.

      **2. Cap it** -- 90 scores; the Default Domain Policy route
      (Password Policy > Maximum password age) is the one that sticks:

      ```
      net accounts /maxpwage:90
      ```

      **3. Confirm.** `net accounts` shows 90 (or less). Same caveat as
      the minimum-length task: if the score drops again later, a policy
      refresh reverted the quick route -- set it in the GPO instead.

  - id: password_lockout
    type: powershell_json
    category: vuln
    display: "HARD: Account lockout threshold is at least 5 invalid attempts"
    max_points: 8
    timeout_s: 20
    collect:
      script: |
        $out = net accounts 2>$null | Out-String
        $m = [regex]::Match($out, 'Lockout threshold\s*(?:\(chars\))?\s*:\s*(\d+)')
        ([int]$m.Groups[1].Value -ge 5) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 8
    solution: |
      **1. Read the policy.**

      ```
      net accounts
      Lockout threshold:           Never
      ```

      "Never" means unlimited password guesses -- the difference between
      a password spray hitting a wall and a password spray silently
      winning. (The regex reads the numeric field; this image prints
      the count here once a threshold is set.)

      **2. Set a threshold** -- Default Domain Policy > Account
      Policies > Account Lockout Policy > "Account lockout threshold"
      = 5 (duration 15 minutes, reset 15). The quick route also scores:

      ```
      net accounts /lockoutthreshold:5 /lockoutduration:15 /lockoutwindow:15
      ```

      **3. Confirm.** `net accounts` shows Lockout threshold 5 instead
      of Never. This is HARD because the zero-state hides as "Never",
      not as a small number -- read the whole policy, not one line.
      Same trap as the minimum-length task: a Default Domain Policy
      refresh can silently revert the quick `net accounts` route, so
      set it in the GPO if your score drops again later.

  - id: audit_logon_on
    type: powershell_json
    category: vuln
    display: "MODERATE: Logon auditing records both success and failure"
    max_points: 4
    timeout_s: 20
    collect:
      script: |
        $out = auditpol /get /subcategory:'Logon' 2>$null | Out-String
        (($out -match 'Success') -and ($out -match 'Failure')) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. See what is being ignored.**

      ```
      auditpol /get /subcategory:"Logon"
      Logon                        No Auditing
      ```

      On a DC, logon auditing is your record of every pass-the-hash,
      spray run, and service logon in the domain -- switched off, you
      would investigate yesterday's breach with today's silence.

      **2. Turn on both directions** -- successes AND failures:

      ```
      auditpol /set /subcategory:"Logon" /success:enable /failure:enable
      ```

      The GPO route: Default Domain Controllers Policy > Computer
      Configuration > Policies > Windows Settings > Security Settings >
      Advanced Audit Policy Configuration > Logon/Logoff > Audit Logon
      > Success and Failure.

      **3. Confirm.** `auditpol /get /subcategory:"Logon"` lists
      Success and Failure both enabled.

  - id: audit_credential_validation_on
    type: powershell_json
    category: vuln
    display: "EASY: Credential-validation auditing records both success and failure"
    max_points: 2
    timeout_s: 20
    collect:
      script: |
        $out = auditpol /get /subcategory:'Credential Validation' 2>$null | Out-String
        (($out -match 'Success') -and ($out -match 'Failure')) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Check the category.** Credential Validation is the subcategory
      that records every authentication the domain performs -- spray
      tooling and pass-the-hash both leave their traces here:

      ```
      auditpol /get /subcategory:"Credential Validation"
      Credential Validation        No Auditing
      ```

      **2. Turn on both directions:**

      ```
      auditpol /set /subcategory:"Credential Validation" /success:enable /failure:enable
      ```

      (or Default Domain Controllers Policy > Advanced Audit Policy
      Configuration > Account Logon > Audit Credential Validation >
      Success and Failure.)

      **3. Confirm.** The `auditpol /get` line lists Success and
      Failure both enabled.

  - id: audit_process_creation_on
    type: powershell_json
    category: vuln
    display: "EASY: Process-creation auditing is enabled (event 4688)"
    max_points: 2
    timeout_s: 20
    collect:
      script: |
        $out = auditpol /get /subcategory:'Process Creation' 2>$null | Out-String
        (($out -match 'Success') -and ($out -match 'Failure')) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Notice the default.** Nothing was planted here -- Windows
      Server ships with process-creation auditing OFF. That is the
      finding: without event 4688 you have no record of what the
      intruder EXECUTED, only where they logged in:

      ```
      auditpol /get /subcategory:"Process Creation"
      Process Creation             No Auditing
      ```

      **2. Turn it on:**

      ```
      auditpol /set /subcategory:"Process Creation" /success:enable /failure:enable
      ```

      (4688 also needs the "Audit Process Creation" GPO and, for full
      command lines, the process-creation administrative template --
      the auditpol switch alone is what scores.)

      **3. Confirm.** `auditpol /get /subcategory:"Process Creation"`
      lists Success and Failure enabled.

  - id: audit_user_account_mgmt_on
    type: powershell_json
    category: vuln
    display: "EASY: User-account-management auditing records failures too"
    max_points: 2
    timeout_s: 20
    collect:
      script: |
        $out = auditpol /get /subcategory:'User Account Management' 2>$null | Out-String
        (($out -match 'Success') -and ($out -match 'Failure')) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Read the category.** User Account Management covers account
      creation, group changes, and -- the half that ships disabled --
      FAILED attempts to change them. Success-only auditing is half a
      camera: it records the admin's work but not the attacker's
      failures:

      ```
      auditpol /get /subcategory:"User Account Management"
      User Account Management      Success
      ```

      **2. Turn on both directions:**

      ```
      auditpol /set /subcategory:"User Account Management" /success:enable /failure:enable
      ```

      **3. Confirm.** The `auditpol /get` line lists Success and
      Failure both enabled.
  # --- C. REGISTRY & PROTOCOL HARDENING ----------------------------------------
  # Legacy-protocol and platform toggles. Secedit/policy-managed values
  # (LmCompatibilityLevel, RestrictAnonymous) are scored from the effective
  # registry value; a bare `reg add` scores, but if a background policy
  # refresh reverts it, do it through Local Security Policy / GPO (the
  # meridian LDAP-signing lesson).
  - id: uac_enabled
    type: registry_value
    category: vuln
    display: "EASY: User Account Control is enabled (EnableLUA = 1)"
    max_points: 2
    collect:
      hive: HKLM
      key: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
      value: EnableLUA
    expect:
      equals: 1
      field: value
      points: 2
    solution: |
      **1. See the state.** With UAC's EnableLUA switched off, every
      administrator token is full admin all the time -- no consent
      prompt, and code running as an admin needs no elevation step to
      own the box:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v EnableLUA
          EnableLUA    REG_DWORD    0x0
      ```

      **2. Turn it back on:**

      ```
      reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v EnableLUA /t REG_DWORD /d 1 /f
      ```

      GUI route: regedit to the same key. The consent-prompt slider in
      Control Panel is cosmetic here -- the scored bit is EnableLUA
      itself.

      **3. Confirm.** The reg query reads 0x1. Fresh tokens appear at
      the next sign-in, but the check reads the value, so the point
      lands immediately.

  - id: uac_consent_prompt
    type: powershell_json
    category: vuln
    display: "EASY: UAC prompts before elevating again (consent behavior restored)"
    max_points: 2
    timeout_s: 20
    collect:
      script: |
        # ConsentPromptBehaviorAdmin 0 = "Elevate without prompting" --
        # an admin process gets its full token silently. Any other value
        # (the stock default is 5) restores a consent prompt. Absent
        # value = the default = prompt, which is the scored state.
        $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name ConsentPromptBehaviorAdmin -ErrorAction Ignore).ConsentPromptBehaviorAdmin
        ($v -ne 0) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Read the toggle.** EnableLUA is only half of UAC -- check
      what elevation DOES now:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v ConsentPromptBehaviorAdmin
          ConsentPromptBehaviorAdmin    REG_DWORD    0x0
      ```

      0 means every elevation happens silently -- the consent dialog,
      the one checkpoint where a user notices something is wrong, is
      gone.

      **2. Restore the prompt** (delete the value or set it back to the
      default 5):

      ```
      reg delete "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v ConsentPromptBehaviorAdmin /f
      ```

      **3. Confirm.** The reg query errors "unable to find ... value"
      (or reads a non-zero value).

  - id: uac_secure_desktop
    type: powershell_json
    category: vuln
    display: "EASY: UAC prompts render on the secure desktop again"
    max_points: 2
    timeout_s: 20
    collect:
      script: |
        # PromptOnSecureDesktop 0 = the consent dialog draws on the same
        # desktop as everything else, so any running program can click
        # it or draw over it. Hardened state: 1 (the isolated secure
        # desktop), or the value gone (default is on).
        $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name PromptOnSecureDesktop -ErrorAction Ignore).PromptOnSecureDesktop
        ($v -eq 1) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Read the toggle.** A UAC prompt that renders on the ordinary
      desktop is a prompt any running process can interact with:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v PromptOnSecureDesktop
          PromptOnSecureDesktop    REG_DWORD    0x0
      ```

      **2. Restore the isolated desktop:**

      ```
      reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v PromptOnSecureDesktop /t REG_DWORD /d 1 /f
      ```

      (or delete the value -- the Windows default is on.)

      **3. Confirm.** The reg query reads 0x1.

  - id: rdp_nla
    type: registry_value
    category: vuln
    display: "MODERATE: Remote Desktop requires Network Level Authentication"
    max_points: 4
    collect:
      hive: HKLM
      key: SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
      value: UserAuthentication
    expect:
      equals: 1
      field: value
      points: 4
    solution: |
      **1. See the state.** The RDP listener accepts clients that have
      proven nothing yet:

      ```
      reg query "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication
          UserAuthentication    REG_DWORD    0x0
      ```

      Without Network Level Authentication every connection gets the
      full logon handshake -- free pre-auth attack surface on the box
      that holds the whole domain. (RDP itself stays ON -- the box is
      managed over it; the missing pre-auth requirement is the
      finding.)

      **2. Require NLA:**

      ```
      reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 1 /f
      ```

      GUI route: System Properties > Remote > tick "Allow connections
      only from computers running Remote Desktop with Network Level
      Authentication" -- it writes this same value.

      **3. Confirm.** The reg query reads 0x1.

  - id: no_autologin
    type: registry_value
    category: vuln
    display: "MODERATE: Automatic logon is disabled"
    max_points: 4
    collect:
      hive: HKLM
      key: SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
      value: AutoAdminLogon
    expect:
      equals: false
      field: present
      points: 4
    solution: |
      **1. Look inside Winlogon.** Autologon turns every boot into a
      signed-in console session for whoever the registry names -- zero
      credentials, physical access wins (and on a DC, that console
      session is the domain's keys):

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"
          AutoAdminLogon    REG_SZ    1
          DefaultUserName   REG_SZ    kiosk-dispatch
          DefaultPassword   REG_SZ    KioskDispatch1!
      ```

      **2. DELETE the AutoAdminLogon value** -- do not merely set it to
      0. The scored state is ABSENT: a leftover `AutoAdminLogon=0` is
      still present and still fails.

      ```
      reg delete "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" /v AutoAdminLogon /f
      ```

      **3. Confirm.** The reg query errors with "unable to find the
      specified registry key or value". The stored DefaultPassword
      beside it is its own task -- clear both.

  - id: no_autologin_password
    type: registry_value
    category: vuln
    display: "EASY: The autologon credential stored in the registry is removed"
    max_points: 2
    collect:
      hive: HKLM
      key: SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
      value: DefaultPassword
    expect:
      equals: false
      field: present
      points: 2
    solution: |
      **1. Find it.** In the same Winlogon key sits `DefaultPassword` --
      the autologon credential in PLAINTEXT, readable out of the
      registry by anything running with admin rights:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" /v DefaultPassword
          DefaultPassword    REG_SZ    KioskDispatch1!
      ```

      That password is now burned -- treat it as compromised everywhere
      it was reused.

      **2. Delete the value:**

      ```
      reg delete "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" /v DefaultPassword /f
      ```

      **3. Confirm.** The query errors "unable to find ... value". If
      the autologon user keeps an account anywhere, rotate its password
      too.

  - id: smb1_disabled
    type: powershell_json
    category: vuln
    display: "MODERATE: The deprecated SMB1 protocol is disabled on the SMB server"
    max_points: 4
    timeout_s: 20
    collect:
      script: |
        # ground truth = the registry value the seed sets (the SMB WMI Set path
        # is unreliable on some hardened images; Get mirrors it only sometimes)
        $v = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' -Name SMB1 -ErrorAction Ignore).SMB1
        ($v -ne 1) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Check the server side.** SMB1 is the protocol of the
      WannaCry-era worms; nothing modern on a domain controller speaks
      it:

      ```
      Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' -Name SMB1
          SMB1 : 1
      ```

      **2. Switch it off** with the supported toggle:

      ```
      Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force
      ```

      **3. Confirm the way the check does** -- the registry value is
      the ground truth, and on some images the SMB WMI view mirrors it
      late. Re-run the Get-ItemProperty above; if it still reads 1,
      write the value directly:

      ```
      reg add "HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters" /v SMB1 /t REG_DWORD /d 0 /f
      ```

      Anything but 1 -- a 0, or the value gone -- is the scored state.

  - id: backdoor_rule2_removed
    type: powershell_json
    category: vuln
    display: "EASY: A second undocumented inbound firewall allow rule is removed"
    max_points: 2
    timeout_s: 20
    collect:
      script: |
        $r = Get-NetFirewallRule -Name 'FleetCommand' -ErrorAction Ignore
        ($null -eq $r) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      The second backdoor door -- attackers never leave just one, so a
      ruleset cleanup that stops at the first rule is not a cleanup
      (full walkthrough in the TransitSync task):

      ```
      Remove-NetFirewallRule -Name 'FleetCommand'
      ```

      **Confirm.** `Get-NetFirewallRule -Name 'FleetCommand'` returns
      nothing.

  - id: ldap_signing_required
    type: registry_value
    category: vuln
    display: "HARD: The domain controller requires LDAP signing"
    max_points: 8
    collect:
      hive: HKLM
      key: SYSTEM\CurrentControlSet\Services\NTDS\Parameters
      value: LDAPServerIntegrity
    expect:
      equals: 2
      field: value
      points: 8
    solution: |
      **1. Read the requirement.** With signing not required, NTLM
      authenticated LDAP traffic can be relayed and tampered in transit:

      ```
      reg query "HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters" /v LDAPServerIntegrity
          LDAPServerIntegrity    REG_DWORD    0x1        # 1 = None, 2 = Require
      ```

      **2. Require signing -- through the policy store, not a bare
      registry write.** On this image a background security-policy
      refresh re-asserts the stored policy and silently reverts a bare
      `reg add` (your score would come back minutes later). The fix
      that sticks is Local Security Policy:

      ```
      secpol.msc > Local Policies > Security Options >
        "Domain controller: LDAP server signing requirements" >
        Require signing
      ```

      Or the same thing via secedit (export, set
      `LDAPServerIntegrity = 2` under [Registry Values], configure).
      The GPO route (Default Domain Controllers Policy > Security
      Options > same setting) works too and follows the workshop
      teaching. A bare `reg add ... /d 2 /f` also scores -- but if the
      score drops again a few minutes later, that is the policy
      refresh reverting it; do it through the policy store instead.

      **3. Confirm.** The reg query reads 0x2 and STAYS 0x2 after
      `gpupdate /force`. (This one is HARD because it is policy work
      in the NTDS key -- and it is the check the MS17-style scanners
      flag first on any domain.)

  - id: wdigest_cleartext_off
    type: powershell_json
    category: vuln
    display: "HARD: WDigest no longer keeps a cleartext copy of every logon credential"
    max_points: 8
    timeout_s: 20
    collect:
      script: |
        # UseLogonCredential=1 makes WDigest leave a PLAINTEXT password
        # for every interactive logon in LSASS memory -- one admin-level
        # dump later and the attacker holds real passwords, not hashes.
        # The hardened state is anything but 1 (0, or the value gone --
        # the Windows default).
        $v = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest' -Name UseLogonCredential -ErrorAction Ignore).UseLogonCredential
        ($v -ne 1) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 8
    solution: |
      **1. Read the setting.** WDigest is an ancient protocol provider
      that cannot store hashes -- with this switch on, Windows keeps
      the PLAINTEXT password in memory for every logon since the
      switch flipped:

      ```
      reg query "HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest" /v UseLogonCredential
          UseLogonCredential    REG_DWORD    0x1
      ```

      An admin-level attacker dumps LSASS once and walks away with
      typed passwords, not crackable blobs.

      **2. Switch it off** (0, or delete the value -- both score):

      ```
      reg delete "HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest" /v UseLogonCredential /f
      ```

      **3. Confirm.** The reg query no longer reports 0x1. Credentials
      already sitting in memory stay until each user signs out -- the
      fix stops NEW cleartext from accumulating, so pair it with
      signing out idle sessions.

  - id: lsa_ppl_on
    type: powershell_json
    category: vuln
    display: "HARD: LSA runs as a protected process (RunAsPPL = 1)"
    max_points: 8
    timeout_s: 20
    collect:
      script: |
        # RunAsPPL=1 makes lsass.exe a protected process light:
        # admin-level tools can no longer open it to read credential
        # material. The planted state is 0; hardened is exactly 1.
        $v = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name RunAsPPL -ErrorAction Ignore).RunAsPPL
        ($v -eq 1) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 8
    solution: |
      **1. Read the protection.** LSA is the process that holds every
      logon session's secrets. Without PPL, any process holding admin
      can open it like a text file:

      ```
      reg query "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" /v RunAsPPL
          RunAsPPL    REG_DWORD    0x0
      ```

      **2. Turn the protection on:**

      ```
      reg add "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" /v RunAsPPL /t REG_DWORD /d 1 /f
      ```

      **3. Confirm.** The reg query reads 0x1. The protection takes
      effect at the next boot -- the value is what scores, and the
      reboot is what makes it real. Pairs with the WDigest task: that
      one stops cleartext being WRITTEN, this one makes what is there
      harder to READ.

  - id: lm_compat_ntlmv2_only
    type: powershell_json
    category: vuln
    display: "HARD: The NTLM stack refuses legacy LM/NTLMv1 responses (level 5)"
    max_points: 8
    timeout_s: 20
    collect:
      script: |
        # LmCompatibilityLevel 0 = send LM + NTLMv1 responses: the
        # challenge/response format crackable at dictionary speeds.
        # Hardened state: present AND >= 5 (send NTLMv2 only, refuse
        # legacy). An ABSENT value is the machine default (3), which
        # still ACCEPTS legacy clients -- set the explicit 5.
        $v = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name LmCompatibilityLevel -ErrorAction Ignore).LmCompatibilityLevel
        if ($null -eq $v) { $false | ConvertTo-Json -Compress }
        else { ([int]$v -ge 5) | ConvertTo-Json -Compress }
    expect:
      equals: true
      field: data
      points: 8
    solution: |
      **1. Read the level.**

      ```
      reg query "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" /v LmCompatibilityLevel
          LmCompatibilityLevel    REG_DWORD    0x0
      ```

      Level 0 answers every authentication downgrade an attacker
      triggers -- LM and NTLMv1 hashes crack in minutes on a GPU.

      **2. Set level 5** (send NTLMv2 only, refuse LM and NTLMv1)
      -- through the policy store so a refresh cannot silently revert
      a bare registry write:

      ```
      secpol.msc > Local Policies > Security Options >
        "Network security: LAN Manager authentication level" >
        Send NTLMv2 response only. Refuse LM & NTLM
      ```

      (A bare `reg add ... /d 5 /f` also scores -- same caveat as the
      LDAP signing task.)

      **3. Confirm.** The reg query reads 0x5 and stays there after
      `gpupdate /force`.

  - id: anonymous_enum_restricted
    type: powershell_json
    category: vuln
    display: "MODERATE: Anonymous users cannot enumerate accounts and shares"
    max_points: 4
    timeout_s: 20
    collect:
      script: |
        # RestrictAnonymous and RestrictAnonymousSAM both 0 = an
        # UNAUTHENTICATED session can list users and shares -- free
        # recon for the next attack stage. Hardened: both = 1.
        $lsa = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
        $a = (Get-ItemProperty $lsa -Name RestrictAnonymous -ErrorAction Ignore).RestrictAnonymous
        $s = (Get-ItemProperty $lsa -Name RestrictAnonymousSAM -ErrorAction Ignore).RestrictAnonymousSAM
        (($a -eq 1) -and ($s -eq 1)) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Read both switches.** Two sibling values govern what an
      anonymous (unauthenticated) session may list:

      ```
      reg query "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" /v RestrictAnonymous
      reg query "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" /v RestrictAnonymousSAM
      ```

      Both at 0 means anyone who can reach the box -- no credentials --
      can walk away with the user list and the share list.

      **2. Set both to 1** -- via Local Security Policy so a policy
      refresh cannot revert a bare registry write:

      ```
      secpol.msc > Local Policies > Security Options >
        "Network access: Do not allow anonymous enumeration of SAM accounts" > Enabled
        "Network access: Do not allow anonymous enumeration of SAM accounts and shares" > Enabled
      ```

      (Bare `reg add` for both values also scores.)

      **3. Confirm.** Both reg queries read 0x1.

  - id: llmnr_disabled
    type: powershell_json
    category: vuln
    display: "EASY: LLMNR name-resolution broadcast is disabled"
    max_points: 2
    timeout_s: 20
    collect:
      script: |
        # Nothing was planted here -- LLMNR ships ON by default, and ON
        # is the finding: any workstation can answer a mistyped name and
        # capture authentication hashes (the Responder playbook). The
        # hardened state is the policy value at 0.
        $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name EnableMulticast -ErrorAction Ignore).EnableMulticast
        ($v -eq 0) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Notice the default.** Nothing was planted -- Link-Local
      Multicast Name Resolution ships enabled, and it is the protocol
      that lets ANY machine on the segment answer a mistyped hostname
      and harvest the authentication hashes that follow (a
      responder-in-a-corner attack needs nothing but this default):

      ```
      Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name EnableMulticast
      ```

      (the value being absent means the default -- on -- is in force).

      **2. Switch it off** via policy:

      ```
      gpedit.msc > Computer Configuration > Administrative Templates >
        Network > DNS Client > "Turn off multicast name resolution" > Enabled
      ```

      (which writes EnableMulticast=0 here; a direct `reg add` scores
      the same.)

      **3. Confirm.** The Get-ItemProperty above reads 0.

  - id: screen_lock_inactivity
    type: powershell_json
    category: vuln
    display: "EASY: The console locks itself after inactivity"
    max_points: 2
    timeout_s: 20
    collect:
      script: |
        # "Interactive logon: Machine inactivity limit" -- the security
        # policy that locks the console after N idle seconds. Absent =
        # no automatic lock, the shipped default and the finding.
        # Hardened: 900 seconds (15 min) or less.
        $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name InactivityTimeoutSecs -ErrorAction Ignore).InactivityTimeoutSecs
        if ($null -eq $v) { $false | ConvertTo-Json -Compress }
        else { ([int]$v -ge 1 -and [int]$v -le 900) | ConvertTo-Json -Compress }
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Read the limit.** A console session on a domain controller
      that never locks is a session an attacker only has to find:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v InactivityTimeoutSecs
      ```

      (absent = the machine never locks itself).

      **2. Set the limit** -- 900 seconds (15 minutes) or less scores:

      ```
      secpol.msc > Local Policies > Security Options >
        "Interactive logon: Machine inactivity limit" > 900
      ```

      (or `reg add` the value directly -- same store, same result).

      **3. Confirm.** The reg query reads a value between 1 and 900.

  - id: always_install_elevated_off
    type: powershell_json
    category: vuln
    display: "EASY: MSI installs no longer run elevated for every user"
    max_points: 2
    timeout_s: 20
    collect:
      script: |
        # AlwaysInstallElevated=1 (both hives) = any user can install an
        # .MSI that the Installer service runs as SYSTEM -- a direct
        # user-to-SYSTEM escalation. Hardened: anything but 1.
        $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer' -Name AlwaysInstallElevated -ErrorAction Ignore).AlwaysInstallElevated
        ($v -ne 1) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Read the policy.** Two values must agree for the danger --
      the machine hive is one of them:

      ```
      reg query "HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer" /v AlwaysInstallElevated
          AlwaysInstallElevated    REG_DWORD    0x1
      ```

      With it set, any user who can copy a file can hand the Windows
      Installer a malicious .MSI and receive a SYSTEM process.

      **2. Clear it** (delete the value, or set 0) in BOTH hives:

      ```
      reg delete "HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer" /v AlwaysInstallElevated /f
      reg delete "HKCU\SOFTWARE\Policies\Microsoft\Windows\Installer" /v AlwaysInstallElevated /f
      ```

      **3. Confirm.** The HKLM query errors "unable to find ... value"
      (or reads 0).

  - id: share_encrypted_or_removed
    type: powershell_json
    category: vuln
    display: "MODERATE: The operations share encrypts its SMB traffic (or is gone)"
    max_points: 4
    timeout_s: 20
    collect:
      script: |
        # The operations share (its own task handles WHO can access it;
        # this one handles the wire): SMB encryption scrambles share
        # traffic end to end. Removing the share outright also scores.
        $s = Get-SmbShare -Name 'TransitData' -ErrorAction Ignore
        if (-not $s) { $true | ConvertTo-Json -Compress; exit }
        ([bool]$s.EncryptData) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Ask how the share travels.** The access task next door fixes
      WHO can touch the operations share; this one fixes the WIRE:

      ```
      Get-SmbShare TransitData | Select-Object Name, EncryptData
      TransitData  False
      ```

      Unencrypted SMB is readable by anyone positioned on the path.

      **2. Turn on encryption:**

      ```
      Set-SmbShare -Name TransitData -EncryptData $true -Force
      ```

      (Removing the share entirely also satisfies this check -- but a
      transit authority still needs its operations share; encryption
      is the better ending.)

      **3. Confirm.** The Get-SmbShare line reads True.
  # --- D. DEFENDER & POWERSHELL LOGGING ------------------------------------------
  - id: ps2_legacy_engine_removed
    type: powershell_json
    category: vuln
    display: "MODERATE: The legacy PowerShell 2.0 script engine is removed"
    max_points: 4
    timeout_s: 120
    collect:
      script: |
        # Nothing was planted here -- the PowerShell 2.0 optional feature
        # ships ENABLED on this Server image, and that is the finding:
        # version 2 has no AMSI, no script-block logging, and is the
        # classic downgrade path around every newer defense. Hardened:
        # the feature removed (or the image without it).
        $f = Get-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2 -ErrorAction Ignore
        (($null -eq $f) -or ($f.State -ne 'Enabled')) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Notice the default.** Nothing was planted -- the PowerShell
      2.0 engine ships installed-and-enabled on this image. That is
      the finding: version 2 is a 2009-era engine with no AMSI, no
      script-block logging, and no transcript support, so any script
      an attacker launches with `-Version 2` bypasses every newer
      defense on the box:

      ```
      Get-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2
      State : Enabled
      ```

      **2. Remove the engine:**

      ```
      Disable-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2 -NoRestart
      ```

      Modern PowerShell 5.1/7 remains -- 2.0 is only the downgrade
      door. A pending reboot is fine; the state flips immediately.

      **3. Confirm.** The Get-WindowsOptionalFeature query reports
      Disabled (or the feature is gone).

  - id: defender_policy_clean
    type: registry_value
    category: vuln
    display: "EASY: The 'DisableAntiSpyware' kill switch is cleared"
    max_points: 2
    collect:
      hive: HKLM
      key: SOFTWARE\Policies\Microsoft\Windows Defender
      value: DisableAntiSpyware
    expect:
      equals: false
      field: present
      points: 2
    solution: |
      **1. Find the kill switch.** Real-time monitoring has its own
      task; this is the policy that tells Defender to not exist at all:

      ```
      reg query "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender" /v DisableAntiSpyware
          DisableAntiSpyware    REG_DWORD    0x1
      ```

      A 1 here is the classic pre-attack move: the engine loads, shows
      green in old consoles, and scans nothing.

      **2. Delete the policy value** (or set it 0):

      ```
      reg delete "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender" /v DisableAntiSpyware /f
      ```

      **3. Confirm.** The reg query errors "unable to find ... value".

  - id: defender_exclusions_clean
    type: powershell_json
    category: vuln
    display: "MODERATE: Defender has no scan exclusions pointing at attacker territory"
    max_points: 4
    timeout_s: 30
    collect:
      script: |
        # An exclusion path is a standing "never scan here" sign. The
        # planted one points at the folder every payload on this box
        # lives in. Hardened: no path and no process exclusions at all.
        # (Where-Object filters the empty-list $null: @($null).Count
        # is 1, which would fail a perfectly clean box.)
        $p = Get-MpPreference -ErrorAction Ignore
        if ($null -eq $p) { $false | ConvertTo-Json -Compress; exit }
        $paths = @($p.ExclusionPath | Where-Object { $_ })
        $procs = @($p.ExclusionProcess | Where-Object { $_ })
        (($paths.Count -eq 0) -and ($procs.Count -eq 0)) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Read the exclusion list** (the same query the check runs --
      note WHERE it points before you clear it; that path is where the
      rest of the incident lives):

      ```
      Get-MpPreference | Select-Object -ExpandProperty ExclusionPath
      C:\ProgramData\Subsystems
      ```

      A folder-level exclusion is a standing "never scan here" sign --
      and this one covers every payload on the box.

      **2. Remove every exclusion:**

      ```
      Remove-MpPreference -ExclusionPath 'C:\ProgramData\Subsystems'
      ```

      (repeat for any other path or process the list shows).

      **3. Confirm.** The ExclusionPath/ExclusionProcess queries print
      nothing.

  - id: ps_scriptblock_logging_on
    type: registry_value
    category: vuln
    display: "MODERATE: PowerShell script-block logging is enabled"
    max_points: 4
    collect:
      hive: HKLM
      key: SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
      value: EnableScriptBlockLogging
    expect:
      equals: 1
      field: value
      points: 4
    solution: |
      **1. Read the switch.** Script-block logging is the flight
      recorder for PowerShell: every script the engine compiles -- including
      ones handed to it in memory -- lands in the operational event log:

      ```
      reg query "HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging" /v EnableScriptBlockLogging
          EnableScriptBlockLogging    REG_DWORD    0x0
      ```

      Attacker tooling on Windows is PowerShell; with logging off, it
      ran in the dark.

      **2. Turn it on:**

      ```
      reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging" /v EnableScriptBlockLogging /t REG_DWORD /d 1 /f
      ```

      (GPO route: Administrative Templates > Windows Components >
      Windows PowerShell > Turn on PowerShell Script Block Logging.)

      **3. Confirm.** The reg query reads 0x1.

  - id: ps_transcription_on
    type: registry_value
    category: vuln
    display: "EASY: PowerShell transcription is enabled"
    max_points: 2
    collect:
      hive: HKLM
      key: SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription
      value: EnableTranscripting
    expect:
      equals: 1
      field: value
      points: 2
    solution: |
      **1. Read the switch.** Transcription writes every PowerShell
      session's input and output to a timestamped file -- the full
      transcript of what an attacker typed:

      ```
      reg query "HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription" /v EnableTranscripting
          EnableTranscripting    REG_DWORD    0x0
      ```

      **2. Turn it on:**

      ```
      reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription" /v EnableTranscripting /t REG_DWORD /d 1 /f
      ```

      (GPO route: Administrative Templates > Windows Components >
      Windows PowerShell > Turn on PowerShell Transcription; set the
      output directory to a protected share if you like.)

      **3. Confirm.** The reg query reads 0x1. Pairs with script-block
      logging: that one records what the ENGINE ran, this one records
      what the USER saw.

  # --- E. SERVICES -----------------------------------------------------------------
  # The two malicious services are REAL running services (an SCM wrapper exe
  # launching a hidden PowerShell payload, with sc failure auto-restart), each
  # scored three ways -- payload process gone, service stopped, service
  # disabled -- mirroring the pinecrest/solar pattern: killing the process
  # alone buys one round until the recovery action respawns it.
  - id: spooler_stopped
    type: service_state
    category: vuln
    display: "EASY: The Print Spooler service is stopped"
    max_points: 2
    timeout_s: 25
    collect:
      service: Spooler
    expect:
      equals: false
      field: active
      points: 2
    solution: |
      **1. Ask what a domain controller prints.** Nothing -- yet the
      Print Spooler ships running and auto-start on every Windows
      Server by default, and it is the service behind the
      PrintNightmare class of remote code execution. Nothing was
      planted here: the insecure DEFAULT is the finding.

      ```
      Get-Service Spooler        # Running
      ```

      **2. Stop it:**

      ```
      Stop-Service Spooler -Force
      ```

      (services.msc > Print Spooler > Stop.)

      **3. Confirm.** `Get-Service Spooler` reports `Status : Stopped`.
      Stopping earns the easy half -- the disabled-at-startup task is
      the rest.

  - id: spooler_disabled
    type: service_state
    category: vuln
    display: "EASY: The Print Spooler service is disabled at startup"
    max_points: 2
    timeout_s: 25
    collect:
      service: Spooler
    expect:
      equals: false
      field: enabled
      points: 2
    solution: |
      A stopped spooler survives only until the next reboot -- the
      startup type is still the Windows default (Automatic). Make the
      off-state permanent:

      ```
      Set-Service Spooler -StartupType Disabled
      ```

      GUI route: services.msc > Print Spooler > Properties > Startup
      type: Disabled.

      **Confirm:** `Get-CimInstance Win32_Service -Filter
      "Name='Spooler'" | Select-Object StartMode` reports `Disabled`.
      If the authority ever truly needs to print, re-enable it that
      day -- deliberately, not by default.

  - id: fleetsync_process_killed
    type: process_state
    category: vuln
    display: "MODERATE: The fleet-telemetry payload process is terminated"
