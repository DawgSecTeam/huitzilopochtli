  # --- J. PERSISTENCE (post-exploitation, on the DC) ---------------------------------
  # The breadth here is the point: a real cleanup means sweeping EVERY
  # autoruns location, not just the two the last box taught. Run keys x2,
  # scheduled tasks x2, services (section E), IFEO debugger hijacks,
  # Winlogon Userinit, a WMI event subscription, and a startup-folder item.
  - id: runkey_pulse_removed
    type: registry_value
    category: vuln
    display: "MODERATE: A Run-key persistence entry launching a hidden payload is removed"
    max_points: 4
    collect:
      hive: HKLM
      key: SOFTWARE\Microsoft\Windows\CurrentVersion\Run
      value: FleetPulseCore
    expect:
      equals: false
      field: present
      points: 4
    solution: |
      **1. Read the Run key** -- everything under it launches at every
      interactive logon:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run"
          FleetPulseCore       REG_SZ    powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "C:\ProgramData\Subsystems\fleetpulse.ps1"
          RelayStatusWidget    REG_SZ    powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "C:\ProgramData\Subsystems\statuswidget.ps1"
      ```

      Values named like fleet apps that start HIDDEN PowerShell scripts
      from an attacker-made directory are not fleet apps -- they are
      persistence. (And a GPO is pushing a third one onto every domain
      machine -- that is its own task in Group Policy.)

      **2. Note each value's NAME, then delete them** -- the names are
      forensics answers; record them before cleaning:

      ```
      reg delete "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" /v FleetPulseCore /f
      reg delete "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" /v RelayStatusWidget /f
      ```

      **3. Confirm.** The reg query no longer lists either value. The
      scripts they launched have their own tasks.

  - id: runkey_pulse_payload_gone
    type: permission
    category: vuln
    display: "EASY: The Run-key payload script under C:\\ProgramData\\Subsystems is removed"
    max_points: 2
