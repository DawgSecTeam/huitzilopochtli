      A placeholder loop -- the entry was the persistence, the script
      the slot.

      **2. Delete it:**

      ```
      Remove-Item C:\ProgramData\Subsystems\fleetpulse.ps1 -Force
      ```

      **3. Confirm.** `Test-Path
      C:\ProgramData\Subsystems\fleetpulse.ps1` is False. The other
      Subsystems payloads have their own tasks -- once all are gone,
      remove the directory itself.

