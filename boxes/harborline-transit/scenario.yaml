      field: present
      points: 2
    solution: |
      **1. Check the accessibility backdoor.** When Sticky Keys is
      triggered at the logon screen, Windows launches sethc.exe --
      UNAUTHENTICATED. An Image File Execution Options "Debugger"
      value redirects that launch to the attacker's command instead:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe" /v Debugger
