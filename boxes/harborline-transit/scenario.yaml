  # --- F. SHARES / FILES / NETWORK -------------------------------------------------
  - id: transit_share_restricted
    type: powershell_json
    category: vuln
    display: "MODERATE: The operations share no longer grants Everyone access"
    max_points: 4
    timeout_s: 20
    collect:
      script: |
        $share = Get-SmbShare -Name 'TransitData' -ErrorAction Ignore
        if (-not $share) { $true | ConvertTo-Json -Compress; exit }
        $bad = Get-SmbShareAccess -Name 'TransitData' |
            Where-Object { $_.AccessControlType -eq 'Allow' -and $_.AccountName -match 'Everyone' }
        (-not $bad) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Inspect the share.**

      ```
      Get-SmbShareAccess -Name TransitData
      TransitData   Everyone   Allow   Full
      ```

      The operations share hands all of C:\HarborlineData -- payroll
      included -- to the entire world. The per-file ACL fix counts for
      little while the share keeps re-exposing the folder over SMB.

      **2. Revoke Everyone**, then grant only who needs it:

      ```
      Revoke-SmbShareAccess -Name TransitData -AccountName Everyone -Force
      Grant-SmbShareAccess -Name TransitData -AccountName "Authenticated Users" -AccessRight Change -Force
      ```

      GUI route: folder Properties > Sharing > Advanced Sharing >
      Permissions. (Removing the share outright also satisfies the
      check, and the share-encryption task next door is satisfied by
      removal too -- but a properly locked, encrypted share is the
      better ending.)

      **3. Confirm.** `Get-SmbShareAccess -Name TransitData` shows no
      Everyone Allow row.

  - id: payroll_acl_restricted
    type: powershell_json
    category: vuln
    display: "MODERATE: The payroll export is no longer writable by Everyone"
    max_points: 4
    timeout_s: 20
    collect:
      script: |
        $p = 'C:\HarborlineData\payroll-export.csv'
        if (-not (Test-Path $p)) { $false | ConvertTo-Json -Compress; exit }
        $bad = Get-Acl $p | Select-Object -ExpandProperty Access |
            Where-Object { $_.AccessControlType -eq 'Allow' -and $_.IdentityReference -match 'Everyone' }
        (-not $bad) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Read the ACL.**

      ```
      icacls C:\HarborlineData\payroll-export.csv
      Everyone:(F)
      ```

      Full Control for Everyone on a payroll export -- anyone who can
      touch the box (or the TransitData share, its own task) can
      rewrite or empty it.

      **2. Remove the Everyone grant -- in place.** The file itself
      must stay (the penalty check guards it):

      ```
      icacls C:\HarborlineData\payroll-export.csv /remove:g Everyone
      ```

      GUI route: file Properties > Security > select Everyone >
      Remove. If the strip removes too much, re-grant real access:
      `icacls <file> /grant "Administrators:F"` -- or restore
      inheritance with `icacls <file> /inheritance:e`.

      **3. Confirm.** The icacls output lists no Everyone entry.

  - id: dispatch_creds_removed
    type: permission
    category: vuln
    display: "EASY: The leftover credentials file under C:\\HarborlineData\\scripts is removed"
    max_points: 2
    collect:
      path: C:\HarborlineData\scripts\dispatch_creds.txt
    expect:
      equals: false
      field: exists
      points: 2
    solution: |
      **1. Read it first** -- evidence before deletion:

      ```
      Get-Content C:\HarborlineData\scripts\dispatch_creds.txt
      # dispatch gateway creds (KEEP PRIVATE)
      user: sysadmin
      password: ...
      ```

      The box's admin password, written to disk for anyone to read --
      planted or lazily left behind, it hands every local process the
      keys.

      **2. Delete the file:**

      ```
      Remove-Item C:\HarborlineData\scripts\dispatch_creds.txt -Force
      ```

      **3. Confirm.** `Test-Path
      C:\HarborlineData\scripts\dispatch_creds.txt` is False -- and
      rotate the exposed password everywhere it might be reused.

  - id: hosts_redirect_removed
    type: file_regex
    category: vuln
    display: "MODERATE: The hosts-file redirect to the fake payroll portal is removed"
    max_points: 4
    collect:
      path: C:\Windows\System32\drivers\etc\hosts
      extract: '(?m)^10\.44\.9\.9\s+(payroll\.harborline\.example)'
    expect:
      equals: null
      points: 4
    solution: |
      **1. Read the hosts file** -- its entries outrank DNS for every
      process on the box:

      ```
      Get-Content C:\Windows\System32\drivers\etc\hosts
      # Harborline fast-route
      10.44.9.9    payroll.harborline.example
      ```

      The authority's own payroll portal name, silently steered to an
      IP nobody assigned -- staff typing the normal URL land on the
      wrong host, and hand it their credentials.

      **2. Note the redirected hostname, then delete only that line**
      (and its planted comment). Leave the stock comments and
      localhost entries alone:

      ```
      notepad C:\Windows\System32\drivers\etc\hosts
      ```

      (Elevated notepad. PowerShell route: Get-Content, filter the line
      out with `Where-Object { $_ -notmatch 'payroll\.harborline' }`,
      Set-Content back.)

      **3. Confirm.** `Select-String payroll.harborline.example
      C:\Windows\System32\drivers\etc\hosts` prints nothing.

  - id: unattend_leftover_removed
    type: permission
    category: vuln
    display: "EASY: The setup leftover carrying an account password is removed"
    max_points: 2
    collect:
      path: C:\Windows\Panther\unattend.xml
    expect:
      equals: false
      field: exists
      points: 2
    solution: |
      **1. Read it first.** Windows keeps its setup answer files after
      installation -- and this one still holds a plaintext password:

      ```
      Get-Content C:\Windows\Panther\unattend.xml
      ... <Password><Value>...</Value><PlainText>true</PlainText></Password> ...
      ```

      Unattend leftovers are a classic find: the install-time password
      outlives the install and often still works.

      **2. Delete the file** (setup never needs it again):

      ```
      Remove-Item C:\Windows\Panther\unattend.xml -Force
      ```

      **3. Confirm.** `Test-Path C:\Windows\Panther\unattend.xml` is
      False -- and rotate whatever password it held.

  # --- G. ACTIVE DIRECTORY OBJECTS & KERBEROS --------------------------------------
  - id: faregw_delegation_cleared
    type: powershell_json
    category: vuln
    display: "HARD: The fare-gateway computer trusted for unconstrained delegation has it removed"
    max_points: 8
    timeout_s: 30
    collect:
      script: |
        # Both delegation flags must be clear while the computer object
        # still exists: unconstrained delegation ("Trust this computer
        # for delegation to any service") makes every visiting admin's
        # ticket grantable to anyone who compromises that host.
        Import-Module ActiveDirectory -ErrorAction Ignore
        $c = Get-ADComputer -Filter 'Name -eq "FAREGW01"' -Properties TrustedForDelegation, TrustedToAuthForDelegation -ErrorAction Ignore
        ($null -ne $c -and -not $c.TrustedForDelegation -and -not $c.TrustedToAuthForDelegation) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 8
    solution: |
      **1. Find the delegation.** A computer (or user) object trusted
      for unconstrained delegation caches a copy of every credential
      that touches it -- compromise the fare gateway and you replay
      domain-admin tickets:

      ```
      Get-ADComputer -Filter 'TrustedForDelegation -eq $true' -Properties TrustedForDelegation
      ```

      **2. Clear it** -- the gateway needs no delegation for its job;
      keep the object (services are being rebuilt onto it), take away
      the trust:

      ```
      Set-ADAccountControl -Identity 'FAREGW01$' -TrustedForDelegation $false -TrustedToAuthForDelegation $false
      ```

      GUI route: ADUC > Computers > FAREGW01 > Properties >
      Delegation > "Do not trust this computer for delegation".

      **3. Confirm.** The sweep prints nothing (both flags false while
      FAREGW01 still exists).

  - id: stale_computer_disabled
    type: powershell_json
    category: vuln
    display: "EASY: The decommissioned workstation's computer account is disabled"
    max_points: 2
    timeout_s: 30
    collect:
      script: |
        Import-Module ActiveDirectory -ErrorAction Ignore
        $c = Get-ADComputer -Filter 'Name -eq "WS-OLD2301"' -ErrorAction Ignore
        ($null -ne $c -and $c.Enabled -eq $false) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 2
    solution: |
      **1. Find the orphan.** An enabled computer account whose machine
      left the building three years ago is a free join point for
      anything that can prove its old identity:

      ```
      Get-ADComputer -Filter 'Name -eq "WS-OLD2301"' -Properties Description, Enabled
      Decommissioned fare-gate test rig (2023)
      ```

      **2. Disable it:**

      ```
      Disable-ADAccount -Identity 'WS-OLD2301$'
      ```

      GUI route: ADUC > Computers > WS-OLD2301 > Properties > tick
      "Account is disabled". (Deleting stale objects is the real
      cleanup, but disable-then-delete-on-a-schedule is the safe
      order -- and the scored state here is disabled, not gone.)

      **3. Confirm.** `Enabled : False`.

  - id: preauth_required
    type: powershell_json
    category: vuln
    display: "MODERATE: No account is left with Kerberos preauthentication disabled"
    max_points: 4
    timeout_s: 30
    collect:
      script: |
        # Sweep every ENABLED account: "Do not require Kerberos
        # preauthentication" is the AS-REP-roasting misconfiguration --
        # anyone can request that account's crackable hash without a
        # ticket first. Disabled accounts are exempt (they cannot roast).
        Import-Module ActiveDirectory -ErrorAction Ignore
        $bad = @(Get-ADUser -Filter 'Enabled -eq $true' -Properties DoesNotRequirePreauth -ErrorAction Ignore |
            Where-Object { $_.DoesNotRequirePreauth })
        ($bad.Count -eq 0) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Sweep for the misconfiguration** -- the same sweep the check
      runs (do it BEFORE you disable or fix the account; a fixed or
      disabled account stops matching, and what you find is a forensics
      answer):

      ```
      Get-ADUser -Filter 'Enabled -eq $true' -Properties DoesNotRequirePreauth |
        Where-Object { $_.DoesNotRequirePreauth } |
        Select-Object SamAccountName, Description
      <one account>   <a fare-gate flavored description>
      ```

      With preauthentication off, anyone can ask the DC for that
      account's AS-REP and crack it offline -- no password needed up
      front (AS-REP roasting).

      **2. Re-enable preauthentication** -- keep the account (the fare
      gates poll through it; the fix is the flag, not the guillotine):

      ```
      Set-ADAccountControl -Identity <the account> -DoesNotRequirePreAuth $false
      ```

      GUI route: ADUC > user > Properties > Account tab > untick "Do
      not require Kerberos preauthentication".

      **3. Confirm.** The sweep prints nothing.

  - id: des_downgrade_cleared
    type: powershell_json
    category: vuln
    display: "HARD: No account is restricted to legacy DES-only Kerberos encryption"
    max_points: 8
    timeout_s: 30
    collect:
      script: |
        # Sweep every ENABLED account for the DES-only downgrade: the
        # msDS-SupportedEncryptionTypes bit 0x1 (DES) makes every ticket
        # for that account crackable at 1999 speeds. $null/0 = allowed to
        # negotiate modern AES -- the hardened state.
        Import-Module ActiveDirectory -ErrorAction Ignore
        $bad = @(Get-ADUser -Filter 'Enabled -eq $true' -Properties 'msDS-SupportedEncryptionTypes' -ErrorAction Ignore |
            Where-Object { ($_.'msDS-SupportedEncryptionTypes' -band 1) -ne 0 })
        ($bad.Count -eq 0) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 8
    solution: |
      **1. Sweep for the downgrade** (before you fix anything -- a
      fixed account stops matching):

      ```
      Get-ADUser -Filter 'Enabled -eq $true' -Properties 'msDS-SupportedEncryptionTypes' |
        Where-Object { ($_.'msDS-SupportedEncryptionTypes' -band 1) -ne 0 } |
        Select-Object SamAccountName
      ```

      One account is pinned to DES-only ("Use Kerberos DES encryption
      types for this account") -- 56-bit keys, crackable in minutes on
      a GPU; attackers force this downgrade where they can.

      **2. Lift the restriction** so the account negotiates modern AES:

      ```
      Set-ADUser -Identity <the account> -KerberosEncryptionType None
      ```

      (None = clear the restriction and let AES negotiate. If the
      cmdlet rejects the value on this build, clear the attribute
      directly: the scored state is the DES bit gone.)

      **3. Confirm.** The sweep prints nothing.

  - id: dcsync_rights_revoked
    type: powershell_json
    category: vuln
    display: "HARD: The account with directory-replication (DCSync) rights on the domain root has them revoked"
    max_points: 8
    timeout_s: 45
    collect:
      script: |
        # DS-Replication-Get-Changes / -All on the domain root is the
        # DCSync primitive: with it, an account asks the DC to hand
        # over every hash in the domain without logging on anywhere.
        # Only DCs themselves should hold it. The scored state: the
        # account still exists (it is the replication monitor; the fix
        # is the ACL, not the guillotine) with no Allow ACE on either
        # replication GUID.
        Import-Module ActiveDirectory -ErrorAction Ignore
        $t = Get-ADUser -Filter "SamAccountName -eq 'svc_repl'" -ErrorAction Ignore
        $clean = $false
        if ($null -ne $t) {
            $rootDn = (Get-ADDomain).DistinguishedName
            $acl = Get-Acl "AD:\$rootDn"
            $guids = @('1131f6aa-9c07-11d1-f79f-00c04fc2dcd2',
                       '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2')
            $bad = @($acl.Access | Where-Object {
                ($_.IdentityReference.Value -like '*svc_repl') -and
                ($_.AccessControlType.ToString() -eq 'Allow') -and
                ($guids -contains $_.ObjectType.ToString())
            })
            $clean = ($bad.Count -eq 0)
        }
        $clean | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 8
    solution: |
      **1. Read the domain root's ACL.** Two extended rights matter:
      DS-Replication-Get-Changes and DS-Replication-Get-Changes-All.
      Together they are DCSync -- the ability to ask the DC to
      replicate you every password hash in the domain:

      ```
      $acl = Get-Acl "AD:DC=harborline,DC=local"
      $acl.Access | Where-Object { $_.AccessControlType -eq 'Allow' } |
        Format-Table IdentityReference, ObjectType -AutoSize
      ```

      One service account holds both GUIDs. It never needs them: only
      domain controllers do.

      **2. Remove the ACEs** -- keep the account, take the rights:

      ```
      $acl.Access | Where-Object { $_.IdentityReference -like '*svc_repl' } |
        ForEach-Object { $acl.RemoveAccessRuleSpecific($_) | Out-Null }
      Set-Acl -Path "AD:DC=harborline,DC=local" -AclObject $acl
      ```

      **3. Confirm.** The Format-Table above no longer lists the
      account against either replication GUID.

  - id: gpp_cpassword_purged
    type: powershell_json
    category: vuln
    display: "MODERATE: No Group Policy Preferences file under SYSVOL hides an encrypted password"
    max_points: 4
    timeout_s: 45
    collect:
      script: |
        # The MS14-025 finding: GPP Groups.xml carries the local-account
        # password AES-encrypted with a key Microsoft published in 2014
        # -- any domain user decrypts it (gpp-decrypt). The fix is the
        # cpassword gone (delete the file or the preference), anywhere
        # under SYSVOL. A dynamic recurse, not a fixed GPO-GUID path:
        # New-GPO GUIDs are random.
        $hits = @(Get-ChildItem 'C:\Windows\SYSVOL\domain\Policies' -Recurse -Filter 'Groups.xml' -ErrorAction Ignore |
            Select-String -Pattern 'cpassword' -ErrorAction Ignore)
        ($hits.Count -eq 0) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Sweep SYSVOL the way the check does** (record what you find
      first -- one of the values inside is a forensics answer):

      ```
      Get-ChildItem C:\Windows\SYSVOL\domain\Policies -Recurse -Filter Groups.xml |
        Select-String -Pattern 'cpassword' -List
      ```

      One Groups.xml under a GPO's Machine\Preferences\Groups holds a
      cpassword attribute -- an AES blob whose key has been public
      since 2014. Decrypt it offline with gpp-decrypt and you have a
      local-admin password for every machine the GPO touches.

      **2. Remove it.** The GPO itself is a leftover ("Deploy Fare
      Kiosk") nobody should be deploying that way anymore -- delete the
      preference (the XML file) or the whole GPO:

      ```
      Remove-GPO -Name 'Deploy Fare Kiosk'
      ```

      (or delete just the Groups.xml file under its SYSVOL path).

      **3. Confirm.** The sweep prints nothing.

  - id: dnsadmins_member_removed
