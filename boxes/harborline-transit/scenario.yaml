      ```

      Five presses of Shift at the logon screen now run the attacker's
      script -- before anyone logs in.

      **2. Delete the Debugger value:**

      ```
      reg delete "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe" /v Debugger /f
      ```

      **3. Confirm.** The reg query errors "unable to find ... value".
      (The sibling accessibility executable -- the Utility Manager --
      has its own task.)

