  - id: winlogon_userinit_clean
    type: powershell_json
    category: vuln
    display: "MODERATE: The Winlogon Userinit value launches nothing beyond the stock initializer"
    max_points: 4
    timeout_s: 20
    collect:
      script: |
        # Userinit runs, comma-separated, inside EVERY interactive
        # logon. The stock value ends with a trailing comma and nothing
        # else; an appended payload exe rides every sign-in.
        $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name Userinit -ErrorAction Ignore).Userinit
        ($v -eq 'C:\Windows\system32\userinit.exe,') | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Read the value.** The Userinit value is the list of
      executables Windows runs for every user at logon -- the stock
      entry ends in a trailing comma and nothing after it:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" /v Userinit
          Userinit    REG_SZ    C:\Windows\system32\userinit.exe, C:\ProgramData\Subsystems\winitupd.exe
      ```

      Anything after that comma runs inside every sign-in, with the
      logging-in user's rights -- an attacker's program in the middle
      of every session.

      **2. Restore the stock value:**

      ```
      reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" /v Userinit /t REG_SZ /d "C:\Windows\system32\userinit.exe," /f
      ```

      (regedit works too -- replace the whole value with the stock
      string, trailing comma INCLUDED.)

      **3. Confirm.** The reg query shows exactly the stock string --
      and delete the payload exe it pointed at
      (C:\ProgramData\Subsystems\winitupd.exe).

  - id: wmi_binding_removed
    type: powershell_json
    category: vuln
    display: "MODERATE: The WMI event-subscription persistence is removed"
    max_points: 4
    timeout_s: 30
    collect:
      script: |
        # WMI subscriptions are fileless persistence: an event filter
        # fires, a command-line consumer runs, a binding couples them --
        # no Run key, no service, no scheduled task for autoruns tools
        # to list. Windows DOES ship one legit binding (SCM Event Log,
        # an NTEventLogEventConsumer) -- the finding is any binding
        # that runs a COMMAND or SCRIPT consumer. Hardened: zero.
        $bad = @(Get-CimInstance -Namespace root\subscription -ClassName __FilterToConsumerBinding -ErrorAction Ignore |
            Where-Object { ($_.Consumer -match 'CommandLineEventConsumer') -or
                           ($_.Consumer -match 'ActiveScriptEventConsumer') })
        ($bad.Count -eq 0) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 4
    solution: |
      **1. Sweep the WMI graveyard.** A stock Windows box ships exactly
      one FilterToConsumerBinding (SCM Event Log -- an event-log
      consumer, part of the OS). Anything that runs a COMMAND or a
      SCRIPT consumer is planted:

      ```
      Get-CimInstance -Namespace root\subscription -ClassName __FilterToConsumerBinding |
        Select-Object Filter, Consumer
      ```

      One binding couples a filter (firing every 60 seconds) to a
      CommandLineEventConsumer running a hidden PowerShell payload --
      persistence with no file on disk that autoruns knows about, no
      service, no scheduled task.

      **2. Remove the whole triple** -- binding, consumer, and filter
      (removing only the binding leaves the other two armed):

      ```
      $b = Get-CimInstance -Namespace root\subscription -ClassName __FilterToConsumerBinding |
        Where-Object { $_.Consumer -match 'CommandLineEventConsumer|ActiveScriptEventConsumer' }
      $b | Remove-CimInstance
      Get-CimInstance -Namespace root\subscription -ClassName CommandLineEventConsumer |
        Remove-CimInstance
      Get-CimInstance -Namespace root\subscription -ClassName __EventFilter |
        Where-Object Name -ne 'SCM Event Log Filter' |
        Remove-CimInstance
      ```

      (If the CIM removal of the binding refuses, the classic API
      deletes it: `Get-WmiObject -Namespace root\subscription -Class
      __FilterToConsumerBinding | Where-Object { $_.Filter -like
      '*<the filter name>*' } | ForEach-Object { $_.Delete() }`.)
      Leave the stock SCM Event Log triple alone -- it is Windows'
      own.

      **3. Confirm.** The binding sweep shows only the SCM Event Log
      entry. (The payload script the consumer ran has its own task.)

  - id: wmi_payload_gone
    type: permission
    category: vuln
    display: "EASY: The WMI consumer's payload script is removed"
    max_points: 2
    collect:
      path: C:\ProgramData\Subsystems\wmihealth.ps1
    expect:
      equals: false
      field: exists
      points: 2
    solution: |
      **1. Delete the payload** (with the subscription triple removed,
      nothing executes it again):

      ```
      Remove-Item C:\ProgramData\Subsystems\wmihealth.ps1 -Force
      ```

      **2. Confirm.** `Test-Path
      C:\ProgramData\Subsystems\wmihealth.ps1` is False.

  - id: startup_item_removed
    type: permission
    category: vuln
    display: "MODERATE: The startup-folder item is removed"
    max_points: 4
    collect:
      path: C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\dispatch-helper.bat
    expect:
      equals: false
      field: exists
      points: 4
    solution: |
      **1. Read the folder first.** The All-Users StartUp folder runs
      its contents at every sign-in -- it predates every other
      persistence trick and still works:

      ```
      Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
      dispatch-helper.bat
      ```

      **2. Read what it runs, then delete it:**

      ```
      Get-Content "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\dispatch-helper.bat"
      Remove-Item "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\dispatch-helper.bat" -Force
      ```

      (It launches another hidden PowerShell payload from the
      Subsystems directory -- delete that script too.)

      **3. Confirm.** The folder listing is empty.

  # --- K. DON'T-BREAK-THE-BOX HYGIENE -------------------------------------------------
  # Positive checks: the domain plumbing must stay healthy while you clean.
  # These score while the service is RUNNING -- breaking AD's time source,
  # Kerberos, or secure-channel machinery to "fix" something costs these
  # points and can brick the box.
  - id: w32time_running
    type: service_state
    category: vuln
    display: "EASY: The Windows Time service is running (the DC is the domain's time source)"
    max_points: 2
    timeout_s: 25
    collect:
      service: W32Time
    expect:
      equals: true
      field: active
      points: 2
    solution: |
      This one scores while the service is UP. Windows Time is the
      domain's heartbeat -- Kerberos tickets live and die by clock
      skew, and a DC whose time drifts breaks authentication for the
      whole forest. Nothing is wrong with it; the check just refuses to
      award a cleanup that broke it:

      ```
      Get-Service W32Time        # Running
      ```

      If it shows Stopped (it should not, unless something you changed
      stopped it), start it again:

      ```
      Start-Service W32Time
      ```

  - id: kdc_running
    type: service_state
    category: vuln
    display: "EASY: The Kerberos Key Distribution Center service is running"
    max_points: 2
    timeout_s: 25
    collect:
      service: Kdc
    expect:
      equals: true
      field: active
      points: 2
    solution: |
      This one scores while the service is UP. The KDC is the service
      that issues every Kerberos ticket in the domain -- stop it and
      nobody authenticates to anything:

      ```
      Get-Service Kdc        # Running
      ```

      If it shows Stopped, you have found why the domain feels broken
      -- start it:

      ```
      Start-Service Kdc
      ```

  - id: netlogon_running
    type: service_state
    category: vuln
    display: "EASY: The Netlogon service is running (domain secure-channel machinery)"
    max_points: 2
    timeout_s: 25
    collect:
      service: Netlogon
    expect:
      equals: true
      field: active
      points: 2
    solution: |
      This one scores while the service is UP. Netlogon is the
      secure-channel machinery every domain logon and trust path rides
      on:

      ```
      Get-Service Netlogon        # Running
      ```

      If it shows Stopped, domain logons break -- start it:

      ```
      Start-Service Netlogon
      ```

  # --- penalty guards -----------------------------------------------------------------
  # Anti-scorched-earth, three ways: the roster survives (disable-not-delete
  # is for ROGUE accounts, never staff), the evidence survives (the payroll
  # export is the incident's file), and the domain keeps resolving (DNS is
  # load-bearing). These only ever subtract.
  - id: legit_staff_intact
    type: powershell_json
    category: penalty
    display: "PENALTY: Disabling or deleting the payroll staff account costs 10 points"
    max_points: 10
    timeout_s: 30
    collect:
      script: |
        Import-Module ActiveDirectory -ErrorAction Ignore
        $u = Get-ADUser -Filter "SamAccountName -eq 'rcastillo'" -ErrorAction Ignore
        ($null -ne $u -and $u.Enabled) | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: -10
    solution: |
      This one only ever subtracts: the moment the payroll staff user
      `rcastillo` is disabled or deleted, 10 points come off the board.
      The roster is the domain's evidence -- real employees -- and
      disabling them "fixes" findings that were never theirs. The
      planted problems belong to the accounts named in the tasks (and
      those, too, should be disabled, not deleted).

      **Check yourself at any time:**

      ```
      Get-ADUser rcastillo -Properties Enabled     # Enabled : True
      ```

      If it prints False, re-enable the account before anything else --
      the agent re-scores every pass, so a re-enabled account stops
      the bleed:

      ```
      Enable-ADAccount -Identity rcastillo
      ```

  - id: payroll_file_present
    type: permission
    category: penalty
    display: "PENALTY: Destroying the payroll export evidence at C:\\HarborlineData\\payroll-export.csv costs 10 points"
    max_points: 10
    collect:
      path: C:\HarborlineData\payroll-export.csv
    expect:
      equals: true
      field: exists
      points: -10
    solution: |
      This one only ever subtracts: the moment
      C:\HarborlineData\payroll-export.csv stops existing, 10 points
      come off the board. The CSV is the incident's evidence -- real
      payroll rows -- and deleting it is both a scoring penalty and the
      cardinal incident-response sin: destroying what you were
      supposed to protect.

      **The trap sits in the tasks next door:** the ACL and share
      fixes are done IN PLACE (`icacls /remove`,
      `Revoke-SmbShareAccess`). Never "solve" a permissions problem by
      removing the file, and never reset the C:\HarborlineData tree
      wholesale.

      **Check yourself at any time:**

      ```
      Test-Path C:\HarborlineData\payroll-export.csv     # True
      ```

      If it prints False, restore the file before anything else -- the
      agent re-scores every pass, so a restored file stops the bleed.

  - id: dns_service_running
    type: service_state
    category: penalty
    display: "PENALTY: Stopping the DNS Server service costs 10 points"
    max_points: 10
    timeout_s: 25
    collect:
      service: DNS
    expect:
      equals: true
      field: active
      points: -10
    solution: |
      This one only ever subtracts: the moment the DNS Server service
      stops, 10 points come off the board -- and that is before the
      domain itself stops resolving, which breaks EVERYTHING (this DC
      runs DNS for harborline.local; kill it and authentication, GPO,
      and your own sessions all follow it down).

      **Check yourself at any time:**

      ```
      Get-Service DNS        # Running
      ```

      If it shows Stopped, start it before anything else -- the agent
      re-scores every pass, so a running service stops the bleed:

      ```
      Start-Service DNS
      ```

# --- scored forensics ---------------------------------------------------------
# The answer keys live ONLY in the rubric (compiled from this file's
# answers). None of the eight answers is named by any check display: they
# require investigating the planted artifacts, not reading the report.
# Investigate FIRST, harden second -- several fixes (deleting the GPP file,
# unregistering the tasks, removing the GPO, disabling the hidden accounts)
# destroy the evidence the questions ask about.
forensics:
  - id: fq_hidden_dollar_account
    question: "One rogue account hides behind a dollar-suffix name so it blends into the computer accounts. What is that account's username?"
    points: 8
    answer: "helpdesk$"
    answers: ["helpdesk$", "helpdesk"]
    solution: |
      Sweep the enabled USER accounts for names that end in `$` -- the
      costume computers wear, borrowed by one thing in the user listing
      that has no machine behind it:

      ```
      Get-ADUser -Filter 'Enabled -eq $true' |
        Where-Object { $_.SamAccountName -like '*$' } |
        Select-Object SamAccountName, Description
      ```

      (Do this BEFORE disabling anything in the hardening tasks -- a
      disabled or deleted account stops matching.) The description is
      the tell: a "tool" account no roster explains. Answer: the
      SamAccountName shown above, dollar sign INCLUDED.

  - id: fq_no_password_account
    question: "One enabled account is flagged to not require a password at all -- it logs on with an empty one. What is that account's username?"
    points: 8
    answer: "qa_kiosk"
    answers: ["qa_kiosk"]
    solution: |
      Sweep for the domain-side blank-password flag (the same query the
      scoring check runs -- do it BEFORE fixing the account):

      ```
      Get-ADUser -Filter 'Enabled -eq $true' -Properties PasswordNotRequired |
        Where-Object { $_.PasswordNotRequired } |
        Select-Object SamAccountName, Description
      ```

      One account comes back, wearing a QA-kiosk description. Answer:
      `qa_kiosk` (lowercase, with the underscore).

  - id: fq_asrep_user
    question: "One domain account was left WITHOUT Kerberos preauthentication, making it an AS-REP roasting target. What is that account's username?"
    points: 8
    answer: "svc_turnstile"
    answers: ["svc_turnstile"]
    solution: |
      AS-REP roasting needs no password at all: with "Do not require
      Kerberos preauthentication" ticked, anyone can ask the DC for
      that account's encrypted AS-REP and crack it offline. Sweep for
      it the way the scoring check does:

      ```
      Get-ADUser -Filter 'Enabled -eq $true' -Properties DoesNotRequirePreauth |
        Where-Object { $_.DoesNotRequirePreauth } |
        Select-Object SamAccountName, Description
      <one account>   Legacy fare-gate monitoring agent
      ```

      The description ("Legacy fare-gate monitoring agent") is the
      tell: a "compatibility" checkbox that quietly shipped a roasting
      target. Answer: the SamAccountName shown above (lowercase, with
      the underscore).

  - id: fq_gpp_password
    question: "A Group Policy Preferences file under SYSVOL stores a local-admin password AES-encrypted with Microsoft's published MS14-025 key. What is the DECRYPTED cleartext password?"
    points: 8
    answer: "FareKiosk2026!"
    answers: ["FareKiosk2026!"]
    solution: |
      **1. Find the file** (do this BEFORE deleting it in the hardening
      task -- the file is the evidence):

      ```
      Get-ChildItem C:\Windows\SYSVOL\domain\Policies -Recurse -Filter Groups.xml |
        Select-String -Pattern 'cpassword' -List
      ```

      **2. Read the cpassword attribute** -- a base64 AES blob:

      ```
      [xml]$x = Get-Content <the Groups.xml path>
      $x.Groups.User.Properties.cpassword
      ```

      **3. Decrypt it with the published key** -- gpp-decrypt
      (Kali/SecLists) one-liner, or the same AES-256-CBC/zero-IV
      recipe in Python or PowerShell. The key shipped inside every
      Windows image's GPP CLR files until Microsoft published it in
      MS14-025 (2014):

      ```
      gpp-decrypt <the cpassword blob>
      ```

      Case matters: the password is exactly the plaintext the
      preference was authored with (`FareKiosk2026!`).

  - id: fq_rogue_gpo
    question: "Attackers created a Group Policy Object that pushes a Run-key payload to every machine in the domain. What is that GPO's exact display name?"
    points: 8
    answer: "TransitPulse"
    answers: ["TransitPulse", "transitpulse"]
    solution: |
      List every GPO in the domain and sort by creation -- the
      attacker's is the newest and its owner is not your change
      process:

      ```
      Get-GPO -All | Select-Object DisplayName, CreationTime, Owner |
        Sort-Object CreationTime -Descending | Select-Object -First 5
      ```

      The one that carries an HKLM Run registry value pointing at
      C:\ProgramData\Subsystems is the persistence. The display name
      is one word, no spaces: `TransitPulse` (any casing scores).

  - id: fq_task_name
    question: "A rogue scheduled task ran a payload out of C:\\ProgramData\\Subsystems while wearing a browser-updater costume. What is the task's exact name?"
    points: 8
    answer: "ChromeUpdateCore"
    answers: ["ChromeUpdateCore", "chromeupdatecore"]
    solution: |
      Browse the Task Scheduler Library (taskschd.msc) or query past
      the Microsoft folders:

      ```
      Get-ScheduledTask | Where-Object { $_.TaskPath -notlike '\Microsoft*' } |
        Select-Object TaskName, State
      ```

      One name wears a browser-updater costume; the action confesses:
      `(Get-ScheduledTask <the name>).Actions` executes
      `-File "C:\ProgramData\Subsystems\chromeupdate.ps1"` as SYSTEM.
      (There is a SECOND impostor in the library in an
      office-telemetry costume -- the question asks for the
      BROWSER-UPDATER one. Any casing scores.)

  - id: fq_runkey_value
    question: "Run keys under HKLM launch hidden PowerShell payloads at logon. What is the exact name of the registry VALUE whose payload file is fleetpulse.ps1?"
    points: 8
    answer: "FleetPulseCore"
    answers: ["FleetPulseCore", "fleetpulsecore"]
    solution: |
      Walk the autoruns that fire at logon -- the HKLM Run key first:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run"
      ```

      Two values start hidden PowerShell scripts from the same
      attacker-made directory; the question asks for the one whose
      command ends in fleetpulse.ps1. The answer is the registry VALUE
      name -- the left-hand column, not the command
      (`FleetPulseCore`, case-insensitive). (Already deleted it in the
      hardening task? The name was in this query's output before you
      cleaned -- which is why findings get noted first.)

  - id: fq_ifeo_executable
    question: "An Image File Execution Options Debugger hijack waits on one of the two accessibility executables that launch from the logon screen. Which executable is hijacked -- sethc.exe or utilman.exe?"
    points: 8
    answer: "sethc.exe"
    answers: ["sethc.exe", "sethc"]
    solution: |
      Both accessibility executables have an IFEO key worth checking;
      one of them carries a Debugger value that redirects its
      unauthenticated logon-screen launch into a hidden payload:

      ```
      reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe" /v Debugger
      reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\utilman.exe" /v Debugger
      ```

      One query returns a Debugger value pointing into
      C:\ProgramData\Subsystems, the other errors. The answer is the
      NAME of the executable whose key carries the hijack
      (`sethc.exe` -- the Sticky Keys program; utilman.exe scores only
      if that is where YOUR query found it).

# --- theme ---------------------------------------------------------------------
# Windows target: boxbuilder/theme.py resolves this through the theme-*-win
# seeds (wallpaper + README.html to every profile's Public Documents, .lnk
# shortcuts including the auto-added "Scoring Report" launcher). motd/issue
# are POSIX-only and skipped; title/organization/accent/logo flow through the
# signed manifest into the report masthead.
theme:
  title: "Harborline Transit Authority"
  organization: "Harborline Transit Authority"
  accent: "#0369A1"
  logo: assets/logo.png
  wallpaper: assets/wallpaper.png
  readme: assets/README.md
  # Windows .lnk shortcuts: exec is the TARGET path (%VAR% expanded by the
  # theme-shortcuts-win seed). The handbook points at the Public Documents copy
  # theme-readme-win plants -- the Public Desktop itself stays at exactly the
  # forensics answers file + shortcuts.
  desktop_shortcuts:
    - name: "Hardening Handbook"
      exec: "%PUBLIC%\\Documents\\huitzilopochtli\\README.html"
