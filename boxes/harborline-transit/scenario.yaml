  - id: ifeo_sethc_clean
    type: registry_value
    category: vuln
    display: "EASY: The accessibility executable's Debugger hijack is removed"
    max_points: 2
    collect:
      hive: HKLM
      key: SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe
      value: Debugger
    expect:
