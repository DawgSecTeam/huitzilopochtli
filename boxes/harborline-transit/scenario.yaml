      **3. Confirm.** `Get-ADGroupMember 'DNSAdmins'` returns nothing.

  # --- H. GROUP POLICY ----------------------------------------------------------------
  - id: gpo_persistence_removed
    type: powershell_json
    category: vuln
    display: "HARD: The GPO pushing a Run-key payload to every domain machine is removed (or its value cleared)"
    max_points: 8
    timeout_s: 45
    collect:
      script: |
        # Domain-level persistence: a GPO whose registry preference
        # writes an HKLM Run-key value on every machine it applies to.
        # Unlike a local Run key, deleting the local value is pointless
        # -- the next policy refresh re-writes it. The fix is the GPO
        # gone or its registry value gone.
        Import-Module GroupPolicy -ErrorAction Ignore
        $clean = $true
        $g = Get-GPO -Name 'TransitPulse' -ErrorAction Ignore
        if ($null -ne $g) {
            $v = $null
            try {
                $v = Get-GPRegistryValue -Name 'TransitPulse' -Key 'HKLM\Software\Microsoft\Windows\CurrentVersion\Run' -ValueName 'EdgeUpdateOrchestrator' -ErrorAction Ignore
            } catch { $v = $null }
            $clean = ($null -eq $v)
        }
        $clean | ConvertTo-Json -Compress
    expect:
      equals: true
      field: data
      points: 8
    solution: |
      **1. Hunt the attacker's GPO.** List every GPO and look for one
      nobody recognizes -- its display name borrows a familiar product,
      but no admin created it:

      ```
      Get-GPO -All | Select-Object DisplayName, CreationTime, Owner | Sort-Object CreationTime
      ```

      The fresh one at the top was made by the compromise. Read what it
      pushes:

      ```
      Get-GPRegistryValue -Name '<the GPO>' -Key 'HKLM\Software\Microsoft\Windows\CurrentVersion\Run'
      ```

      A Run-key value launching a hidden PowerShell script from
      C:\ProgramData\Subsystems -- persistence on every machine the
      GPO reaches, re-armed by every policy refresh.

      **2. Delete the GPO** (or just its registry value if the name is
      needed -- it is not):

      ```
      Remove-GPO -Name '<the GPO>'
      ```

      **3. Confirm.** Get-GPO -All no longer lists it, and the
      Get-GPRegistryValue call errors with "value not found". Note the
      GPO's exact display name before deleting -- it is a forensics
      answer.

