  expect:
    equals: true
    field: data
    points: 5
  solution: |
    Three minutes into the source competition, an ordinary user account was
    made a Domain Admin. Membership in that group is the highest-value
    object on the box; audit it as such.

    ```
    Get-ADGroupMember 'Domain Admins' | Select-Object SamAccountName, Name
    Remove-ADGroupMember 'Domain Admins' -Members 'speedy.gonzales' -Confirm:$false
    ```

