- id: w3_07_delegation_cleared
  type: powershell_json
  category: vuln
  display: "W3: No account is trusted for unconstrained delegation (app01 included)"
  max_points: 5
  timeout_s: 30
  collect:
    script: |
      Import-Module ActiveDirectory -ErrorAction Ignore
      $c = Get-ADComputer -Identity 'app01' -Properties TrustedForDelegation,TrustedToAuthForDelegation -ErrorAction SilentlyContinue
      $ok = $true
      if ($c) { $ok = ((-not $c.TrustedForDelegation) -and (-not $c.TrustedToAuthForDelegation)) }
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    Unconstrained delegation makes the box's computer account a
    ticket-catching dragnet: any DA-authenticated traffic THROUGH the
    account leaves reusable credentials in its memory.

    ```
    Get-ADComputer app01 -Properties TrustedForDelegation,TrustedToAuthForDelegation
    Set-ADAccountControl -Identity 'app01$' -TrustedForDelegation $false -TrustedToAuthForDelegation $false
    ```

    Deleting the computer account also satisfies the check.
- id: w3_08_krbtgt_enabled
  type: powershell_json
  category: vuln
  display: "W3: The krbtgt account is enabled"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      Import-Module ActiveDirectory -ErrorAction Ignore
