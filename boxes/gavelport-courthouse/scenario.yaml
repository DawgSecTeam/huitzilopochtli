- id: w3_03_dcsync_rights_revoked
  type: powershell_json
  category: vuln
  display: "W3: speedy.gonzales no longer holds DCSync rights on the domain root"
  max_points: 5
  timeout_s: 30
  collect:
    script: |
      Import-Module ActiveDirectory -ErrorAction Ignore
      $rootDn = (Get-ADDomain -ErrorAction SilentlyContinue).DistinguishedName
      $ok = $true
      if ($rootDn) {
        $acl = Get-Acl -Path "AD:\$rootDn" -ErrorAction SilentlyContinue
        if ($acl) {
          $grants = @($acl.Access | Where-Object {
            ($_.AccessControlType -eq 'Allow') -and
            ($_.IdentityReference -match 'speedy\.gonzales') -and
            ($_.ActiveDirectoryRights -match 'ExtendedRight')
          })
          if ($grants.Count -gt 0) { $ok = $false }
        } else { $ok = $false }
      } else { $ok = $false }
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The DS-Replication-Get-Changes(-All) extended rights on the domain root
    are what DCSync-grade dumping needs; an ordinary account holding them
    can pull every hash without ever logging in.

    ```
    $a = Get-Acl "AD:\<domain DN>"
    $a.Access | Where-Object { $_.IdentityReference -like '*speedy.gonzales*' }
    ```

    Remove the ACEs (both replication rights GUIDs), e.g. via
    `Remove-ADPermission`-style ADSI editing: install a `deny` is not the
    fix -- the Allow entries must be gone.
- id: w3_04_adminsdholder_ace_removed
  type: powershell_json
  category: vuln
  display: "W3: AdminSDHolder carries no Everyone ACE"
  max_points: 5
  timeout_s: 30
  collect:
    script: |
      Import-Module ActiveDirectory -ErrorAction Ignore
      $rootDn = (Get-ADDomain -ErrorAction SilentlyContinue).DistinguishedName
      $ok = $true
      if ($rootDn) {
        $acl = Get-Acl -Path "AD:\CN=AdminSDHolder,CN=System,$rootDn" -ErrorAction SilentlyContinue
        if ($acl) {
          $grants = @($acl.Access | Where-Object {
            ($_.IdentityReference -match 'Everyone') -and ($_.AccessControlType -eq 'Allow')
          })
          if ($grants.Count -gt 0) { $ok = $false }
        } else { $ok = $false }
      } else { $ok = $false }
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    An `Everyone` GenericAll on AdminSDHolder means SDProp re-stamps the ACE
    onto every protected object in the domain, on an hourly cadence, in
    perpetuity.

    ```
    Get-Acl "AD:\CN=AdminSDHolder,CN=System,<domain DN>" |
      ForEach-Object Access | Where-Object IdentityReference -match 'Everyone'
    ```

    Remove the ACE from the AdminSDHolder security descriptor (ADSI
    Edit/`Set-Acl`), then let SDProp run; verify the template's protected
    groups' ACLs no longer inherit it.
