- id: w3_09_gpo_persistence_removed
  type: powershell_json
  category: vuln
  display: "W3: The telemetry GPO's Run-key persistence and its payload are gone"
  max_points: 5
  timeout_s: 30
  collect:
    script: |
      Import-Module GroupPolicy -ErrorAction Ignore
      $gpo = Get-GPO -Name 'Gavelport-Telemetry' -ErrorAction SilentlyContinue
      $val = $null
      if ($gpo) {
        $val = Get-GPRegistryValue -Name 'Gavelport-Telemetry' -Key 'HKLM\Software\Microsoft\Windows\CurrentVersion\Run' -ValueName 'GP-Telemetry' -ErrorAction SilentlyContinue
      }
      $payload = Test-Path 'C:\ProgramData\Subsystems\gpotelemetry.ps1'
      ((($null -eq $val) -and (-not $payload))) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
