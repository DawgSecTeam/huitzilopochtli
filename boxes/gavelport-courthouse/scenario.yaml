scenario:
  name: "Gavelport Courthouse"
  version: 1
  mode: honor
  hosts: ["localhost"]

# Gavelport Courthouse - the county records network's domain controller.
# Replay box for the WRCCDC Inv#2 / MWCCDC Inv#2 Windows DC trails; the
# in-box artifact names (the cast accounts, the SecureUpdate tasks, the
# DNSCache module, the Name!AcmeNNNN password pattern) are range-faithful so
# students can pattern-match the real competitions. THE BOX ARRIVES DIRTY:
# the compromise predates the students (see W1).
#
# Checks are authored against the planted states in nakon.json; the catalog
# scripts are the source of truth for what each plant leaves on disk.

checks:
# ---------------------------------------------------------------- W1: image ships dirty
- id: w1_01_mesh_agent_removed
  type: powershell_json
  category: vuln
  display: "W1: The pre-staged MeshCentral agent service is removed, with its payload directory"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $svc = Get-CimInstance -ClassName Win32_Service -Filter "Name='MeshAgent'" -ErrorAction SilentlyContinue
      if ($svc) { $false | ConvertTo-Json -Compress }
      elseif (Test-Path 'C:\ProgramData\MeshCentral') { $false | ConvertTo-Json -Compress }
      else { $true | ConvertTo-Json -Compress }
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    **1. Prove provenance.** The service predates your assignment. Compare its
    binary's install time against the image's own file dates:

    ```
    Get-CimInstance Win32_Service -Filter "Name='MeshAgent'" |
      Select-Object Name, State, StartMode, PathName, ProcessId
    Get-Item 'C:\ProgramData\MeshCentral\*' | Select-Object Name, CreationTime
    ```

    An RMM agent installed days before you inherited the image is
    arrive-owned access, not operations tooling.

    **2. Remove it completely** -- service first, then the program files.

    ```
    Stop-Service MeshAgent -Force
    sc.exe delete MeshAgent
    Remove-Item -Recurse -Force 'C:\ProgramData\MeshCentral'
    ```

    **3. Confirm.** The service query returns nothing and the directory is
    gone. Stopping without deleting leaves the auto-start configured.
- id: w1_02_dnscache_module_removed
  type: permission
  category: vuln
  display: "W1: The disguised DSInternals module directory under WindowsPowerShell\\v1.0\\Modules is gone"
  max_points: 5
  timeout_s: 20
  collect:
    path: 'C:\Windows\system32\WindowsPowerShell\v1.0\Modules\DNSCache'
  expect:
    equals: false
    field: exists
    points: 5
  solution: |
    **1. Find it.** A PowerShell module directory named like the benign DNS
    client cache that is NOT the real DNS client module:

    ```
    Get-ChildItem 'C:\Windows\system32\WindowsPowerShell\v1.0\Modules\DNSCache' -Force
    ```

    Read the bootstrap -- its function names are the giveaway:
    `Get-ADDBAccount` / `Get-ADReplAccount` / `Get-ADDBBackupKey` are
    AD-database dump and DCSync-grade tooling wearing a DNS costume.
    (Answer the forensics question about its path BEFORE deleting.)

    **2. The directory must go entirely.** Deleting only the .dll, or only
    the .psm1, does not remove the finding -- the score demands the whole
    directory gone, because a renamed distribution keeps loading from a
    partial directory.

    ```
    Remove-Item -Recurse -Force 'C:\Windows\system32\WindowsPowerShell\v1.0\Modules\DNSCache'
    ```

    **3. Sweep.** No `.psm1` under `WindowsPowerShell\v1.0\Modules` should
    reference `Get-ADDBAccount` anywhere else, either.
- id: w1_03_logon_auditing_on
  type: powershell_json
  category: vuln
  display: "W1: Logon, logoff and credential-validation auditing are back on"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $on = $true
      foreach ($sub in @('Logon','Logoff','Other Logon/Logoff Events','Credential Validation')) {
        $s = (auditpol /get /subcategory:"$sub" 2>$null | Out-String)
        if ($s -notmatch 'Success and Failure') { $on = $false }
      }
      $on | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The image ships with logon auditing gutted: no 4624/4625/4776, so
    "who logged in, from where, with what" is unanswerable -- exactly the
    state that made the source competition's attacks unprovable.

    ```
    auditpol /get /subcategory:'Logon'
    auditpol /set /subcategory:'Logon' /success:enable /failure:enable
    auditpol /set /subcategory:'Logoff' /success:enable /failure:enable
    auditpol /set /subcategory:'Other Logon/Logoff Events' /success:enable /failure:enable
    auditpol /set /subcategory:'Credential Validation' /success:enable /failure:enable
    ```

    All four subcategories must read `Success and Failure` in
    `auditpol /get`.
- id: w1_04_powershell_logging_on
  type: powershell_json
  category: vuln
  display: "W1: PowerShell script-block and transcription logging are enabled"
  max_points: 5
  timeout_s: 20
  collect:
    script: |
      $sb = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' -Name EnableScriptBlockLogging -ErrorAction Ignore).EnableScriptBlockLogging
      $tr = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription' -Name EnableTranscription -ErrorAction Ignore).EnableTranscription
      (($sb -eq 1) -and ($tr -eq 1)) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    **1. Read the two policies.**

    ```
    Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
    Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription'
    ```

    Without script-block logging (4104) nothing records what the attacker's
    PowerShell actually did -- the second channel that made the source
    competition's activity unanswerable.

    **2. Turn both on.**

    ```
    Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' -Name EnableScriptBlockLogging -Value 1 -Type DWord
    Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' -Name EnableScriptBlockInvocationLogging -Value 1 -Type DWord
    Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription' -Name EnableTranscription -Value 1 -Type DWord
    ```
- id: w1_05_dns_query_logging_on
  type: registry_value
  category: vuln
  display: "W1: DNS query logging is enabled"
  max_points: 5
  timeout_s: 20
  collect:
    hive: HKLM
    key: SYSTEM\CurrentControlSet\Services\Dnscache\Parameters
    value: EnableQueryLogging
  expect:
    equals: 1
    field: value
    points: 5
  solution: |
    **1. Check the resolver's own log setting.**

    ```
    Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters'
    ```

    With query logging off, lookups the DC makes (including downloads a
    second stage asks it to resolve) leave no trace -- the source DC's DNS
    log held only service lifecycle events.

    **2. Enable it.**

    ```
    Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters' -Name EnableQueryLogging -Value 1 -Type DWord
    ```

    **3. Confirm.** The value reads 1.
- id: w1_06_pattern_passwords_rotated
  type: powershell_json
  category: vuln
  display: "W1: The clerk accounts no longer carry the shared weak password pattern"
  max_points: 5
  timeout_s: 30
  collect:
    script: |
      Import-Module ActiveDirectory -ErrorAction Ignore
      $ok = $true
      foreach ($name in @('daffy.duck','lola.bunny','foghorn.leghorn')) {
        $u = Get-ADUser -Identity $name -Properties Enabled,PasswordLastSet,whenCreated -ErrorAction SilentlyContinue
        if (-not $u) { continue }
        if (-not $u.Enabled) { continue }
        if (-not $u.PasswordLastSet) { $ok = $false; break }
        if ($u.whenCreated -and ($u.PasswordLastSet -lt $u.whenCreated.AddMinutes(5))) { $ok = $false; break }
      }
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    Three employees' passwords share one machine-learnable pattern (the
    source competition leaked it from three logons where the password was
    typed into the username field). One cracked password cracks all three.

    **1. List the accounts and their password age.**

    ```
    Get-ADUser daffy.duck, lola.bunny, foghorn.leghorn -Properties PasswordLastSet,Enabled |
      Select-Object SamAccountName, Enabled, PasswordLastSet
    ```

    **2. Rotate each one to its own unique value** (or disable the account
    if it should not exist at all):

    ```
    Set-ADAccountPassword -Identity daffy.duck -Reset -NewPassword (ConvertTo-SecureString '<new unique password>' -AsPlainText -Force)
    ```

    The check asks for a real change after the account was created --
    a password that is still the seeded pattern does not score.
- id: w1_07_svc_all_reined_in
  type: powershell_json
  category: vuln
  display: "W1: The svc-all service account no longer holds admin rights and its password expires"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $u = Get-LocalUser -Name 'svc-all' -ErrorAction SilentlyContinue
      if (-not $u) { $true | ConvertTo-Json -Compress }
      else {
        $admins = @(Get-LocalGroupMember -Group 'Administrators' -ErrorAction SilentlyContinue | ForEach-Object { if ($_.Name) { ($_.Name -split '\\')[-1] } })
        $notDa = -not ($admins -contains 'svc-all')
        $expires = (-not $u.PasswordNeverExpires)
        ($notDa -and $expires) | ConvertTo-Json -Compress
      }
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    `svc-all` authenticates with special privileges and its password never
    expires -- the twin of the shared DB password that felled the source
    range: one compromise and the box is gone.

    **1. Audit scope.** One administrative credential used from every host
    is uncontainable.

    **2. Fix any of:** remove it from local Administrators, make the
    password expire again, rotate it, or delete the account:

    ```
    Remove-LocalGroupMember -Group Administrators -Member 'svc-all'
    Set-LocalUser -Name 'svc-all' -PasswordNeverExpires:$false
    Set-LocalUser -Name 'svc-all' -Password (ConvertTo-SecureString '<new password>' -AsPlainText -Force)
    ```

    Deleting the account always satisfies the check.
- id: w1_08_administrator_password_rotated
  type: powershell_json
  category: vuln
  display: "W1: The built-in Administrator account's password has been rotated since the image was built"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $ref = Get-Item 'C:\ProgramData\huitzilopochtli\manifest.signed.json' -ErrorAction SilentlyContinue
      if (-not $ref) { $false | ConvertTo-Json -Compress }
      else {
        Import-Module ActiveDirectory -ErrorAction Ignore
        $u = Get-ADUser -Identity 'Administrator' -Properties PasswordLastSet -ErrorAction SilentlyContinue
        ([bool]$u -and [bool]$u.PasswordLastSet -and ($u.PasswordLastSet -gt $ref.LastWriteTime)) | ConvertTo-Json -Compress
      }
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The Administrator password is the one value every account-spray in the
    source competition hammered for 14 straight minutes -- and it was a
    weak pattern value, unchanged since build.

    **1. Check the age.** `PasswordLastSet` must postdate the image install
    (the scoring agent's manifest timestamp is the reference).

    ```
    Get-ADUser Administrator -Properties PasswordLastSet | Select-Object PasswordLastSet
    ```

    **2. Rotate it to something unique and strong.** This is the account of
    record -- do not reuse the pattern.

    ```
    Set-ADAccountPassword -Identity Administrator -Reset -NewPassword (ConvertTo-SecureString '<strong unique password>' -AsPlainText -Force)
    ```

    The check accepts only a genuine rotation, not the seeded value.
- id: w1_09_guest_disabled
  type: powershell_json
  category: vuln
  display: "W1: The Guest account is disabled"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      Import-Module ActiveDirectory -ErrorAction Ignore
      $g = Get-ADUser -Identity 'Guest' -Properties Enabled -ErrorAction SilentlyContinue
      ([bool]$g -and (-not $g.Enabled)) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The domain Guest account is enabled on the image.

    ```
    Get-ADUser Guest -Properties Enabled
    Disable-ADAccount -Identity Guest
    ```

    Confirm Enabled reads `False`.
- id: w1_10_uac_on
  type: registry_value
  category: vuln
  display: "W1: UAC is re-enabled (EnableLUA=1)"
  max_points: 5
  timeout_s: 20
  collect:
    hive: HKLM
    key: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    value: EnableLUA
  expect:
    equals: 1
    field: value
    points: 5
  solution: |
    With UAC's EnableLUA disabled, every interactive session is a full
    administrator session and the token harderening is gone.

    ```
    Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableLUA -Value 1 -Type DWord
    ```

    A reboot applies it cleanly to new logons.
- id: w1_11_rdp_nla_on
  type: registry_value
  category: vuln
  display: "W1: RDP requires network-level authentication (UserAuthentication=1)"
  max_points: 5
  timeout_s: 20
  collect:
    hive: HKLM
    key: SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
    value: UserAuthentication
  expect:
    equals: 1
    field: value
    points: 5
  solution: |
    RDP itself must stay UP (it is a scored service) -- but it must demand
    NLA so pre-auth clients cannot grind credentials.

    ```
    Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' UserAuthentication
    Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1 -Type DWord
    ```
- id: w1_12_windows_update_unfrozen
  type: powershell_json
  category: vuln
  display: "W1: Windows Update access and service are restored"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $blocked = $false
      $pol = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate' -ErrorAction Ignore
      $au = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' -ErrorAction Ignore
      $svc = Get-CimInstance -ClassName Win32_Service -Filter "Name='wuauserv'" -ErrorAction SilentlyContinue
      if ($pol -and $pol.DisableWindowsUpdateAccess -eq 1) { $blocked = $true }
      if ($au -and $au.NoAutoUpdate -eq 1) { $blocked = $true }
      if ($svc -and $svc.StartMode -eq 'Disabled') { $blocked = $true }
      (-not $blocked) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The image freezes the patch level: WU access disabled, the service off.
    Every hotfix after the freeze date is missing by construction.

    ```
    Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate' -Name DisableWindowsUpdateAccess -Value 0 -Type DWord
    Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' -Name NoAutoUpdate -Value 0 -Type DWord
    Set-Service wuauserv -StartupType Manual
    Start-Service wuauserv
    ```

    All three blockers must go: the policy value, the AU policy, and the
    service start type.
- id: w1_13_autologin_removed
  type: powershell_json
  category: vuln
  display: "W1: No stored autologin credential remains in Winlogon"
  max_points: 5
  timeout_s: 20
  collect:
    script: |
      $k = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -ErrorAction Ignore
      $auto = $k.AutoAdminLogon
      $pw = $k.DefaultPassword
      (($auto -ne '1') -and (-not $pw)) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    Winlogon carries both the autologin switch and a plaintext password
    value readable by any local process.

    ```
    Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' AutoAdminLogon, DefaultPassword
    Remove-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name AutoAdminLogon
    Remove-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name DefaultPassword
    ```
- id: w1_14_lsa_ppl_on
  type: registry_value
  category: vuln
  display: "W1: LSA runs protected (RunAsPPL=1)"
  max_points: 5
  timeout_s: 20
  collect:
    hive: HKLM
    key: SYSTEM\CurrentControlSet\Control\Lsa
    value: RunAsPPL
  expect:
    equals: 1
    field: value
    points: 5
  solution: |
    LSA Protection Level off means any local admin can read credential
    material from LSASS.

    ```
    Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name RunAsPPL -Value 1 -Type DWord
    ```
# ------------------------------------------------- W2: credential attack surface
- id: w2_01_password_policy_reset
  type: powershell_json
  category: vuln
  display: "W2: The domain password policy enforces lockout, real length, and a finite max age"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $out = net accounts 2>$null | Out-String
      $lock = 0; $len = 0; $max = 0
      if ($out -match 'Lockout threshold:\s+(\d+)') { $lock = [int]$Matches[1] }
      if ($out -match 'Minimum password length:\s+(\d+)') { $len = [int]$Matches[1] }
      if ($out -match 'Maximum password age \(days\):\s+(\d+)') { $max = [int]$Matches[1] }
      (($lock -ge 5) -and ($len -ge 8) -and ($max -ge 1) -and ($max -le 90)) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    No lockout, a 4-character floor, and no maximum age: the policy that let
    319 failed logons in the source competition's window go unanswered.

    ```
    net accounts
    net accounts /minpwlen:8 /lockoutthreshold:5 /maxpwage:90
    ```

    All three numbers must move: threshold >= 5, length >= 8, max age
    1-90 days (`Unlimited` does not score).
- id: w2_02_anonymous_token_hardened
  type: registry_value
  category: vuln
  display: "W2: Anonymous tokens no longer map into Everyone (EveryoneIncludesAnonymous=0)"
  max_points: 5
  timeout_s: 20
  collect:
    hive: HKLM
    key: SYSTEM\CurrentControlSet\Control\Lsa
    value: EveryoneIncludesAnonymous
  expect:
    equals: 0
    field: value
    points: 5
  solution: |
    With anonymous tokens folded into Everyone, every 'Everyone' ACL on the
    box is reachable without credentials -- the null-session path the
    source attacker used 21 times.

    ```
    Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name EveryoneIncludesAnonymous -Value 0 -Type DWord
    ```
- id: w2_03_ntlm_floor_raised
  type: powershell_json
  category: vuln
  display: "W2: LM/NTLMv1 are refused (LmCompatibilityLevel >= 3)"
  max_points: 5
  timeout_s: 20
  collect:
    script: |
      $v = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name LmCompatibilityLevel -ErrorAction Ignore).LmCompatibilityLevel
      (($null -ne $v) -and ($v -ge 3)) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    Level 0 sends LM and NTLM -- downgrade-able, replay-able, and the
    reason the source attacker's blank-workstation NTLM logons worked.

    ```
    Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name LmCompatibilityLevel -Value 3 -Type DWord
    ```
- id: w2_04_wdigest_off
  type: powershell_json
  category: vuln
  display: "W2: WDigest no longer caches logon credentials in cleartext"
  max_points: 5
  timeout_s: 20
  collect:
    script: |
      $v = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest' -Name UseLogonCredential -ErrorAction Ignore).UseLogonCredential
      ((($null -eq $v) -or ($v -eq 0))) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    With UseLogonCredential=1, cleartext passwords wait in lsass memory for
    anyone who can read it.

    ```
    Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest' -Name UseLogonCredential -Value 0 -Type DWord
    ```

    Deleting the value entirely also satisfies the check (a fresh value in
    Server 2022 would simply not exist).
- id: w2_05_ldap_signing_required
  type: registry_value
  category: vuln
  display: "W2: LDAP server integrity requires signing (LDAPServerIntegrity=2)"
  max_points: 5
  timeout_s: 20
  collect:
    hive: HKLM
    key: SYSTEM\CurrentControlSet\Services\NTDS\Parameters
    value: LDAPServerIntegrity
  expect:
    equals: 2
    field: value
    points: 5
  solution: |
    LDAP signing off on a DC is what makes the NTLM relay/null-session
    toString work against directory traffic.

    ```
    Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters' -Name LDAPServerIntegrity -Value 2 -Type DWord
    ```
- id: w2_06_anonymous_enum_blocked
  type: powershell_json
  category: vuln
  display: "W2: Anonymous SAM/LSA enumeration is restricted"
  max_points: 5
  timeout_s: 20
  collect:
    script: |
      $ra = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name RestrictAnonymous -ErrorAction Ignore).RestrictAnonymous
      $ras = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name RestrictAnonymousSAM -ErrorAction Ignore).RestrictAnonymousSAM
      (($ra -eq 1) -and ($ras -eq 1)) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    Both values must be 1: the unauthenticated-fist-phase user enumeration
    that stocked the source attacker's spray list is what these two keys
    gate.

    ```
    Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name RestrictAnonymous -Value 1 -Type DWord
    Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name RestrictAnonymousSAM -Value 1 -Type DWord
    ```
- id: w2_07_smb1_disabled
  type: powershell_json
  category: vuln
  display: "W2: SMBv1 is disabled"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $v = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' -Name SMB1 -ErrorAction Ignore).SMB1
      ((($null -eq $v) -or ($v -eq 0))) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    SMBv1 is a 30-year protocol with an unpatchable-era exploit history.

    ```
    Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' -Name SMB1 -Value 0 -Type DWord
    ```
    Restart the LanmanServer service (or the box) to apply it.
- id: w2_08_uts_ps1_removed
  type: permission
  category: vuln
  display: "W2: The cleartext-credential helper script C:\\Windows\\uts.ps1 is gone"
  max_points: 5
  timeout_s: 20
  collect:
    path: 'C:\Windows\uts.ps1'
  expect:
    equals: false
    field: exists
    points: 5
  solution: |
    A script parked directly in `C:\Windows` (run as SYSTEM in the source
    competition's timeline) with live credentials inside it.

    ```
    Get-Content 'C:\Windows\uts.ps1'
    Remove-Item 'C:\Windows\uts.ps1'
    ```

    Read it first, rotate whatever credential it exposes, then delete it.
- id: w2_09_corpus_creds_removed
  type: powershell_json
  category: vuln
  display: "W2: The LLM corpus directory holds no credential sheets"
  max_points: 5
  timeout_s: 20
  collect:
    script: |
      (-not (Test-Path 'C:\GavelportAI\corpus')) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    A retrieval corpus ingested by the county's AI assistant ships with a
    staff credential sheet inside it: the corpus itself becomes an
    exfiltration path -- ask the assistant a question, receive a password.

    ```
    Get-ChildItem -Recurse 'C:\GavelportAI\corpus' | Select-Object FullName
    Remove-Item -Recurse -Force 'C:\GavelportAI\corpus'
    ```

    If the corpus must stay, the sheets must not; the check scores the
    directory gone entirely.
- id: w2_10_gpp_cpassword_purged
  type: powershell_json
  category: vuln
  display: "W2: No Group Policy Preferences file carries an MS14-025 cpassword"
  max_points: 5
  timeout_s: 45
  collect:
    script: |
      $hits = @()
      $pol = 'C:\Windows\SYSVOL\domain\Policies'
      if (Test-Path $pol) {
        $hits = @(Get-ChildItem -Path $pol -Recurse -Filter 'Groups.xml' -ErrorAction SilentlyContinue |
          Select-String -Pattern 'cpassword' -SimpleMatch -ErrorAction SilentlyContinue)
      }
      ($hits.Count -eq 0) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The GPP `cpassword` attribute encrypts every local-account credential
    with a key Microsoft published in MS14-025 -- anyone who can read
    SYSVOL decrypts the box's roster password.

    ```
    Get-ChildItem 'C:\Windows\SYSVOL\domain\Policies' -Recurse -Filter Groups.xml |
      Select-String cpassword -SimpleMatch
    ```

    Fix by deleting the GPP credential entry (or the whole GPO); the sweep
    across SYSVOL must come back empty.
# ------------------------------------------------ W3: domain escalation to DA
- id: w3_01_da_stray_speedy_removed
  type: powershell_json
