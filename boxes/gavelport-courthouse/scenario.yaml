- id: w4_01_secureupdate_task_removed
  type: powershell_json
  category: vuln
  display: "W4: The netsh firewall-kill task \\SecureUpdate and its payload are gone, and the firewall is back on"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $t = Get-ScheduledTask -TaskPath '\' -TaskName 'SecureUpdate' -ErrorAction SilentlyContinue
      $pay = Test-Path 'C:\ProgramData\SecureUpdate\update-check.ps1'
      $profilesOn = (@(Get-NetFirewallProfile -ErrorAction SilentlyContinue) | Where-Object { -not $_.Enabled }).Count -eq 0
      ((-not $t) -and (-not $pay) -and $profilesOn) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The registered SYSTEM task that keeps turning the firewall back off
    (the source competition's visible hourly `netsh` tug-of-war against the
    blue team's re-enables).

    ```
    Get-ScheduledTask -TaskPath '\' | Where-Object TaskName -in 'SecureUpdate','SuperSecureUpdate','TheMostSecureUpdate'
    Get-ScheduledTask -TaskPath '\' -TaskName 'SecureUpdate' | Select-Object -ExpandProperty Actions
    ```

