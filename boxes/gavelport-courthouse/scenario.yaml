- id: w4_08_ifeo_blocklist_clean
  type: powershell_json
  category: vuln
  display: "W4: No IFEO Debugger entry silently kills launched executables"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $ifeo = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options'
      $blocked = 0
      Get-ChildItem -Path $ifeo -ErrorAction SilentlyContinue | ForEach-Object {
        $d = (Get-ItemProperty -Path $_.PSPath -Name Debugger -ErrorAction SilentlyContinue).Debugger
