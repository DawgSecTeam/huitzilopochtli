    deleted, and every firewall profile re-enabled.

    ```
    Unregister-ScheduledTask -TaskName 'SecureUpdate' -Confirm:$false
    Remove-Item -Recurse -Force 'C:\ProgramData\SecureUpdate'
    Set-NetFirewallProfile -All -Enabled True
    ```
- id: w4_02_supersecureupdate_removed
