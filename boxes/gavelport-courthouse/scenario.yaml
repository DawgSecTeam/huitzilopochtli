      $a = Get-ScheduledTask -TaskPath '\' -TaskName 'HelpDeskMon' -ErrorAction SilentlyContinue
      $b = Get-ScheduledTask -TaskPath '\' -TaskName 'HelpDeskUpd' -ErrorAction SilentlyContinue
      $pay = (Test-Path 'C:\ProgramData\Microsoft\HelpDesk\watch-ensure.ps1') -or (Test-Path 'C:\ProgramData\Microsoft\HelpDesk\deskmon.exe') -or (Test-Path 'C:\ProgramData\Microsoft\HelpDesk\helpupd.exe')
      ((-not $a) -and (-not $b) -and (-not $pay)) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    Two tasks that re-register each other once a minute: deleting either
    alone, it comes back. Unregister BOTH, then remove the payload
    directory.

    ```
    Unregister-ScheduledTask -TaskName 'HelpDeskMon' -Confirm:$false
    Unregister-ScheduledTask -TaskName 'HelpDeskUpd' -Confirm:$false
    Remove-Item -Recurse -Force 'C:\ProgramData\Microsoft\HelpDesk'
    ```
- id: w4_11_deny_delete_artifact_removed
  type: permission
  category: vuln
  display: "W4: The deny-delete marker artifact is gone"
  max_points: 5
  timeout_s: 20
  collect:
    path: 'C:\Windows\System32\WinDefSvcHelper.dat'
  expect:
    equals: false
    field: exists
    points: 5
  solution: |
    A file armored against deletion: read-only bit, an Everyone DENY on
    delete/child-delete, System integrity level. You cannot delete it until
    you unwind the armor:

    ```
    icacls 'C:\Windows\System32\WinDefSvcHelper.dat'
    icacls 'C:\Windows\System32\WinDefSvcHelper.dat' /reset
    attrib -r 'C:\Windows\System32\WinDefSvcHelper.dat'
    Remove-Item 'C:\Windows\System32\WinDefSvcHelper.dat'
    ```

    Take ownership (`takeown /f`) if the reset path resists. The check
    scores only the file's absence.
- id: w4_12_locked_service_removed
  type: powershell_json
  category: vuln
  display: "W4: The SYSTEM-only service (WinCryptSvc32) is removed after its lockdown is unwound"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $svc = Get-CimInstance -ClassName Win32_Service -Filter "Name='WinCryptSvc32'" -ErrorAction SilentlyContinue
      (-not $svc) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The service is present and unmanageable: its security descriptor
    grants everything only to SYSTEM, so even an Administrator cannot
    stop or delete it through the normal path.

    ```
    sc.exe sdshow WinCryptSvc32
    $sd = sc.exe sdshow WinCryptSvc32 | Select-Object -Skip 1
    sc.exe sdset WinCryptSvc32 'D:(A;;CCLCSWRPWPDTLOCRRC;;;SY)(A;;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;BA)(A;;CCLCSWLOCRRC;;;AU)'
    sc.exe stop WinCryptSvc32
    sc.exe delete WinCryptSvc32
    ```

    The service must be GONE for the score (an SD reset that leaves the
    service in place does not satisfy the check).
- id: w4_13_respawn_user_gone
  type: user_group
  category: vuln
  display: "W4: The respawned service account (svc_helper) stays gone"
  max_points: 5
  timeout_s: 30
  collect: {}
  expect:
    user_absent: true
    username: svc_helper
    points: 5
  solution: |
    A SYSTEM task re-creates this account every 60 seconds. Delete the
    account without unregistering the task and it returns; kill the task
    first.

    ```
    Get-ScheduledTask -TaskPath '\' -TaskName 'WinUserAccountHelper' | Select-Object -ExpandProperty Actions
    Unregister-ScheduledTask -TaskName 'WinUserAccountHelper' -Confirm:$false
    net user svc_helper /delete
    ```

    The check wants the account absent from the local user list.
- id: w4_14_runkey_removed
  type: powershell_json
  category: vuln
  display: "W4: The WinDefSvcHelper Run-key persistence and its payload are gone"
  max_points: 5
  timeout_s: 20
  collect:
    script: |
      $v = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'WinDefSvcHelper' -ErrorAction SilentlyContinue).WinDefSvcHelper
      $pay = Test-Path 'C:\ProgramData\Subsystems\winitupd.ps1'
      ((-not $v) -and (-not $pay)) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    A machine-wide Run value plus the script it launches -- classic two-part
    persistence; removing only the key leaves the payload, and vice versa.

    ```
    Remove-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'WinDefSvcHelper'
    Remove-Item -Force 'C:\ProgramData\Subsystems\winitupd.ps1'
    ```
- id: w4_15_wmi_subscription_removed
  type: powershell_json
  category: vuln
  display: "W4: The WMI event subscription (WinPerf filter/consumer) and its payload are gone"
  max_points: 5
  timeout_s: 30
  collect:
    script: |
      $ns = 'root\subscription'
      $bind = @(Get-CimInstance -Namespace $ns -ClassName __FilterToConsumerBinding -ErrorAction SilentlyContinue | Where-Object { $_.Filter -like '*WinPerfFilter*' })
      $filt = @(Get-CimInstance -Namespace $ns -ClassName __EventFilter -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'WinPerfFilter' })
      $cons = @(Get-CimInstance -Namespace $ns -ClassName CommandLineEventConsumer -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'WinPerfConsumer' })
      $pay = Test-Path 'C:\ProgramData\Subsystems\perf-sync.ps1'
      ((($bind.Count -eq 0) -and ($filt.Count -eq 0) -and ($cons.Count -eq 0) -and (-not $pay))) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    A filter (a timer query), a consumer (the command line), and the
    binding that welds them: remove all three, in that order of attention.

    ```
    Get-CimInstance -Namespace root\subscription -ClassName __FilterToConsumerBinding | Where-Object { $_.Filter -like '*WinPerf*' }
    Get-CimInstance -Namespace root\subscription -ClassName __EventFilter -Filter "Name='WinPerfFilter'" | Remove-CimInstance
    Get-CimInstance -Namespace root\subscription -ClassName CommandLineEventConsumer -Filter "Name='WinPerfConsumer'" | Remove-CimInstance
    Remove-Item -Force 'C:\ProgramData\Subsystems\perf-sync.ps1'
    ```
- id: w4_16_start_item_removed
  type: permission
  category: vuln
  display: "W4: The all-users Startup folder item (svc-status) is gone"
  max_points: 5
  timeout_s: 20
  collect:
    path: 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\svc-status.bat'
  expect:
    equals: false
    field: exists
    points: 5
  solution: |
    An all-users Startup batch file that launches the payload for every
    interactive logon -- the most visible of the persistence set and the
    easiest to overlook for exactly that reason.

    ```
    Get-Content 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\svc-status.bat'
    Remove-Item 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\svc-status.bat'
    ```
- id: w4_17_appinit_clean
  type: powershell_json
  category: vuln
  display: "W4: No AppInit/AppCert DLL hook is registered"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $win = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows' -ErrorAction Ignore
      $app = $win.AppInit_DLLs
      $load = $win.LoadAppInit_DLLs
      $certKey = Get-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\AppCertDLLs' -ErrorAction Ignore
      $certVals = @()
      if ($certKey) {
        $certVals = @($certKey.GetValueNames() | Where-Object { $certKey.GetValue($_) })
      }
      $appOk = ((-not $app) -or ($app -eq ''))
      $loadOk = (($null -eq $load) -or ($load -eq 0) -or ($load -eq '0'))
      $hookFile = Test-Path 'C:\ProgramData\Subsystems\inproc_helper.dll'
      (($appOk -and $loadOk -and ($certVals.Count -eq 0) -and (-not $hookFile))) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    AppInit_DLLs and AppCertDLLs are machine-wide DLL load hooks: any
    process that loads USER32 or creates processes pulls the planted
    library.

    ```
    Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows' AppInit_DLLs, LoadAppInit_DLLs
    Get-Item 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\AppCertDLLs'
    ```

    Empty `AppInit_DLLs`, set `LoadAppInit_DLLs=0`, empty the AppCertDLLs
    subkey, and delete the placeholder DLL.
- id: w4_18_winlogon_shell_restored
  type: powershell_json
  category: vuln
  display: "W4: The Winlogon Userinit value launches no planted payload"
  max_points: 5
  timeout_s: 20
  collect:
    script: |
      $ui = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name Userinit -ErrorAction SilentlyContinue).Userinit
      $exe = Test-Path 'C:\ProgramData\Subsystems\winitupd.exe'
      $clean = (-not ($ui -match 'winitupd'))
      ((-not $exe) -and $clean) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The Winlogon `Userinit` value launches at every interactive logon --
    before the user ever appears -- and the plant appended its own binary
    to it.

    ```
    Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' Userinit
    Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name Userinit -Value 'C:\Windows\system32\userinit.exe,'
    Remove-Item -Force 'C:\ProgramData\Subsystems\winitupd.exe'
    ```

    The value must reference only userinit once more, and the payload must
    be gone.
