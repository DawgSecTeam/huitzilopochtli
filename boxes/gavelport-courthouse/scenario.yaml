- id: w5_01_webshell_removed
  type: permission
  category: vuln
  display: "W5: The cmd.aspx JScript shell is gone from the IIS webroot"
  max_points: 5
  timeout_s: 20
  collect:
    path: 'C:\inetpub\wwwroot\cmd.aspx'
  expect:
    equals: false
    field: exists
    points: 5
  solution: |
    A one-line JScript `eval(Request.Item["cmd"])` page in the default
    webroot -- a command prompt over HTTP for anyone who can reach the site.

    ```
    Get-Content 'C:\inetpub\wwwroot\cmd.aspx'
    Remove-Item 'C:\inetpub\wwwroot\cmd.aspx'
    ```

    While you are in Defender (the w4_05 finding), drop the matching
    webroot exclusion too.
- id: w5_02_admin_console_removed
  type: powershell_json
  category: vuln
  display: "W5: The SaltmarshAdmin console site and its firewall rule are gone"
  max_points: 5
  timeout_s: 30
  collect:
    script: |
      Import-Module WebAdministration -ErrorAction Ignore
      $site = Get-Website -Name 'SaltmarshAdmin' -ErrorAction SilentlyContinue
      $rule = Get-NetFirewallRule -Name 'SaltmarshAdmin' -ErrorAction SilentlyContinue
      (($null -eq $site) -and ($null -eq $rule)) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    An internal admin console published on 8080 by its own inbound firewall
    rule -- the whole finding is the pairing: site + publish rule.

    ```
    Get-Website | Select-Object Name, State, PhysicalPath, Bindings
    Remove-Website -Name 'SaltmarshAdmin'
    Remove-NetFirewallRule -Name 'SaltmarshAdmin'
    ```
- id: w5_03_backoffice_auth_closed
  type: powershell_json
  category: vuln
  display: "W5: The SaltmarshPortal backoffice application requires real credentials"
  max_points: 5
  timeout_s: 30
  collect:
    script: |
      Import-Module WebAdministration -ErrorAction Ignore
      $ok = $true
      if (Get-WebApplication -Site 'SaltmarshPortal' -Name 'backoffice' -ErrorAction SilentlyContinue) {
        $bo = 'IIS:\Sites\SaltmarshPortal\backoffice'
        $anon = (Get-WebConfiguration -PSPath $bo -Filter 'system.webServer/security/authentication/anonymousAuthentication' -ErrorAction Ignore).enabled
        $basic = (Get-WebConfiguration -PSPath $bo -Filter 'system.webServer/security/authentication/basicAuthentication' -ErrorAction Ignore).enabled
        if ([bool]$anon) { $ok = $false }
        if ([bool]$basic) { $ok = $false }
      }
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    Anonymous AND basic auth both open on the backoffice application:
    unauthenticated browsing with an HTTP-cleartext password option.

    ```
    $bo = 'IIS:\Sites\SaltmarshPortal\backoffice'
    Set-WebConfigurationProperty -PSPath $bo -Filter 'system.webServer/security/authentication/anonymousAuthentication' -Name enabled -Value $false
    Set-WebConfigurationProperty -PSPath $bo -Filter 'system.webServer/security/authentication/basicAuthentication' -Name enabled -Value $false
    ```

    Deleting the backoffice application entirely also satisfies the check.
- id: w5_04_rpcproxy_disabled
  type: powershell_json
  category: vuln
  display: "W5: RPC-over-HTTPS proxying is disabled on the domain controller"
  max_points: 5
  timeout_s: 30
  collect:
    script: |
      $rpc = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Rpc\RpcProxy' -ErrorAction Ignore)
      $enabled = $rpc.Enabled
      $valid = $rpc.ValidPorts
      $ok = ((($null -eq $enabled) -or ($enabled -eq 0)) -and ((-not $valid) -or ($valid -eq '')))
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The RpcProxy role turns the DC's web site into an authenticated tunnel
    into inner-ring RPC endpoints (Outlook-Anywhere-style exposure nobody
    on a county records network asked for).

    ```
    Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Rpc\RpcProxy'
    Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Rpc\RpcProxy' -Name Enabled -Value 0 -Type DWord
    Remove-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Rpc\RpcProxy' -Name ValidPorts -ErrorAction SilentlyContinue
    ```

    Any `Rpc`/`RpcWithCert` applications left on IIS sites should go with
    it (`Get-WebApplication` / `Remove-WebApplication`).
- id: w5_05_ftp_locked_or_removed
  type: powershell_json
  category: vuln
  display: "W5: No FTP site accepts anonymous authentication"
  max_points: 5
  timeout_s: 45
  collect:
    script: |
      Import-Module WebAdministration -ErrorAction Ignore
      $ok = $true
      $sites = @('VendorDrop')
      foreach ($s in $sites) {
        if (-not (Get-Website -Name $s -ErrorAction SilentlyContinue) -and -not ((Get-Website -ErrorAction Ignore) | Where-Object { Get-WebConfiguration -PSPath ("MACHINE/WEBROOT/APPHOST/sites/site[@name='" + $s + "']") -Filter 'system.ftpServer' -ErrorAction Ignore })) { continue }
        $v = (Get-WebConfiguration -PSPath "MACHINE/WEBROOT/APPHOST" -Filter "system.applicationHost/sites/site[@name='$s']/ftpServer/security/authentication/anonymousAuthentication" -ErrorAction Ignore).enabled
        if ([bool]$v) { $ok = $false }
      }
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The VendorDrop FTP site is the vector: an anonymous-readable drop
    seeded from outside.

    ```
    Import-Module WebAdministration
    Get-Website | Select-Object Name, Bindings
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter "system.applicationHost/sites/site[@name='VendorDrop']/ftpServer/security/authentication/anonymousAuthentication" `
      -Name enabled -Value $false
    Restart-Service FTPSVC -Force
    ```

    Removing the FTP site entirely (`Remove-Website -Name VendorDrop`)
    also satisfies the check.
- id: w5_06_ftp_drop_content_gated
  type: powershell_json
  category: vuln
  display: "W5: No FTP authorization rule grants wildcard/Everyone access, and the anonymous drop content is not public"
  max_points: 5
  timeout_s: 45
  collect:
    script: |
      Import-Module WebAdministration -ErrorAction Ignore
      $ok = $true
      $rules = @(Get-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter 'system.ftpServer/security/authorization' -ErrorAction Ignore | ForEach-Object { $_.Collection } | Where-Object { $_ })
      foreach ($r in $rules) {
        if ($r.accessType -eq 'Allow' -and ($r.users -eq '*' -or $r.roles -eq 'Everyone' -or $r.users -match 'Everyone')) { $ok = $false }
      }
      if (Test-Path 'C:\inetpub\ftproot\MyFtpSite\TASKS.txt') {
        $acl = Get-Acl 'C:\inetpub\ftproot\MyFtpSite\TASKS.txt' -ErrorAction Ignore
        if ($acl) {
          $evl = @($acl.Access | Where-Object { $_.IdentityReference -match 'Everyone' })
          if ($evl.Count -gt 0) { $ok = $false }
        }
      }
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    Two faces of the same drop: authorization rules that say "anyone" and
    a seeded content directory readable by Everyone.

    ```
    Get-WebConfiguration 'MACHINE/WEBROOT/APPHOST' -Filter 'system.ftpServer/security/authorization'
    Clear-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter 'system.ftpServer/security/authorization'
    Add-WebConfiguration 'MACHINE/WEBROOT/APPHOST' -Filter 'system.ftpServer/security/authorization' -Value @{accessType='Allow'; users='ftp_vendor'; permissions='Read, Write'}
    icacls 'C:\inetpub\ftproot\MyFtpSite' /remove:g Everyone
    ```

    If the anonymous drop content itself should not exist, delete the
    MyFtpSite directory instead of securing it.
- id: w5_07_ftp_hardening_restored
  type: powershell_json
  category: vuln
  display: "W5: The FTP service requires TLS on the control channel again"
  max_points: 5
  timeout_s: 45
  collect:
    script: |
      Import-Module WebAdministration -ErrorAction Ignore
      $ok = $true
      if (Get-Website -Name 'VendorDrop' -ErrorAction SilentlyContinue) {
        $cc = (Get-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter "system.applicationHost/sites/site[@name='VendorDrop']/ftpServer/security/ssl" -ErrorAction Ignore).controlChannelPolicy
        if ($cc -ne 'SslRequire') { $ok = $false }
      }
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The build's own hardening row ran backwards: SSL was flipped to
    "allow" and the anonymous switch re-opened. Restore TLS as required on
    the VendorDrop site (or remove the site; the check accepts removal).

    ```
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter "system.applicationHost/sites/site[@name='VendorDrop']/ftpServer/security/ssl" `
      -Name controlChannelPolicy -Value 'SslRequire'
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter "system.applicationHost/sites/site[@name='VendorDrop']/ftpServer/security/ssl" `
      -Name dataChannelPolicy -Value 'SslRequire'
    Restart-Service FTPSVC -Force
    ```
- id: w5_08_rdp_secondary_removed
  type: powershell_json
  category: vuln
  display: "W5: The secondary RDP listener (RDP-Tcp2 on 3388) is gone"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $k = (Get-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp2' -ErrorAction SilentlyContinue)
      $port = $null
      if ($k) { $port = $k.GetValue('PortNumber') }
      $listen = @(Get-NetTCPConnection -LocalPort 3388 -State Listen -ErrorAction SilentlyContinue)
      ((($null -eq $port) -or ($port -ne 3388)) -and ($listen.Count -eq 0)) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    A second RDP listener on a nonstandard port survives Port Keepalive
    scans precisely because nobody looks at 3388; it re-materializes at
    boot unless the WinStations key goes.

    ```
    Get-NetTCPConnection -State Listen -LocalPort 3388 -ErrorAction SilentlyContinue
    Remove-Item 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp2' -Recurse
    Remove-NetFirewallRule -DisplayName 'RDP-Secondary' -ErrorAction SilentlyContinue
    ```

    Reboot to release the listener immediately; the key removal is the
    scored fact.
- id: w5_09_rdp_users_clean
  type: powershell_json
  category: vuln
  display: "W5: svc_helper is not in the Remote Desktop Users group"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $m = @(Get-LocalGroupMember -Group 'Remote Desktop Users' -ErrorAction SilentlyContinue | ForEach-Object { if ($_.Name) { ($_.Name -split '\\')[-1] } })
      (-not ($m -contains 'svc_helper')) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    A service account in Remote Desktop Users is an RDP-capable identity
    with no humans attached -- after the respawn task (w4_13) is killed,
    strip its seat too.

    ```
    Get-LocalGroupMember 'Remote Desktop Users'
    Remove-LocalGroupMember -Group 'Remote Desktop Users' -Member 'svc_helper'
    ```
- id: w5_10_no_wan_nic
  type: powershell_json
  category: vuln
  display: "W5: No network adapter sits on the perimeter subnet with external resolvers"
  max_points: 5
  timeout_s: 30
  collect:
    script: |
      $wanIp = $false
      $extDns = $false
      $ips = @(Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue)
      foreach ($i in $ips) {
        if ($i.IPAddress -like '10.250.250.*') { $wanIp = $true }
      }
      foreach ($n in @(Get-DnsClientServerAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue)) {
        foreach ($s in @($n.ServerAddresses)) {
          if ($s -in @('1.1.1.1','8.8.8.8')) { $extDns = $true }
        }
      }
      ((-not $wanIp) -and (-not $extDns)) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    A second network card on the perimeter range with public DNS servers
    splits the box's trust boundary and republishes every local listener
    toward the WAN side of the range.

    ```
    Get-NetIPConfiguration | Select-Object InterfaceAlias, IPv4Address
    Get-DnsClientServerAddress
    Remove-NetIPAddress -InterfaceAlias <WAN adapter name> -IPAddress 10.250.250.10 -Confirm:$false
    Set-DnsClientServerAddress -InterfaceAlias <WAN adapter name> -ResetServerAddresses
    ```

    Both scored facts must go: the 10.250.250.x address AND the 1.1.1.1 /
    8.8.8.8 resolver configuration.
- id: w5_11_c_share_removed
  type: powershell_json
  category: vuln
  display: "W5: The C$-adjacent all-access 'C' share is removed or restricted"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $s = Get-SmbShare -Name 'C' -ErrorAction SilentlyContinue
      $ok = $true
      if ($s) {
        $ev = @($s | Get-SmbShareAccess -ErrorAction SilentlyContinue | Where-Object { $_.AccountName -match 'Everyone' })
        if ($ev.Count -gt 0) { $ok = $false }
      }
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    A share literally named `C` -- the whole drive -- handed to Everyone.
    Not the hidden administrative C$; a separate, visible one.

    ```
    Get-SmbShare | Select-Object Name, Path
    Get-SmbShareAccess -Name 'C'
    Remove-SmbShare -Name 'C' -Force
    ```

    Restricting the ACL to named principals also satisfies the check; but
    on a DC a whole-drive share should simply not exist.
- id: w5_12_quiet_share_locked
  type: powershell_json
  category: vuln
  display: "W5: The quiet second SMB share (ACME-Share) is not open to Everyone"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $s = Get-SmbShare -Name 'ACME-Share' -ErrorAction SilentlyContinue
      $ok = $true
      if ($s) {
        $ev = @($s | Get-SmbShareAccess -ErrorAction SilentlyContinue | Where-Object { ($_.AccountName -match 'Everyone') -and ($_.AccessRight -match 'Full|Change') })
        if ($ev.Count -gt 0) { $ok = $false }
      }
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The share you find on the second sweep: nothing in its name states a
    purpose, Everyone holds Full, and it stays up across reboots.

    ```
    Get-SmbShareAccess -Name 'ACME-Share'
    Revoke-SmbShareAccess -Name 'ACME-Share' -AccountName 'Everyone' -Force
    ```

    Removing the share entirely is the cleanest score.
# ------------------------------------------------ W6: local privesc by construction
- id: w6_01_no_blank_password_accounts
  type: powershell_json
  category: vuln
  display: "W6: No enabled domain account tolerates a blank password"
  max_points: 5
  timeout_s: 30
  collect:
    script: |
      Import-Module ActiveDirectory -ErrorAction Ignore
      $bad = @(Get-ADUser -Filter { Enabled -eq $true -and PasswordNotRequired -eq $true } -ErrorAction SilentlyContinue)
      ($bad.Count -eq 0) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    An enabled account whose flag says "password not required" may be
    logged into with an empty password on the DC.

    ```
    Get-ADUser -Filter 'Enabled -eq $true -and PasswordNotRequired -eq $true'
    Set-ADAccountControl -Identity intern.acme -PasswordNotRequired $false
    Set-ADAccountPassword -Identity intern.acme -Reset -NewPassword (ConvertTo-SecureString '<real password>' -AsPlainText -Force)
    ```

    Disabling or deleting the account also satisfies the check.
- id: w6_02_always_install_elevated_off
  type: powershell_json
  category: vuln
  display: "W6: AlwaysInstallElevated is off in both policy hives"
  max_points: 5
  timeout_s: 20
  collect:
    script: |
      $m = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer' -Name AlwaysInstallElevated -ErrorAction Ignore).AlwaysInstallElevated
      $u = (Get-ItemProperty -Path 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\Installer' -Name AlwaysInstallElevated -ErrorAction Ignore).AlwaysInstallElevated
      $ok = ((($null -eq $m) -or ($m -eq 0)) -and (($null -eq $u) -or ($u -eq 0)))
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    With both hives set to 1, any MSI runs as SYSTEM when a non-admin
    double-clicks it -- a guaranteed local-to-SYSTEM ladder.

    ```
    Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer' -Name AlwaysInstallElevated -Value 0 -Type DWord
    Set-ItemProperty 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\Installer' -Name AlwaysInstallElevated -Value 0 -Type DWord
    ```

    Both hives must read 0 (or the value absent).
- id: w6_03_deploy_creds_acl_locked
  type: powershell_json
  category: vuln
  display: "W6: The deploy credentials file is no longer world-readable"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $p = 'C:\ProgramData\Gavelport\deploy-creds.txt'
      $ok = $true
      if (Test-Path $p) {
        $acl = Get-Acl -LiteralPath $p -ErrorAction SilentlyContinue
        if ($acl) {
          $ev = @($acl.Access | Where-Object { ($_.IdentityReference -match 'Everyone') -and ($_.AccessControlType -eq 'Allow') })
          if ($ev.Count -gt 0) { $ok = $false }
        }
      }
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The deploy credentials file carries Everyone:(F) -- every created local
    process can read the box's standing credentials.

    ```
    icacls 'C:\ProgramData\Gavelport\deploy-creds.txt'
    icacls 'C:\ProgramData\Gavelport\deploy-creds.txt' /inheritance:r /grant 'SYSTEM:F' 'BUILTIN\Administrators:F'
    ```

    Reading the file first is the point -- rotate whatever it exposes.
    Deleting the file is also an acceptable fix (the check reads no file).
- id: w6_04_ssh_deploy_key_removed
  type: powershell_json
  category: vuln
  display: "W6: The Windows OpenSSH administrators_authorized_keys file carries no planted key"
  max_points: 5
  timeout_s: 20
  collect:
    script: |
      $f = 'C:\ProgramData\ssh\administrators_authorized_keys'
      $ok = $true
      if (Test-Path $f) {
        $lines = @(Get-Content $f -ErrorAction SilentlyContinue | Where-Object { $_ -match 'ssh-(ed25519|rsa) ' })
        if ($lines.Count -gt 0) { $ok = $false }
      }
      $ok | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    An attacker's key in `administrators_authorized_keys` survives every
    password rotation: no group membership required, the file's ACL alone
    makes it a SYSTEM+Admins backdoor.

    ```
    Get-Content 'C:\ProgramData\ssh\administrators_authorized_keys'
    ```

    (Answer the forensics question about the key's comment STRING before
    removing it.)

    Remove the key line -- if the file ends up empty, delete it; either
    state scores. The acl on the file (SYSTEM + Administrators only) is
    correct and should stay.
- id: w6_05_interactive_logon_hardened
  type: powershell_json
  category: vuln
  display: "W6: The logon screen hides the last username and requires Ctrl+Alt+Del"
  max_points: 5
  timeout_s: 20
  collect:
    script: |
      $d = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name dontdisplaylastusername -ErrorAction Ignore).dontdisplaylastusername
      $cad = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name DisableCAD -ErrorAction Ignore).DisableCAD
      (($d -eq 1) -and (($null -eq $cad) -or ($cad -eq 0))) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The image trusts its console: last username displayed, secure-attention
    sequence skipped. On a shared terminal, the first is half a credential;
    harden both.

    ```
    Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name dontdisplaylastusername -Value 1 -Type DWord
    Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name DisableCAD -Value 0 -Type DWord
    ```
- id: w6_06_acmedeploy_disabled
  type: user_group
  category: vuln
  display: "W6: The acmedeploy account is disabled"
  max_points: 5
  timeout_s: 30
  collect: {}
  expect:
    user_absent: true
    username: acmedeploy
    points: 5
  solution: |
    A standing build/deploy account left enabled with a weak password:
    either kill the account or make it unusable.

    ```
    net user acmedeploy /delete
    ```
    Or: `Disable-LocalUser -Name acmedeploy` -- the check reads the local
    user list and wants the account gone. (Disabled accounts still show in
    the user list; make it `Enabled: False` in `Get-LocalUser` AND confirm
    the roster does not need it, or simply delete.)
- id: w6_07_acmedeploy_not_admin
  type: powershell_json
  category: vuln
  display: "W6: The acmedeploy account holds no local administrator rights"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $m = @(Get-LocalGroupMember -Group 'Administrators' -ErrorAction SilentlyContinue | ForEach-Object { if ($_.Name) { ($_.Name -split '\\')[-1] } })
      (-not ($m -contains 'acmedeploy')) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    The deploy account was granted a seat in local Administrators. Strip
    the seat:

    ```
    Remove-LocalGroupMember -Group Administrators -Member acmedeploy
    ```
- id: w6_08_execution_policy_locked
  type: powershell_json
  category: vuln
  display: "W6: The machine-wide PowerShell execution policy is Restricted or AllSigned"
  max_points: 5
  timeout_s: 20
  collect:
    script: |
      $pol = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction Ignore).ExecutionPolicy
      $en = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell' -Name EnableScripts -ErrorAction Ignore).EnableScripts
      $polOk = ($pol -in @('Restricted','AllSigned'))
      $enOk = (($null -eq $en) -or ($en -eq 0))
      ($polOk -and $enOk) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    Unrestricted everywhere means every dropped .ps1 runs without a
    prompt; Restricted (or AllSigned) restores the default friction
    against script-based replants.

    ```
    Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -Value 'Restricted'
    Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell' -Name EnableScripts -Value 0 -Type DWord
    ```

    Write the registry values directly -- a `Set-ExecutionPolicy` call from
    a policy-scoped context throws; the two writes above ARE the machine
    policy.

    Both facets must read locked: the ShellIds policy string AND the
    EnableScripts machine policy.

forensics:
- id: fq-da-stray1
  points: 10
  question: Two ordinary user accounts were promoted into Domain Admins before you arrived. What is the SamAccountName of the FIRST of them?
  answer: speedy.gonzales
  answers: ["speedy.gonzales", "speedy gonzales", "speedy"]
  solution: '`Get-ADGroupMember "Domain Admins" | Select SamAccountName` -- one of the
    two cartoon-cast names is the first stray the log events recorded. The
    competition timeline shows both were added in the same minute.'
- id: fq-da-stray2
  points: 10
  question: What is the SamAccountName of the SECOND stray Domain Admins member?
  answer: marvin.martian
  answers: ["marvin.martian", "marvin martian", "marvin"]
  solution: 'Same roster query as the first stray: `Get-ADGroupMember "Domain Admins"`.
    Both were added together; remove both.'
- id: fq-dnscache-path
  points: 10
  question: One PowerShell module directory under WindowsPowerShell\v1.0\Modules is not what its name says it is. What is its FULL path?
  answer: 'C:\Windows\system32\WindowsPowerShell\v1.0\Modules\DNSCache'
  answers:
  - 'C:\Windows\System32\WindowsPowerShell\v1.0\Modules\DNSCache'
  - C:\Windows\system32\WindowsPowerShell\v1.0\Modules\DNSCache\
  solution: 'A directory sweep reads wrong at the top (the name is the benign
    DNS client cache). The content gives it away: the bootstrap exports
    `Get-ADDBAccount` / `Get-ADReplAccount` / `Get-ADDBBackupKey`. Read it
    BEFORE deleting -- the path is the answer.'
- id: fq-task-netsh
  points: 10
  question: One scheduled task keeps firing `netsh advfirewall set allprofiles state off`. What is the registered task's name?
  answer: \SecureUpdate
  answers: ["\\SecureUpdate", SecureUpdate, "Secure Update"]
  solution: '`Get-ScheduledTask -TaskPath "\" | Where TaskName -in "SecureUpdate","SuperSecureUpdate","TheMostSecureUpdate"`
    and inspect each `Actions` line -- exactly one payload runs net against
    the firewall profiles. The name says the least.'
- id: fq-pattern-user
  points: 10
  question: Three accounts share one password pattern. Whose password is exactly `Daffy!Acme4103`?
  answer: daffy.duck
  answers: ["daffy.duck", "daffy duck", daffy]
  solution: 'The pattern is `Name!AcmeNNNN` -- first name, exclamation, `Acme`,
    four digits. Each planted account carries its own first name in that
    same position, so the fact that the password leads with `Daffy!`
    identifies the account directly.'
- id: fq-svc-account
  points: 10
  question: One never-expiring service account on the box holds admin rights and authenticates from every host. What is its name?
  answer: svc-all
  answers: ["svc-all", svc_all, "svcall"]
  solution: '`Get-LocalUser | Where PasswordNeverExpires` -- the one with a
    description that says monitoring/ops and a seat in the Administrators
    group. One shared credential, every host.'
- id: fq-ifeo-tool
  points: 10
  question: The IFEO `Debugger` blocklist silently kills security tools. Give the name of ONE executable it blocks.
  answer: Autoruns.exe
  answers: ["Autoruns.exe", "Autoruns64.exe", "autoruns", "procexp.exe", "procexp64.exe", "procmon.exe", "taskmgr.exe", "mmc.exe", "Sysmon.exe"]
  solution: 'Enumerate the Image File Execution Options subkeys whose
    `Debugger` value points at `cmd.exe /c exit`:

    ```
    Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options" |
      ForEach-Object { $d = (Get-ItemProperty $_.PSPath Debugger).Debugger; if ($d) { "$($_.PSChildName) -> $d" } }
    ```'
- id: fq-ssh-key-comment
  points: 10
  question: An attacker's key is planted in the Windows OpenSSH administrators_authorized_keys file. What is the comment string on that key?
  answer: anvil-backup
  answers: ["anvil-backup", anvil_backup, anvilbackup]
  solution: '`C:\ProgramData\ssh\administrators_authorized_keys` -- a single
    line, one key, and its comment is the last whitespace-separated field.
    Read it BEFORE you remove the line.'
- id: fq-gpp-gpo
  points: 10
  question: One Group Policy Object in SYSVOL carries an MS14-025 cpassword in its Groups.xml. What is the GPO's display name?
  answer: Gavelport-Deploy
  answers: ["Gavelport-Deploy", "Gavelport Deploy", gavelportdeploy]
  solution: 'Sweep SYSVOL for the attribute:

    ```
    Get-ChildItem "C:\Windows\SYSVOL\domain\Policies" -Recurse -Filter Groups.xml |
      Select-String cpassword -SimpleMatch
    ```

    The GUID in the hit resolves to its display GPO name via
    `Get-GPO -Guid <guid>`; the display name reads like a deploy policy.'
- id: fq-mesh-service
  points: 10
  question: A remote-management agent was staged on this image days before you arrived. What is the exact service name of its agent?
  answer: MeshAgent
  answers: ["MeshAgent", "Mesh Agent"]
  solution: '`Get-CimInstance Win32_Service | Where { $_.PathName -match "Mesh" }` --
    the service that auto-starts from the ProgramData payload directory;
    its install timestamp is the provenance proof (predates your roster
    by days).'

theme:
  title: "Gavelport Courthouse"
  organization: "Gavelport County Municipal Court"
  accent: "#8C1F28"
  logo: assets/logo.png
  wallpaper: assets/wallpaper.png
  readme: assets/README.md
  desktop_shortcuts:
  - name: "Hardening Handbook"
    exec: '%PUBLIC%\Documents\huitzilopochtli\README.html'

ranked:
  engine_url: http://127.0.0.1:8080
  services:
  - id: rdp
    display: Remote Desktop (port 3389)
    type: tcp_port
    collect:
      host: 127.0.0.1
      port: 3389
    expect:
      equals: true
      field: open
    interval_s: 30
    points_per_interval: 2
    max_intervals_per_checkin: 3
  - id: dns
    display: Domain name service (port 53)
    type: tcp_port
    collect:
      host: 127.0.0.1
      port: 53
    expect:
      equals: true
      field: open
    interval_s: 30
    points_per_interval: 2
    max_intervals_per_checkin: 3
  - id: ldap
    display: Active Directory directory (port 389)
    type: tcp_port
    collect:
      host: 127.0.0.1
      port: 389
    expect:
      equals: true
      field: open
    interval_s: 30
    points_per_interval: 2
    max_intervals_per_checkin: 3
  - id: kdc
    display: Kerberos key distribution (port 88)
    type: tcp_port
    collect:
      host: 127.0.0.1
      port: 88
    expect:
      equals: true
      field: open
    interval_s: 30
    points_per_interval: 2
    max_intervals_per_checkin: 3
  - id: smb
    display: File/domain sharing (port 445)
    type: tcp_port
    collect:
      host: 127.0.0.1
      port: 445
    expect:
      equals: true
      field: open
    interval_s: 30
    points_per_interval: 2
    max_intervals_per_checkin: 3
  - id: iis
    display: County web portal (HTTP, port 80)
    type: http_uptime
    collect:
      url: http://127.0.0.1/
    expect:
      equals: 200
      field: status
    interval_s: 60
    points_per_interval: 2
    max_intervals_per_checkin: 3
  pool:
    template_vm_id: "${HUITZILOPOCHTLI_GAVELPORT_COURTHOUSE_POOL_TEMPLATE_VM_ID}"
    template_vm_access_method: rdp
    template_vm_username: "${HUITZILOPOCHTLI_GAVELPORT_COURTHOUSE_POOL_TEMPLATE_USER}"
    template_vm_password: "${HUITZILOPOCHTLI_GAVELPORT_COURTHOUSE_POOL_TEMPLATE_PASSWORD}"
    vm_count: 4
    guac_link_ttl_seconds: 14400
