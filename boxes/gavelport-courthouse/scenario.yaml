- id: w3_10_guest_rid_restored
  type: powershell_json
  category: vuln
  display: "W3: Guest does not carry the Administrator account's SAM identity"
  max_points: 5
  timeout_s: 25
  collect:
    script: |
      $f4 = (Get-ItemProperty -Path 'HKLM:\SAM\SAM\Domains\Account\Users\000001F4' -Name F -ErrorAction SilentlyContinue).F
      $f5 = (Get-ItemProperty -Path 'HKLM:\SAM\SAM\Domains\Account\Users\000001F5' -Name F -ErrorAction SilentlyContinue).F
      $same = $false
      if ($f4 -and $f5) { $same = ((Compare-Object @($f4) @($f5) -SyncWindow 0).Count -eq 0) }
      $g = Get-ADUser -Identity 'Guest' -Properties Enabled -ErrorAction SilentlyContinue
      $guestOff = [bool]$g -and (-not $g.Enabled)
      ($guestOff -or (-not $same)) | ConvertTo-Json -Compress
  expect:
    equals: true
    field: data
    points: 5
  solution: |
    A RID hijack copies the Administrator SAM `F` value (RID 500 identity)
    onto Guest's shell account: every Guest logon is an Administrator logon
    under the hood.

    ```
    reg query 'HKLM\SAM\SAM\Domains\Account\Users\000001F5' /v F      (as SYSTEM)
    reg query 'HKLM\SAM\SAM\Domains\Account\Users\000001F4' /v F
    ```

    The scoring accepts either fix: disable the Guest account, or restore
    its identity (delete/reset Guest so its own SID's F is rebuilt).
    **Read both `F` values before you change anything.**
