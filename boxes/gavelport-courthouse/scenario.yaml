      $filt = @(Get-CimInstance -Namespace $ns -ClassName __EventFilter -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'WinSvcEventFilter' })
      $cons = @(Get-CimInstance -Namespace $ns -ClassName CommandLineEventConsumer -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'WinSvcEventConsumer' })
      $pay = (Test-Path 'C:\ProgramData\Subsystems\dns-refresh.ps1') -or (Test-Path 'C:\ProgramData\Microsoft\Network\svcsplash.exe')
