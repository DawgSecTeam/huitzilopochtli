# Saltmarsh Regional Water Authority: an IIS + FTP web-tier WINDOWS
# hardening box -- the web-edge counterpart to harborline-transit.
# Workgroup member server "swa-web01" (no AD), honor mode, 200 points:
# 37 scored hardening checks (EASY 2 x14, MODERATE 4 x15, HARD 8 x8 =
# 152) + 3 penalty guards (-10 each) + 6 forensics questions (6 x 8 = 48).
# The subject is the agency's public IIS portal and its vendor FTP drop:
# site/binding/app-pool/authentication config, WebDAV/request filtering/
# headers/errors/logging, HTTPS + TLS policy, a planted webshell and
# exposed source/config backups, anonymous/plaintext FTP, FTP isolation/
# ACL/firewall scope, and the local accounts + services behind them.
#
# Ledger pinned by tests/unit/test_boxbuilder_saltmarsh_exchange.py.
#
# LINEAGE: full clone of the workshop IIS/FTP template
# workshop-template-win2022-iis-ftp (Proxmox vmid 164) on the wkshp-pool
# SSD storage. The template carries Windows Server 2022, IIS + FTP,
# local admin sysadmin, and OpenSSH Server + password auth. Build prep on
# the clone: reset sysadmin to Lighthouse2026!, install Python 3.12.10 at
# C:\Python312 with PrependPath, add C:\Python312 to the machine PATH,
# restart sshd. No AD promotion, no DC, no Group Policy.
#
# BUILD ORDER (nakon.json): iis-ftp-base-win installs the IIS Web Server
# + FTP Server roles (plus ASP.NET 4.8, WebDAV, IP restrictions, HTTP
# redirect, management tools) and builds the business-functional
# baseline -- site SaltmarshPortal on host portal.saltmarsh.local, app
# pool, /backoffice application, FTP site VendorDrop, local group
# SaltmarshVendors + account ftp_vendor (Kestrel2026!), ACLs, a
# self-signed FTPS certificate, logging on, and a scoped SaltmarshFtpIn
# rule. The base carries the planted 0-state for the site-level toggles;
# iis-hardening-off-win / iis-backoffice-open-win /
# iis-admin-console-win / ftp-hardening-off-win set the remaining findings,
# and the artifact files + portal-source.zip are planted after the base.
# The account seeds run before the group-add; ftp-hardening-off-win runs
# LAST. Each IIS/FTP seed depends_on iis-ftp-base-win so selecting one
# alone still resolves the base. Role install may take several minutes
# on the first pass; pre-installing IIS/FTP in the template (the base
# seed is idempotent) removes that from the build loop.
#
# 0-STATE: all 37 vuln checks fail and all three guards pass -> exactly
# 0/200. Everything scored is explicitly planted (or explicitly absent:
# no HTTPS binding, no HTTP->HTTPS redirect). No image default is relied
# on, so re-running plant reproduces the baseline; re-plant after a
# harden pass is the revert procedure. Hand-restores are unnecessary for
# the planted state, but note that a team that DELETES an account the
# check requires (svc_webdeploy) or the portal site is restored by the
# base/local-user seeds.
#
# NAME DISCIPLINE: every SITE / APP POOL / FTP SITE / GROUP / USER /
# RULE_NAME / FILE_PATH in nakon.json must match its paired check's
# collect params in scenario.yaml byte-for-byte -- nothing cross-
# validates them (see the unit test).
#
# SEALED 2026-10-20: Proxmox vmid 172 "challenge-saltmarsh-exchange"
# (2 cores / 4096 MB, wkshp-pool SSD, untrustedbr/firewall=1, tags
# workshop). Built on a linked clone (vmid 169) of
# workshop-template-win2022-iis-ftp (164); prep reset sysadmin to
# Lighthouse2026!, installed Python 3.12.10 at C:\Python312 on the
# machine PATH, restarted sshd, and rebridged the build clone to vmbr0.
# compile -> bundle f711cba14edf; plant 22/22 steps, 0 failures; install
# -> honor agent + scheduled task. Baseline grade: total 0/200 (0/152
# vulns, 0 fixed, 37 remaining, 0 penalties, 0 forensics). A five-fix
# probe (directory browsing off, detailed errors off, TRACE denied,
# WebDAV off, FTP anonymous off) graded exactly 12 points and the
# expected five fixed checks; re-plant restored 0/200. The sealed clone
# boot-verified at 0/200 with README.html, Forensics-Questions.txt and
# the webshell present, then clean shutdown, full clone to wkshp-pool,
# and template conversion. Build VM 169 destroyed. Published on the live
# workshop portal (10.0.0.102:5000) through its official admin API
# (POST /api/admin/provision), which assigned the random pool code YEV6G
# "Saltmarsh Exchange" (RDP, group Challenge, public, dispenser, 1 VM,
# 2h links). The API provisioned vmid 1201 as a linked clone on the
# wkshp-pool SSD base (available 1); claim at /claim?code=YEV6G. RDP was
# verified on a disposable clone of vmid 172. A full answer-key
# play-through to 200/200 remains a post-deploy acceptance step.
#
# provider.host below was the build clone 10.0.0.162 (destroyed after
# sealing); point it at a fresh clone's DHCP IP before `boxbuilder build`.
scenario: scenario.ranked.yaml
nakon_config: nakon.json
provider:
  name: ssh
  host: 10.0.0.46
  port: 22
  user: sysadmin
  password: Lighthouse2026!
