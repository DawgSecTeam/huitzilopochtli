scenario:
  name: "Ranked Demo"
  version: 1
  mode: ranked
  engine_url: "http://10.0.0.160:8080"
  hosts: ["localhost"]

checks:
  - id: banner
    type: file_regex
    category: vuln
    display: "Status file says hardened"
    max_points: 10
    collect:
      path: /etc/huitz-demo-status
      extract: '(hardened|vulnerable)'
    expect:
      equals: "hardened"
      points: 10

services:
  - id: web
    display: "Demo web"
    type: http_uptime
    collect: {url: "http://127.0.0.1:8081/health"}
    expect: {equals: 200, field: status}
    interval_s: 30
    points_per_interval: 1
    max_intervals_per_checkin: 3
  - id: ssh
    display: "SSH"
    type: tcp_port
    collect: {host: 127.0.0.1, port: 22}
    expect: {equals: true, field: open}
    interval_s: 30
    points_per_interval: 1
    max_intervals_per_checkin: 3

theme:
  title: "Ranked Demo"
  organization: "DawgSec"
  accent: "#e05d3f"
