# Cocoa Falls Chocolate Works: a light, recognizable factory-themed hardening box.
# The theme is flavor only; every task is solvable from ordinary Linux evidence.
# Each selected nakon configuration plants the insecure state described by its paired check.

scenario:
  name: "Cocoa Falls Chocolate Works"
  version: 1
  mode: honor
  hosts: ["localhost"]

checks:
  # Difficulty spread, called out explicitly per-check below (and in the
  # in-box README) so a self-paced beginner can tell what to try first:
  #   EASY (8):     recipe_private, desktop_vault_code, no_tourguide,
  #                 no_tempscout, no_shipping_bot, no_passwordless_sudo,
  #                 no_malicious_autostart, media_is_not_script
  #   MODERATE (9):  cron_file_private, deploy_key_private, ssh_no_root,
  #                 intern_not_admin, service_account_no_shell,
  #                 no_blank_tempscout_password, cocoaadm_password_set,
  #                 cocoa_service_inactive,
  #                 cocoa_service_disabled
  #   HARD (3):     no_hidden_cron_file, no_hidden_payload,
  #                 no_backdoor_ssh_key
  #
  # GUI-only findings (no terminal needed -- at least 4, called out with
  # "GUI:" below): the three unauthorized accounts show up as login tiles
  # on the greeter before you even reach a desktop; the autostart entry is
  # a checkbox in Settings > Session and Startup > Application Autostart;
  # the vault-code file sits in plain sight on the Desktop.

  # --- basic file permissions --------------------------------------------
  - id: recipe_private
    type: permission
    category: vuln
    display: "Secret recipe is not world-writable (right-click > Properties > Permissions in the file manager)"
    max_points: 10
    collect:
      path: /opt/cocoa/recipes/secret-recipe.txt
    expect:
      mode_at_most: true
      field: mode
      max_mode: "0644"
      points: 10

  - id: desktop_vault_code
    type: permission
    category: vuln
    display: "Warehouse vault code left on the Desktop is not world-writable"
    max_points: 10
    collect:
      path: /home/sysadmin/Desktop/vault-code.txt
    expect:
      mode_at_most: true
      field: mode
      max_mode: "0644"
      points: 10

  - id: cron_file_private
    type: permission
    category: vuln
    display: "Cocoa backup cron file is not world-writable"
    max_points: 10
    collect:
      path: /etc/cron.d/cocoa-backup
    expect:
      mode_at_most: true
      field: mode
      max_mode: "0644"
      points: 10

  - id: deploy_key_private
    type: permission
    category: vuln
    display: "Factory deployment key is private"
    max_points: 10
    collect:
      path: /home/cocoaadm/.ssh/id_rsa
    expect:
      mode_at_most: true
      field: mode
      max_mode: "0600"
      points: 10

  # --- basic access control ----------------------------------------------
  - id: ssh_no_root
    type: file_regex
    category: vuln
    display: "SSH root login is disabled"
    max_points: 10
    collect:
      path: /etc/ssh/sshd_config
      extract: '(?m)^\s*PermitRootLogin\s+(\S+)'
    expect:
      equals: "no"
      points: 10

  - id: cocoaadm_password_set
    type: file_regex
    category: vuln
    display: "Cocoa administrator has a usable password hash"
    max_points: 10
    collect:
      path: /etc/shadow
      extract: '(?m)^cocoaadm:([^:]+):'
    expect:
      regex: '^\$(1|2[aby]?|5|6|y)\$'
      points: 10

  - id: no_passwordless_sudo
    type: permission
    category: vuln
    display: "EASY: No unrestricted passwordless sudo drop-in"
    max_points: 10
    collect:
      path: /etc/sudoers.d/00-cocoa-nopasswd
    expect:
      equals: false
      field: exists
      points: 10


  # --- malicious users and unwanted administration ----------------------
  - id: no_tourguide
    type: user_group
    category: vuln
    display: "Unauthorized tourguide account is removed (shows as a login tile on the greeter)"
    max_points: 10
    collect: {}
    expect:
      user_absent: true
      username: tourguide
      points: 10

  - id: no_tempscout
    type: user_group
    category: vuln
    display: "Unauthorized temp scout account is removed (shows as a login tile on the greeter)"
    max_points: 10
    collect: {}
    expect:
      user_absent: true
      username: tempscout
      points: 10

  - id: no_shipping_bot
    type: user_group
    category: vuln
    display: "Unauthorized shipping-contractor account is removed (shows as a login tile on the greeter)"
    max_points: 10
    collect: {}
    expect:
      user_absent: true
      username: shipping_bot
      points: 10

  - id: intern_not_admin
    type: user_group
    category: vuln
    display: "Intern is not an administrator"
    max_points: 10
    collect: {}
    expect:
      group_members_subset_of: true
      group: sudo
      # Ubuntu's connecting account is the legitimate administrator in the example box.
      allowed: [ubuntu, cocoaadm]
      points: 10

  - id: service_account_no_shell
    type: file_regex
    category: vuln
    display: "Service account has no interactive shell"
    max_points: 10
    collect:
      path: /etc/passwd
      extract: '(?m)^chocobot:[^:]*:[^:]*:[^:]*:[^:]*:[^:]*:(/usr/sbin/nologin|/sbin/nologin)$'
    expect:
      regex: '(?m)^/usr/sbin/nologin$|^/sbin/nologin$'
      points: 10

  - id: no_blank_tempscout_password
    type: file_regex
    category: vuln
    display: "No blank password remains in the shadow database"
    max_points: 10
    collect:
      path: /etc/shadow
      extract: '(?m)^(tempscout::)'
    expect:
      equals: null
      points: 10

  # --- difficult persistence and malicious-file findings ----------------
  - id: no_hidden_cron_file
    type: permission
    category: vuln
    display: "Hidden cocoa cron persistence is removed"
    max_points: 10
    collect:
      path: /etc/cron.d/cocoa-hidden-sync
    expect:
      equals: false
      field: exists
      points: 10

  - id: no_hidden_payload
    type: permission
    category: vuln
    display: "Hidden cocoa payload is removed"
    max_points: 10
    collect:
      path: /opt/.cocoa/cocoa-sync
    expect:
      equals: false
      field: exists
      points: 10

  - id: no_backdoor_ssh_key
    type: file_regex
    category: vuln
    display: "No unauthorized key remains in the admin's authorized_keys"
    max_points: 10
    collect:
      path: /home/cocoaadm/.ssh/authorized_keys
      extract: '(?m)(planted-training-key)'
    expect:
      equals: null
      points: 10

  - id: media_is_not_script
    type: file_regex
    category: vuln
    display: "Shared golden-ticket media is not an executable script (browse to /var/media in the file manager)"
    max_points: 10
    collect:
      path: /var/media/golden-ticket.mp3
      extract: '(?m)^(#!/bin/sh)'
    expect:
      equals: null
      points: 10

  - id: no_malicious_autostart
    type: permission
    category: vuln
    display: "Malicious desktop autostart is removed (Settings > Session and Startup > Application Autostart)"
    max_points: 10
    collect:
      path: /etc/xdg/autostart/cocoa-update.desktop
    expect:
      equals: false
      field: exists
      points: 10

  - id: cocoa_service_inactive
    type: service_state
    category: vuln
    display: "Cocoa update service is inactive"
    max_points: 10
    collect:
      service: cocoa-update.service
    expect:
      equals: false
      field: active
      points: 10

  - id: cocoa_service_disabled
    type: service_state
    category: vuln
    display: "Cocoa update service is disabled"
    max_points: 10
    collect:
      service: cocoa-update.service
    expect:
      equals: false
      field: enabled
      points: 10

theme:
  title: "Cocoa Falls Chocolate Works"
  organization: "Factory Systems Hardening Tour"
  accent: "#8B4A24"
  logo: assets/logo.png
  wallpaper: assets/wallpaper.png
  readme: assets/README.md
  motd: |
    Welcome to Cocoa Falls Chocolate Works.
    This is a protected system, unauthorized access will be prosecuted.
  issue: |
    Cocoa Falls Chocolate Works System
    Disconnect if you are unauthorized.
  desktop_shortcuts:
    # sh -c wrapped so $HOME actually expands -- a bare `~`/`$HOME` in a
    # .desktop Exec= line is not guaranteed to be shell-expanded by whatever
    # launches it (GLib's desktop-entry parsing does quote-removal, not
    # tilde/variable expansion).
    - name: "Factory Hardening Handbook"
      exec: "sh -c 'xdg-open $HOME/Desktop/README.html'"

# Scored forensics questions (CyberPatriot-style): teams type answers into
# Forensics-Questions.txt on the Desktop; the agent re-grades the file each
# pass. Correct answer = full points; wrong or blank = nothing, no penalty.
# Each question must be answerable from the evidence on the box -- every key
# below mirrors a planted vulnerability's check above.
forensics:
  - id: fq-hidden-cron
    question: "A rogue scheduled job keeps phoning home. What is the filename of the hidden cron job?"
    answer: "cocoa-hidden-sync"
    answers: ["/etc/cron.d/cocoa-hidden-sync"]
    points: 10
  - id: fq-sudo-account
    question: "One account was quietly added to the sudo group. Type that account's username."
    answer: "intern"
    points: 10
  - id: fq-media-file
    question: "Something in the shared media shelf (/var/media) is not what it claims to be. Which file?"
    answer: "golden-ticket.mp3"
    answers: ["/var/media/golden-ticket.mp3"]
    points: 10
  - id: fq-ssh-key
    question: "The factory admin's authorized_keys contains a key nobody recognizes. Type the comment/tag at the end of that key's line (the last field, e.g. 'someone@host')."
    answer: "planted-training-key"
    points: 10
